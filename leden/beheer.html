<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8" />
<script>(function(){try{var t=localStorage.getItem('pb_thema');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Beheer — Almere Pickleball</title>
<meta name="robots" content="noindex" />
<link rel="icon" type="image/png" href="/assets/img/logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/assets/leden.css" />
<style>
  .beheer-intro { padding: 2px 2px 16px; }
  .beheer-intro h2 {
    font-family: 'Unbounded', sans-serif; font-size: 17px; margin: 0 0 4px; letter-spacing: -0.01em;
  }
  .beheer-intro p { margin: 0; color: var(--ink-muted); font-size: 13px; }
  .beheer-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 10px;
  }
  .beheer-tegel {
    position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 10px;
    padding: 16px 14px; border-radius: 20px; border: 1px solid var(--glas-rand);
    background: var(--glas-oppervlak); -webkit-backdrop-filter: blur(20px) saturate(160%);
    backdrop-filter: blur(20px) saturate(160%);
    color: var(--ink); font-family: inherit; text-align: left; cursor: pointer;
    box-shadow: 0 6px 18px rgba(4,27,51,0.1), inset 0 1px 0 var(--glas-hooglicht-boven), inset 0 -1px 0 var(--glas-hooglicht-onder);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .beheer-tegel:hover, .beheer-tegel:active {
    transform: translateY(-2px);
    box-shadow: 0 10px 26px rgba(4,27,51,0.16), inset 0 1px 0 var(--glas-hooglicht-boven), inset 0 -1px 0 var(--glas-hooglicht-onder);
  }
  .beheer-tegel .icoon-vlak {
    width: 40px; height: 40px; border-radius: 13px; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, rgba(36,87,255,0.16), rgba(36,87,255,0.06)); color: var(--navy); flex-shrink: 0;
  }
  @media (prefers-color-scheme: dark) { .beheer-tegel .icoon-vlak { color: #8ab6ec; background: linear-gradient(135deg, rgba(138,182,236,0.22), rgba(138,182,236,0.08)); } }
  :root[data-theme="dark"] .beheer-tegel .icoon-vlak { color: #8ab6ec; background: linear-gradient(135deg, rgba(138,182,236,0.22), rgba(138,182,236,0.08)); }
  :root[data-theme="light"] .beheer-tegel .icoon-vlak { color: var(--navy); background: linear-gradient(135deg, rgba(36,87,255,0.16), rgba(36,87,255,0.06)); }
  .beheer-tegel .icoon-vlak svg { width: 20px; height: 20px; }
  .beheer-tegel .label { font-size: 13px; font-weight: 700; line-height: 1.25; }
  .beheer-tegel .badge-getal {
    position: absolute; top: 12px; right: 12px;
    background: var(--gold); color: #241a02; font-size: 10.5px; font-weight: 800;
    border-radius: 999px; padding: 1px 7px; min-width: 16px; text-align: center;
  }
  .popup-overlay {
    position: fixed; inset: 0; background: rgba(4,27,51,0.45); z-index: 100;
    display: flex; align-items: center; justify-content: center; padding: 16px;
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  }
  .popup-kaart {
    background: var(--glas-oppervlak); -webkit-backdrop-filter: blur(24px) saturate(160%);
    backdrop-filter: blur(24px) saturate(160%); border: 1px solid var(--glas-rand);
    border-radius: 22px; width: 100%; max-width: 560px;
    max-height: 88vh; overflow-y: auto; padding: 0; box-sizing: border-box;
    box-shadow: 0 20px 50px rgba(4,27,51,0.35), inset 0 1px 0 var(--glas-hooglicht-boven), inset 0 -1px 0 var(--glas-hooglicht-onder);
  }
  .popup-kop {
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
    padding: 18px 20px; border-bottom: 1px solid var(--glas-rand); position: sticky; top: 0;
    background: var(--glas-oppervlak); -webkit-backdrop-filter: blur(24px) saturate(160%);
    backdrop-filter: blur(24px) saturate(160%); border-radius: 22px 22px 0 0;
  }
  .popup-kop h3 { margin: 0; font-size: 15.5px; font-family: 'Unbounded', sans-serif; }
  .popup-sluit {
    background: rgba(91,107,125,0.12); border: none; border-radius: 50%; width: 30px; height: 30px;
    font-size: 15px; cursor: pointer; color: var(--ink-muted); flex-shrink: 0;
  }
  .popup-lichaam { padding: 18px 20px; }
  .veld-rij { margin-bottom: 10px; min-width: 0; }
  .veld-rij label { display: block; font-size: 12px; color: var(--ink-muted); margin-bottom: 4px; font-weight: 600; }
  .veld-rij input, .veld-rij select, .veld-rij textarea {
    width: 100%; max-width: 100%; box-sizing: border-box; padding: 9px 11px; border-radius: 8px;
    border: 1.5px solid var(--line); background: var(--paper); color: var(--ink); font-size: 13.5px; font-family: inherit;
  }
  .veld-twee { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @media (max-width: 420px) { .veld-twee { grid-template-columns: 1fr; } }
  /* Club-instellingen-kaarten: zelfde afwisselende "mens"/"womens"-kleuren
     als de nieuws-coverflow (assets/leden.css, #141D38/#FCDB32 en
     #3447AA/#FBEAEB) — matcht _instellingKaart in admin_screen.dart (app). */
  .instelling-kaart { border-radius: 14px; padding: 14px; margin-bottom: 14px; }
  .instelling-kaart.mens { background: #141D38; }
  .instelling-kaart.womens { background: #3447AA; }
  .instelling-titel { font-weight: 700; font-size: 14.5px; margin-bottom: 4px; }
  .instelling-kaart.mens .instelling-titel { color: #FCDB32; }
  .instelling-kaart.womens .instelling-titel { color: #FBEAEB; }
  .instelling-uitleg { font-size: 12px; margin-bottom: 10px; }
  .instelling-kaart.mens .instelling-uitleg { color: rgba(252,219,50,0.75); }
  .instelling-kaart.womens .instelling-uitleg { color: rgba(251,234,235,0.75); }
  .instelling-kaart textarea, .instelling-kaart input[type="date"] {
    width: 100%; box-sizing: border-box; padding: 9px 11px; border-radius: 8px; font-size: 13.5px;
    font-family: inherit; background: rgba(255,255,255,0.08); color: #fff;
    border: 1.5px solid rgba(255,255,255,0.25); color-scheme: dark;
  }
  .instelling-kaart.mens textarea, .instelling-kaart.mens input[type="date"] { border-color: rgba(252,219,50,0.4); }
  .instelling-kaart.womens textarea, .instelling-kaart.womens input[type="date"] { border-color: rgba(251,234,235,0.4); }
  .instelling-datums { display: flex; align-items: center; gap: 10px; }
  .instelling-datums input { flex: 1; }
  .instelling-datums span { color: #fff; }
  .instelling-opslaan-rij { display: flex; justify-content: flex-end; margin-top: 10px; }
  .instelling-opslaan-knop { padding: 8px 16px; border-radius: 8px; border: none; font-size: 13px; font-weight: 700; cursor: pointer; }
  .instelling-kaart.mens .instelling-opslaan-knop { background: #FCDB32; color: #141D38; }
  .instelling-kaart.womens .instelling-opslaan-knop { background: #FBEAEB; color: #3447AA; }
  .rij {
    display: flex; justify-content: space-between; align-items: flex-start; gap: 10px;
    padding: 12px 14px; flex-wrap: wrap; background: var(--paper); border: 1px solid var(--line);
    border-radius: 14px; margin-bottom: 8px;
  }
  .rij:last-child { margin-bottom: 0; }
  .rij .info { min-width: 0; flex: 1 1 160px; }
  .rij .naam { font-weight: 700; font-size: 13.5px; word-break: break-word; }
  .rij .sub { font-size: 12px; color: var(--ink-muted); word-break: break-word; }
  .rij .acties { display: flex; gap: 6px; flex-wrap: wrap; flex-shrink: 0; }
  .mini-knop {
    padding: 6px 12px; border-radius: 8px; border: none; font-size: 12px; font-weight: 700; cursor: pointer; white-space: nowrap;
  }
  .mini-knop.goed { background: rgba(20,140,90,0.12); color: #148c5a; }
  .mini-knop.fout { background: rgba(228,29,35,0.1); color: var(--accent); }
  .mini-knop.neutraal { background: rgba(36,87,255,0.1); color: var(--navy); }
  @media (prefers-color-scheme: dark) { .mini-knop.neutraal { color: #8ab6ec; } }
  .prijs-invoer { width: 90px; max-width: 40vw; padding: 6px 8px; border-radius: 6px; border: 1.5px solid var(--line); background: var(--paper); color: var(--ink); font-size: 13px; }
  .badge-status { padding: 2px 9px; border-radius: 999px; font-size: 10.5px; font-weight: 700; white-space: nowrap; }
  .badge-status.in_behandeling, .badge-status.in_afwachting { background: rgba(255,210,63,0.16); color: var(--gold-deep); }
  @media (prefers-color-scheme: dark) { .badge-status.in_behandeling, .badge-status.in_afwachting { color: var(--gold); } }
  .badge-status.geslaagd, .badge-status.goedgekeurd, .badge-status.verwerkt, .badge-status.bevestigd { background: rgba(20,140,90,0.12); color: #148c5a; }
  .badge-status.afgekeurd, .badge-status.mislukt, .badge-status.geannuleerd { background: rgba(228,29,35,0.1); color: var(--accent); }
  .toegang-geweigerd { text-align: center; padding: 60px 20px; color: var(--ink-muted); }
  * { box-sizing: border-box; }
</style>
</head>
<body>
<header>
  <img src="/assets/img/logo.png" alt="" width="40" height="39" style="border-radius: 8px;" />
  <div style="flex: 1; min-width: 0;">
    <div class="merk"></div>
    <h1 data-i18n="navBeheer">Beheer</h1>
  </div>
  <div id="account-plek"></div>
</header>
<main id="hoofd">
  <div class="kaart"><div class="laden">Toegang controleren…</div></div>
</main>
<div id="nav-plek"></div>
<script src="/assets/supabase.js"></script>
<script src="/assets/theme.js"></script>
<script src="/assets/i18n.js"></script>
<script src="/assets/nav.js"></script>
<script>
  const sessie = vereisSessie();
  initNav('beheer');
  const hoofd = document.getElementById('hoofd');

  const niveauLabels = { beginner: 'Beginner', gevorderd: 'Gevorderd', competitie: 'Competitie' };
  const klasseLabels = { open: 'Open', mix: 'Mix', vrouwen: 'Vrouwen', mannen: 'Mannen' };
  const dagnamen = ['maandag', 'dinsdag', 'woensdag', 'donderdag', 'vrijdag', 'zaterdag', 'zondag'];

  function melding(el, tekst, isFout) {
    el.innerHTML = '<div class="melding ' + (isFout ? 'fout' : 'ok') + '">' + tekst + '</div>';
  }

  const SECTIE_ICONEN = {
    proefleden: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 20c0-3.3 2.9-5.8 5.5-5.8s5.5 2.5 5.5 5.8"/><path d="M16 9l1.6 1.6L21 7"/></svg>',
    nieuws: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="3" width="16" height="18" rx="1"/><line x1="7" y1="8" x2="17" y2="8"/><line x1="7" y1="12" x2="17" y2="12"/><line x1="7" y1="16" x2="13" y2="16"/></svg>',
    toernooien: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="9" r="6"/><path d="M9 14L7 21l5-3 5 3-2-7" stroke-linejoin="round"/></svg>',
    speeldagen: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="9" y1="14" x2="15" y2="18"/><line x1="15" y1="14" x2="9" y2="18"/></svg>',
    prijzen: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l8 8-9 9-8-8V4h8z"/><circle cx="8.2" cy="7.8" r="1.4" fill="currentColor" stroke="none"/></svg>',
    instellingen: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 13a7.6 7.6 0 0 0 0-2l2-1.4-2-3.4-2.3.7a7.4 7.4 0 0 0-1.7-1L15 3h-4l-.4 2.9a7.4 7.4 0 0 0-1.7 1l-2.3-.7-2 3.4L6.6 11a7.6 7.6 0 0 0 0 2l-2 1.4 2 3.4 2.3-.7c.5.4 1.1.75 1.7 1L10.6 21h4l.4-2.9c.6-.25 1.2-.6 1.7-1l2.3.7 2-3.4z"/></svg>',
    baanverhuur: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="8" cy="15" r="3.5"/><path d="M10.5 12.5L18 5M18 5l2 2M18 5l-2.5 2.5" stroke-linejoin="round"/></svg>',
    betalingen: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="6" width="18" height="13" rx="2"/><line x1="3" y1="10.5" x2="21" y2="10.5"/><line x1="6.5" y1="15" x2="10.5" y2="15"/></svg>',
    upgrades: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 16V8M8.5 11.5L12 8l3.5 3.5" stroke-linejoin="round"/></svg>',
    wedstrijden: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 3v18" stroke-linecap="round"/><path d="M5 4h11l-2.5 3.5L16 11H5" stroke-linejoin="round"/></svg>',
    leden: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 20c0-3.3 2.9-5.8 5.5-5.8s5.5 2.5 5.5 5.8"/><circle cx="17" cy="9" r="2.4"/><path d="M15.5 12.3c2.2.3 3.8 2.1 3.8 4.4" /></svg>',
  };

  const SECTIES = [
    { key: 'leden', label: 'Leden beheren' },
    { key: 'proefleden', label: 'Proefleden' },
    { key: 'nieuws', label: 'Nieuws' },
    { key: 'toernooien', label: 'Toernooien' },
    { key: 'speeldagen', label: 'Speeldagen & feestdagen' },
    { key: 'prijzen', label: 'Abonnementsprijzen' },
    { key: 'instellingen', label: 'Club-instellingen' },
    { key: 'baanverhuur', label: 'Baanverhuur' },
    { key: 'betalingen', label: 'Betalingen' },
    { key: 'upgrades', label: 'Abo-upgrades' },
    { key: 'wedstrijden', label: 'Gemelde wedstrijden' },
  ];

  async function checkToegang() {
    const rows = await haalOp('leden', { select: 'is_admin', id: 'eq.' + sessie.user_id });
    if (!rows.length || !rows[0].is_admin) {
      hoofd.innerHTML = '<div class="toegang-geweigerd">Dit gedeelte is alleen voor beheerders.<br>' +
        '<a href="/leden/home.html" style="color:var(--navy)">← Terug naar Home</a></div>';
      return false;
    }
    return true;
  }

  async function bouwPagina() {
    const [proeflBadge, wedstrBadge] = await Promise.all([
      haalOp('lid_abonnementen', { select: 'id,goedgekeurd,abonnementen!inner(vorm)', status: 'eq.actief', 'abonnementen.vorm': 'eq.proef' })
        .then(rows => rows.filter(r => !r.goedgekeurd).length).catch(() => 0),
      haalOp('gemelde_wedstrijden', { select: 'id', status: 'eq.in_behandeling' }).then(rows => rows.length).catch(() => 0),
    ]);
    const badges = { proefleden: proeflBadge, wedstrijden: wedstrBadge };

    hoofd.innerHTML =
      '<div class="beheer-intro"><h2>Beheer</h2><p>Kies een onderdeel om te bekijken of aan te passen.</p></div>' +
      '<div class="beheer-grid" id="beheer-grid"></div>';
    const grid = document.getElementById('beheer-grid');
    grid.innerHTML = SECTIES.map(s => '<button type="button" class="beheer-tegel" data-sectie="' + s.key + '">' +
      (badges[s.key] ? '<span class="badge-getal">' + badges[s.key] + '</span>' : '') +
      '<span class="icoon-vlak">' + SECTIE_ICONEN[s.key] + '</span>' +
      '<span class="label">' + s.label + '</span></button>').join('');
    grid.querySelectorAll('[data-sectie]').forEach(btn => btn.addEventListener('click', () => openSectie(btn.dataset.sectie)));
  }

  function toonPopup(titel) {
    const bestaand = document.getElementById('beheer-popup');
    if (bestaand) bestaand.remove();
    const overlay = document.createElement('div');
    overlay.className = 'popup-overlay';
    overlay.id = 'beheer-popup';
    overlay.innerHTML = '<div class="popup-kaart">' +
      '<div class="popup-kop"><h3>' + titel + '</h3><button type="button" class="popup-sluit" aria-label="Sluiten">✕</button></div>' +
      '<div class="popup-lichaam" id="popup-lichaam"><div class="laden">Laden…</div></div></div>';
    overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });
    overlay.querySelector('.popup-sluit').addEventListener('click', () => overlay.remove());
    document.body.appendChild(overlay);
    return document.getElementById('popup-lichaam');
  }

  function openSectie(key) {
    const titels = {
      proefleden: 'Proefleden goedkeuren', nieuws: 'Nieuws plaatsen', toernooien: 'Toernooien',
      speeldagen: 'Speeldagen & feestdagen blokkeren', prijzen: 'Abonnementsprijzen',
      instellingen: 'Club-instellingen', baanverhuur: 'Baanverhuur', betalingen: 'Betalingen',
      upgrades: 'Abo-upgrades naar 2x per week', wedstrijden: 'Gemelde wedstrijden',
      leden: 'Leden beheren',
    };
    const lichaam = toonPopup(titels[key]);
    ({
      proefleden: laadProefleden, nieuws: bouwNieuwsForm, toernooien: bouwToernooienBeheer,
      speeldagen: laadSpeeldagenBeheer, prijzen: laadPrijzen, instellingen: laadInstellingen,
      baanverhuur: laadBaanverhuur, betalingen: laadBetalingen, upgrades: laadUpgrades, wedstrijden: laadWedstrijden,
      leden: laadLedenBeheer,
    })[key](lichaam);
  }

  // ---------- Proefleden ----------
  async function laadProefleden(el) {
    const rows = await haalOp('lid_abonnementen', {
      select: 'lid_id,goedgekeurd,leden(naam,email),abonnementen!inner(vorm)',
      status: 'eq.actief', 'abonnementen.vorm': 'eq.proef',
    });
    const wachtend = rows.filter(r => !r.goedgekeurd);
    if (!wachtend.length) { el.innerHTML = '<p class="details">Geen proefleden in afwachting.</p>'; return; }
    el.innerHTML = wachtend.map(r => '<div class="rij"><div class="info"><div class="naam">' + escapeHtml(r.leden.naam) + '</div>' +
      '<div class="sub">' + escapeHtml(r.leden.email) + '</div></div>' +
      '<div class="acties"><button class="mini-knop goed" data-lid="' + r.lid_id + '">Goedkeuren</button></div></div>').join('');
    el.querySelectorAll('[data-lid]').forEach(btn => btn.addEventListener('click', async () => {
      try { await rpc('keur_proef_goed', { p_lid: btn.dataset.lid }); await laadProefleden(el); }
      catch (e) { alert(e.message); }
    }));
  }

  // ---------- Leden beheren (actief/inactief + ouderlijke toestemming) ----
  async function laadLedenBeheer(el) {
    el.innerHTML = '<input type="search" class="zoekbalk" id="lb-zoek" placeholder="Zoek op naam of e-mail…" style="margin-bottom:10px;width:100%" />' +
      '<div id="lb-lijst"><div class="laden">Laden…</div></div>';
    window.__ledenBeheerLijst = await haalOp('leden', {
      select: 'id,naam,email,actief,ouder_email,ouder_toestemming_vereist,ouder_toestemming_gegeven_op',
      order: 'naam.asc',
    });
    renderLedenBeheer();
    document.getElementById('lb-zoek').addEventListener('input', renderLedenBeheer);
  }

  function renderLedenBeheer() {
    const zoekEl = document.getElementById('lb-zoek');
    const lijstEl = document.getElementById('lb-lijst');
    if (!zoekEl || !lijstEl) return;
    const zoek = zoekEl.value.trim().toLowerCase();
    const gefilterd = window.__ledenBeheerLijst.filter(l =>
      l.naam.toLowerCase().includes(zoek) || (l.email || '').toLowerCase().includes(zoek));
    if (!gefilterd.length) { lijstEl.innerHTML = '<p class="details">Geen leden gevonden.</p>'; return; }
    lijstEl.innerHTML = gefilterd.map(l => {
      const ouderWachtend = l.ouder_toestemming_vereist && !l.ouder_toestemming_gegeven_op;
      return '<div class="rij"><div class="info"><div class="naam">' + escapeHtml(l.naam) +
        (l.actief === false ? ' <span style="color:var(--accent);font-weight:600">· Inactief</span>' : '') +
        (l.ouder_toestemming_vereist
          ? (ouderWachtend
              ? ' <span style="color:var(--accent);font-weight:600">· Wacht op ouderlijke toestemming</span>'
              : ' <span style="color:#148c5a;font-weight:600">· Ouderlijke toestemming bevestigd</span>')
          : '') + '</div>' +
        '<div class="sub">' + escapeHtml(l.email || '') + '</div></div>' +
        '<div class="acties"><button class="mini-knop ' + (l.actief === false ? 'goed' : 'fout') + '" data-lid="' + l.id + '">' +
        (l.actief === false ? 'Activeren' : 'Deactiveren') + '</button>' +
        (ouderWachtend
          ? '<button class="mini-knop neutraal" data-ouder-resend="' + l.id + '">Opnieuw versturen</button>' +
            '<button class="mini-knop neutraal" data-ouder-bevestig="' + l.id + '">Handmatig bevestigen</button>'
          : '') +
        '</div></div>';
    }).join('');
    lijstEl.querySelectorAll('[data-ouder-resend]').forEach(btn => btn.addEventListener('click', async () => {
      const lid = window.__ledenBeheerLijst.find(l => l.id === btn.dataset.ouderResend);
      try {
        await functieAanroepen('stuur-ouder-toestemming', { ouder_email: lid.ouder_email || '', lid_id: lid.id });
        alert('Opnieuw verstuurd.');
      } catch (e) { alert(e.message); }
    }));
    lijstEl.querySelectorAll('[data-ouder-bevestig]').forEach(btn => btn.addEventListener('click', async () => {
      const lid = window.__ledenBeheerLijst.find(l => l.id === btn.dataset.ouderBevestig);
      if (!confirm('Ouderlijke toestemming voor ' + lid.naam + ' handmatig vastleggen?')) return;
      try {
        await rpc('zet_ouder_toestemming_handmatig', { p_lid: lid.id });
        lid.ouder_toestemming_gegeven_op = new Date().toISOString();
        renderLedenBeheer();
      } catch (e) { alert(e.message); }
    }));
    lijstEl.querySelectorAll('[data-lid]').forEach(btn => btn.addEventListener('click', async () => {
      const lid = window.__ledenBeheerLijst.find(l => l.id === btn.dataset.lid);
      const nieuw = lid.actief === false;
      const vraag = nieuw ? (lid.naam + ' weer activeren?')
        : (lid.naam + ' deactiveren? Dit lid kan hierna niet meer inloggen (een lopende sessie wordt binnen een minuut beëindigd) en verdwijnt uit ledenlijsten, ranglijsten en kiezers.');
      if (!confirm(vraag)) return;
      try {
        await rpc('zet_lid_actief', { p_lid: lid.id, p_actief: nieuw });
        lid.actief = nieuw;
        renderLedenBeheer();
      } catch (e) { alert(e.message); }
    }));
  }

  // ---------- Toernooien (aanmaken, bewerken, verwijderen) ----------
  let bewerkToernooiId = null;

  function toernooiFormulierHtml(locaties) {
    const locatieOpties = '<option value="">Geen locatie gekozen</option>' +
      (locaties || []).map(l => '<option value="' + l + '">' + l + '</option>').join('');
    return '<div class="veld-rij"><label>Naam</label><input type="text" id="t-naam" /></div>' +
      '<div class="veld-twee">' +
      '<div class="veld-rij"><label>Datum</label><input type="date" id="t-datum" /></div>' +
      '<div class="veld-rij"><label>Max. deelnemers</label><input type="number" id="t-max" value="32" /></div>' +
      '</div>' +
      '<div class="veld-rij"><label>Locatie (optioneel)</label><select id="t-locatie">' + locatieOpties + '</select></div>' +
      '<div class="veld-twee">' +
      '<div class="veld-rij"><label>Klasse</label><select id="t-klasse">' +
      Object.keys(klasseLabels).map(k => '<option value="' + k + '">' + klasseLabels[k] + '</option>').join('') + '</select></div>' +
      '<div class="veld-rij"><label>Niveau</label><select id="t-niveau"><option value="open">Alle niveaus</option>' +
      Object.keys(niveauLabels).map(n => '<option value="' + n + '">' + niveauLabels[n] + '</option>').join('') + '</select></div>' +
      '</div>' +
      '<div class="veld-twee">' +
      '<div class="veld-rij"><label>Inschrijfwijze</label><select id="t-inschrijfwijze"><option value="paar">Per paar</option><option value="individueel">Individueel</option></select></div>' +
      '<div class="veld-rij"><label>Inschrijfgeld (leeg = gratis)</label><input type="number" step="0.01" id="t-inschrijfgeld" /></div>' +
      '</div>' +
      '<div class="veld-twee">' +
      '<div class="veld-rij"><label>Min. leeftijd (optioneel)</label><input type="number" id="t-min-leeftijd" /></div>' +
      '<div class="veld-rij"><label>Max. leeftijd (optioneel)</label><input type="number" id="t-max-leeftijd" /></div>' +
      '</div>' +
      '<div class="veld-rij"><label>Omschrijving (optioneel)</label><textarea id="t-omschrijving" rows="2"></textarea></div>' +
      '<button class="knop aanmelden" id="t-plaatsen-knop" type="button">Toernooi aanmaken</button>' +
      '<button class="knop" id="t-annuleer-bewerk-knop" type="button" style="display:none;margin-top:6px;background:transparent">Bewerken annuleren</button>' +
      '<div id="t-melding"></div>' +
      '<div id="t-lijst" style="margin-top:16px"></div>';
  }

  function leegToernooiFormulier() {
    document.getElementById('t-naam').value = '';
    document.getElementById('t-datum').value = '';
    document.getElementById('t-max').value = '32';
    document.getElementById('t-locatie').value = '';
    document.getElementById('t-klasse').value = 'open';
    document.getElementById('t-niveau').value = 'open';
    document.getElementById('t-inschrijfwijze').value = 'paar';
    document.getElementById('t-inschrijfgeld').value = '';
    document.getElementById('t-min-leeftijd').value = '';
    document.getElementById('t-max-leeftijd').value = '';
    document.getElementById('t-omschrijving').value = '';
    bewerkToernooiId = null;
    document.getElementById('t-plaatsen-knop').textContent = 'Toernooi aanmaken';
    document.getElementById('t-annuleer-bewerk-knop').style.display = 'none';
  }

  function vulToernooiFormulierIn(t) {
    document.getElementById('t-naam').value = t.naam;
    document.getElementById('t-datum').value = t.datum;
    document.getElementById('t-max').value = t.max_deelnemers || 32;
    document.getElementById('t-locatie').value = t.locatie || '';
    document.getElementById('t-klasse').value = t.klasse || 'open';
    document.getElementById('t-niveau').value = t.niveau || 'open';
    document.getElementById('t-inschrijfwijze').value = t.inschrijfwijze || 'paar';
    document.getElementById('t-inschrijfgeld').value = t.inschrijfgeld != null ? t.inschrijfgeld : '';
    document.getElementById('t-min-leeftijd').value = t.min_leeftijd != null ? t.min_leeftijd : '';
    document.getElementById('t-max-leeftijd').value = t.max_leeftijd != null ? t.max_leeftijd : '';
    document.getElementById('t-omschrijving').value = t.omschrijving || '';
    bewerkToernooiId = t.id;
    document.getElementById('t-plaatsen-knop').textContent = 'Wijzigingen opslaan';
    document.getElementById('t-annuleer-bewerk-knop').style.display = 'block';
    document.getElementById('t-naam').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function toernooiFormulierVelden() {
    return {
      naam: document.getElementById('t-naam').value.trim(),
      datum: document.getElementById('t-datum').value,
      klasse: document.getElementById('t-klasse').value,
      niveau: document.getElementById('t-niveau').value,
      inschrijfwijze: document.getElementById('t-inschrijfwijze').value,
      locatie: document.getElementById('t-locatie').value.trim() || null,
      max_deelnemers: Number(document.getElementById('t-max').value) || 32,
      inschrijfgeld: document.getElementById('t-inschrijfgeld').value ? Number(document.getElementById('t-inschrijfgeld').value) : null,
      min_leeftijd: document.getElementById('t-min-leeftijd').value ? Number(document.getElementById('t-min-leeftijd').value) : null,
      max_leeftijd: document.getElementById('t-max-leeftijd').value ? Number(document.getElementById('t-max-leeftijd').value) : null,
      omschrijving: document.getElementById('t-omschrijving').value.trim() || null,
    };
  }

  async function bouwToernooienBeheer(el) {
    const speeldagen = await haalOp('speeldagen', { select: 'locatie', actief: 'eq.true' });
    const locaties = [...new Set(speeldagen.map(s => s.locatie))];
    el.innerHTML = toernooiFormulierHtml(locaties);
    bewerkToernooiId = null;
    document.getElementById('t-plaatsen-knop').addEventListener('click', async () => {
      const meldingEl = document.getElementById('t-melding');
      const velden = toernooiFormulierVelden();
      if (!velden.naam || !velden.datum) { melding(meldingEl, 'Naam en datum zijn verplicht.', true); return; }
      try {
        if (bewerkToernooiId) {
          await werkBij('toernooien', { id: 'eq.' + bewerkToernooiId }, velden);
          melding(meldingEl, 'Toernooi bijgewerkt.', false);
        } else {
          await voegToe('toernooien', { ...velden, inschrijving_open: true });
          melding(meldingEl, 'Toernooi aangemaakt.', false);
        }
        leegToernooiFormulier();
        await laadToernooienLijst();
      } catch (e) { melding(meldingEl, e.message, true); }
    });
    document.getElementById('t-annuleer-bewerk-knop').addEventListener('click', leegToernooiFormulier);
    laadToernooienLijst();
  }

  async function laadToernooienLijst() {
    const el = document.getElementById('t-lijst');
    if (!el) return;
    const vandaag = new Date().toISOString().substring(0, 10);
    const rows = await haalOp('toernooien', {
      select: 'id,naam,datum,klasse,niveau,inschrijfwijze,locatie,max_deelnemers,inschrijfgeld,min_leeftijd,max_leeftijd,omschrijving,inschrijving_open',
      datum: 'gte.' + vandaag, order: 'created_at.desc',
    });
    if (!rows.length) { el.innerHTML = '<p class="details">Geen aankomende toernooien.</p>'; return; }
    window.__toernooienLijst = rows;
    el.innerHTML = rows.map((t, i) => '<div class="rij"><div class="info"><div class="naam">' + escapeHtml(t.naam) + '</div>' +
      '<div class="sub">' + new Date(t.datum).toLocaleDateString('nl-NL') + '</div></div>' +
      '<div class="acties">' +
      '<button class="mini-knop neutraal" data-bewerk="' + i + '">Bewerken</button>' +
      '<button class="mini-knop ' + (t.inschrijving_open ? 'fout' : 'goed') + '" data-open-toggle="' + t.id + '" data-open="' + t.inschrijving_open + '">' +
      (t.inschrijving_open ? 'Sluiten' : 'Openen') + '</button>' +
      '<button class="mini-knop fout" data-verwijder="' + t.id + '">Verwijderen</button>' +
      '</div></div>').join('');
    el.querySelectorAll('[data-bewerk]').forEach(btn => btn.addEventListener('click', () => vulToernooiFormulierIn(window.__toernooienLijst[Number(btn.dataset.bewerk)])));
    el.querySelectorAll('[data-open-toggle]').forEach(btn => btn.addEventListener('click', async () => {
      await werkBij('toernooien', { id: 'eq.' + btn.dataset.openToggle }, { inschrijving_open: btn.dataset.open !== 'true' });
      await laadToernooienLijst();
    }));
    el.querySelectorAll('[data-verwijder]').forEach(btn => btn.addEventListener('click', async () => {
      if (!confirm('Dit toernooi verwijderen? Dit kan niet ongedaan gemaakt worden.')) return;
      try { await verwijder('toernooien', { id: 'eq.' + btn.dataset.verwijder }); await laadToernooienLijst(); }
      catch (e) { alert(e.message); }
    }));
  }

  // ---------- Speeldagen & blokkeren ----------
  async function laadSpeeldagenBeheer(el) {
    const speeldagen = await haalOp('speeldagen', { select: 'id,weekdag,start_tijd,eind_tijd,locatie,aantal_banen', actief: 'eq.true', order: 'weekdag.asc' });
    const vandaag = new Date().toISOString().substring(0, 10);
    const blokkades = await haalOp('speeldag_uitzonderingen', { select: 'id,speeldag_id,datum,reden', datum: 'gte.' + vandaag, order: 'datum.asc' });

    el.innerHTML =
      '<h2 style="margin-bottom:8px">Aantal banen</h2>' +
      speeldagen.map(sd => '<div class="rij"><div class="info"><div class="naam">' + escapeHtml(sd.locatie) + '</div>' +
        '<div class="sub">' + dagnamen[sd.weekdag - 1] + ' · ' + sd.start_tijd.slice(0, 5) + '–' + sd.eind_tijd.slice(0, 5) + '</div></div>' +
        '<div class="acties" style="align-items:center;gap:10px">' +
        '<button class="mini-knop neutraal" data-banen-min="' + sd.id + '" type="button">−</button>' +
        '<span id="banen-aantal-' + sd.id + '" style="font-weight:700;min-width:16px;text-align:center">' + sd.aantal_banen + '</span>' +
        '<button class="mini-knop neutraal" data-banen-plus="' + sd.id + '" type="button">+</button>' +
        '</div></div>').join('') +
      '<div style="margin-top:20px">' +
      '<h2 style="margin-bottom:8px">Datum blokkeren</h2>' +
      '<div class="veld-rij"><label>Speelavond</label><select id="b-speeldag">' +
      speeldagen.map(sd => '<option value="' + sd.id + '">' + escapeHtml(sd.locatie) + ' (' + dagnamen[sd.weekdag - 1] + ')</option>').join('') +
      '</select></div>' +
      '<div class="veld-twee">' +
      '<div class="veld-rij"><label>Datum</label><input type="date" id="b-datum" /></div>' +
      '<div class="veld-rij"><label>Reden</label><input type="text" id="b-reden" placeholder="bijv. Eerste kerstdag" /></div>' +
      '</div>' +
      '<button class="knop afmelden" id="b-blokkeer-knop" type="button">Datum blokkeren</button>' +
      '<div id="b-melding"></div>' +
      '</div>' +
      '<div style="margin-top:16px"><h2 style="margin-bottom:8px">Geblokkeerde data</h2>' +
      (blokkades.length
        ? blokkades.map(b => {
            const sd = speeldagen.find(s => s.id === b.speeldag_id);
            return '<div class="rij"><div class="info"><div class="naam">' + new Date(b.datum).toLocaleDateString('nl-NL', { day: 'numeric', month: 'long', year: 'numeric' }) + '</div>' +
              '<div class="sub">' + (sd ? escapeHtml(sd.locatie) : '?') + ' · ' + escapeHtml(b.reden) + '</div></div>' +
              '<div class="acties"><button class="mini-knop fout" data-verwijder="' + b.id + '">Verwijderen</button></div></div>';
          }).join('')
        : '<p class="details">Geen geblokkeerde data.</p>') +
      '</div>';

    el.querySelectorAll('[data-banen-min]').forEach(btn => btn.addEventListener('click', async () => {
      const sd = speeldagen.find(s => s.id === Number(btn.dataset.banenMin));
      if (sd.aantal_banen <= 1) return;
      sd.aantal_banen -= 1;
      document.getElementById('banen-aantal-' + sd.id).textContent = sd.aantal_banen;
      await werkBij('speeldagen', { id: 'eq.' + sd.id }, { aantal_banen: sd.aantal_banen });
    }));
    el.querySelectorAll('[data-banen-plus]').forEach(btn => btn.addEventListener('click', async () => {
      const sd = speeldagen.find(s => s.id === Number(btn.dataset.banenPlus));
      if (sd.aantal_banen >= 8) return;
      sd.aantal_banen += 1;
      document.getElementById('banen-aantal-' + sd.id).textContent = sd.aantal_banen;
      await werkBij('speeldagen', { id: 'eq.' + sd.id }, { aantal_banen: sd.aantal_banen });
    }));
    document.getElementById('b-blokkeer-knop').addEventListener('click', async () => {
      const meldingEl = document.getElementById('b-melding');
      const datum = document.getElementById('b-datum').value;
      const reden = document.getElementById('b-reden').value.trim();
      if (!datum || !reden) { melding(meldingEl, 'Datum en reden zijn verplicht.', true); return; }
      try {
        await voegToe('speeldag_uitzonderingen', { speeldag_id: Number(document.getElementById('b-speeldag').value), datum, reden });
        await laadSpeeldagenBeheer(el);
      } catch (e) { melding(meldingEl, e.message, true); }
    });
    el.querySelectorAll('[data-verwijder]').forEach(btn => btn.addEventListener('click', async () => {
      await verwijder('speeldag_uitzonderingen', { id: 'eq.' + btn.dataset.verwijder });
      await laadSpeeldagenBeheer(el);
    }));
  }

  // ---------- Baanverhuur ----------
  async function laadBaanverhuur(el) {
    const rows = await haalOp('baan_verhuur', {
      select: 'id,naam,email,telefoon,start_tijd,eind_tijd,prijs,status,mollie_payment_id,banen(naam)',
      order: 'start_tijd.desc', limit: '50',
    });
    if (!rows.length) { el.innerHTML = '<p class="details">Nog geen boekingen.</p>'; return; }
    window.__baanverhuurLijst = rows;
    el.innerHTML = rows.map((r, i) => {
      const start = new Date(r.start_tijd), eind = new Date(r.eind_tijd);
      return '<div class="rij"><div class="info"><div class="naam">' + (r.banen ? escapeHtml(r.banen.naam) : '?') + ' · ' + escapeHtml(r.naam) + '</div>' +
        '<div class="sub">' + start.toLocaleDateString('nl-NL') + ' ' + start.toTimeString().slice(0, 5) + '–' + eind.toTimeString().slice(0, 5) +
        ' · €' + Number(r.prijs).toFixed(2) + '</div>' +
        '<div class="sub">' + escapeHtml(r.email) + ' · ' + escapeHtml(r.telefoon) + '</div>' +
        '<div class="sub">Mollie: ' + (r.mollie_payment_id || 'nog geen betaling gestart') + '</div></div>' +
        '<div class="acties"><span class="badge-status ' + r.status + '">' + r.status + '</span>' +
        (r.status === 'bevestigd'
          ? '<button class="mini-knop neutraal" data-ticket-inzien="' + i + '">Ticket inzien</button>' +
            '<button class="mini-knop neutraal" data-ticket-versturen="' + i + '">Ticket opnieuw versturen</button>'
          : '') +
        (r.status !== 'geannuleerd' ? '<button class="mini-knop fout" data-annuleer="' + i + '">Annuleren</button>' : '') +
        '</div></div>';
    }).join('');
    el.querySelectorAll('[data-annuleer]').forEach(btn => btn.addEventListener('click', async () => {
      const r = window.__baanverhuurLijst[Number(btn.dataset.annuleer)];
      if (!confirm('Boeking van ' + r.naam + ' annuleren?')) return;
      await werkBij('baan_verhuur', { id: 'eq.' + r.id }, { status: 'geannuleerd' });
      await laadBaanverhuur(el);
    }));
    el.querySelectorAll('[data-ticket-versturen]').forEach(btn => btn.addEventListener('click', async () => {
      const r = window.__baanverhuurLijst[Number(btn.dataset.ticketVersturen)];
      btn.disabled = true;
      try {
        await functieAanroepen('resend-verhuur-ticket', { verhuur_id: r.id, modus: 'versturen' });
        alert('Ticket opnieuw verstuurd naar ' + r.email + '.');
      } catch (e) { alert(e.message); } finally { btn.disabled = false; }
    }));
    el.querySelectorAll('[data-ticket-inzien]').forEach(btn => btn.addEventListener('click', async () => {
      const r = window.__baanverhuurLijst[Number(btn.dataset.ticketInzien)];
      try {
        const { ticket } = await functieAanroepen('resend-verhuur-ticket', { verhuur_id: r.id, modus: 'inzien' });
        toonTicketPopup(ticket);
      } catch (e) { alert(e.message); }
    }));
  }

  function toonTicketPopup(ticket) {
    const bestaand = document.getElementById('ticket-popup');
    if (bestaand) bestaand.remove();
    const overlay = document.createElement('div');
    overlay.className = 'popup-overlay';
    overlay.id = 'ticket-popup';
    overlay.innerHTML = '<div class="popup-kaart" style="max-width:360px">' +
      '<div class="popup-kop"><h3>' + escapeHtml(ticket.baanNaam) + '</h3><button type="button" class="popup-sluit" aria-label="Sluiten">✕</button></div>' +
      '<div class="popup-lichaam" style="text-align:center">' +
      '<div style="font-weight:700;font-size:16px">' + escapeHtml(ticket.datum) + '</div>' +
      '<div style="color:var(--ink-muted);margin-bottom:12px">' + escapeHtml(ticket.tijd) + '</div>' +
      '<img src="' + ticket.qrUrl + '" width="160" height="160" alt="QR-code" />' +
      '<div style="margin-top:12px;font-size:12.5px;color:var(--ink-muted)">Referentie ' + escapeHtml(ticket.referentie) + '</div>' +
      '<div style="font-weight:700;margin-top:4px">€' + escapeHtml(ticket.prijs) + '</div>' +
      '</div></div>';
    overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });
    overlay.querySelector('.popup-sluit').addEventListener('click', () => overlay.remove());
    document.body.appendChild(overlay);
  }

  // ---------- Betalingen ----------
  async function laadBetalingen(el) {
    const rows = await haalOp('lid_abonnementen', {
      select: 'id,status,betaald,leden(naam),abonnementen(naam)',
      status: 'in.(actief,in_afwachting)', order: 'created_at.desc', limit: '50',
    });
    if (!rows.length) { el.innerHTML = '<p class="details">Geen actieve abonnementen.</p>'; return; }
    el.innerHTML = rows.map(r => '<div class="rij"><div class="info"><div class="naam">' + (r.leden ? escapeHtml(r.leden.naam) : '?') + '</div>' +
      '<div class="sub">' + (r.abonnementen ? escapeHtml(r.abonnementen.naam) : '') + '</div></div>' +
      '<div class="acties">' +
      (r.status === 'in_afwachting'
        ? '<span class="badge-status in_afwachting">wacht op Mollie</span>'
        : '<button class="mini-knop ' + (r.betaald ? 'goed' : 'fout') + '" data-la="' + r.id + '" data-betaald="' + r.betaald + '">' + (r.betaald ? 'Betaald' : 'Niet betaald') + '</button>')
      + '</div></div>').join('');
    el.querySelectorAll('[data-la]').forEach(btn => btn.addEventListener('click', async () => {
      const nieuw = btn.dataset.betaald !== 'true';
      await werkBij('lid_abonnementen', { id: 'eq.' + btn.dataset.la }, { betaald: nieuw });
      if (nieuw) {
        // Betaling is bevestigd (contant/eigen overschrijving): eventuele
        // openstaande herinnering voor dit abonnement is dan afgehandeld —
        // anders blijft de banner op home.html ten onrechte "nog niet
        // betaald" tonen, en weigert create-mollie-payment een nieuwe
        // betaalpoging omdat lid_abonnementen.betaald al true is. Matcht
        // _wijzigBetaald in admin_screen.dart (app).
        await werkBij('betaal_herinneringen', { lid_abonnement_id: 'eq.' + btn.dataset.la, voldaan: 'eq.false' }, { voldaan: true });
      }
      await laadBetalingen(el);
    }));
  }

  // ---------- Abonnement-upgrades log ----------
  async function laadUpgrades(el) {
    const rows = await haalOp('betalingen', {
      select: 'bedrag,status,created_at,omschrijving,leden(naam)',
      type: 'eq.abonnement_upgrade', order: 'created_at.desc', limit: '30',
    });
    if (!rows.length) { el.innerHTML = '<p class="details">Nog geen overstappen naar 2x per week.</p>'; return; }
    el.innerHTML = rows.map(r => '<div class="rij"><div class="info"><div class="naam">' + (r.leden ? escapeHtml(r.leden.naam) : '?') + '</div>' +
      '<div class="sub">' + escapeHtml(r.omschrijving) + ' · €' + Number(r.bedrag).toFixed(2) + ' · ' +
      new Date(r.created_at).toLocaleDateString('nl-NL') + '</div></div>' +
      '<div class="acties"><span class="badge-status ' + (r.status === 'geslaagd' ? 'verwerkt' : r.status) + '">' + r.status + '</span></div></div>').join('');
  }

  // ---------- Gemelde wedstrijden ----------
  const typeLabels = { enkel: 'Enkel', dubbel_gemixed: 'Dubbel gemixed', dubbel_vrouwen: 'Dubbel vrouwen', dubbel_mannen: 'Dubbel mannen' };

  async function laadWedstrijden(el) {
    const rows = await haalOp('gemelde_wedstrijden', {
      select: 'id,datum,type,eigen_score,tegen_score,leden!gemelde_wedstrijden_melder_id_fkey(naam)',
      status: 'eq.in_behandeling', order: 'created_at.asc',
    });
    if (!rows.length) { el.innerHTML = '<p class="details">Geen wedstrijden in behandeling.</p>'; return; }
    el.innerHTML = rows.map(w => '<div class="rij"><div class="info"><div class="naam">' + (w.leden ? escapeHtml(w.leden.naam) : '?') + '</div>' +
      '<div class="sub">' + new Date(w.datum).toLocaleDateString('nl-NL') + ' · ' + typeLabels[w.type] + ' · ' + w.eigen_score + '-' + w.tegen_score + '</div></div>' +
      '<div class="acties"><button class="mini-knop goed" data-goed="' + w.id + '">Goedkeuren</button>' +
      '<button class="mini-knop fout" data-af="' + w.id + '">Afkeuren</button></div></div>').join('');
    el.querySelectorAll('[data-goed]').forEach(btn => btn.addEventListener('click', async () => {
      try { await rpc('keur_gemelde_wedstrijd_goed', { p_wedstrijd_id: btn.dataset.goed }); await laadWedstrijden(el); }
      catch (e) { alert(e.message); }
    }));
    el.querySelectorAll('[data-af]').forEach(btn => btn.addEventListener('click', async () => {
      await werkBij('gemelde_wedstrijden', { id: 'eq.' + btn.dataset.af }, {
        status: 'afgekeurd', beoordeeld_door: sessie.user_id, beoordeeld_op: new Date().toISOString(),
      });
      await laadWedstrijden(el);
    }));
  }

  (async () => {
    const toegestaan = await checkToegang();
    if (!toegestaan) return;
    await bouwPagina();
  })().catch(e => { hoofd.innerHTML = '<p class="fout">Kon beheer niet laden: ' + e.message + '</p>'; });
</script>
</body>
