<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8" />
<script>(function(){try{var t=localStorage.getItem('pb_thema');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Nieuws — Almere Pickleball</title>
<meta name="robots" content="noindex" />
<link rel="icon" type="image/png" href="/assets/img/logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/assets/leden.css" />
<style>
  /* Categoriefilter-pillen — 1-op-1 _categoriePil in nieuws_screen.dart. */
  .nieuws-categorieen { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; margin-bottom: 20px; }
  .categorie-pil {
    flex-shrink: 0; padding: 10px 18px; border-radius: 999px; font-size: 13.5px; font-weight: 600;
    background: #fff; color: var(--ink); border: 1.5px solid rgba(11,20,32,0.15); cursor: pointer; font-family: inherit;
    white-space: nowrap;
  }
  :root[data-theme="dark"] .categorie-pil { background: var(--card); color: var(--ink); border-color: rgba(255,255,255,0.15); }
  .categorie-pil.actief {
    background: var(--navy); color: #fff; border-color: var(--navy);
    box-shadow: 0 0 8px rgba(36,87,255,0.2);
  }
  .nieuws-titelblok { margin-bottom: 16px; }
  .nieuws-titelblok h2 { margin: 0; font-size: 22px; font-family: 'Unbounded', sans-serif; }
  .nieuws-titelblok p { margin: 4px 0 0; color: var(--ink-muted); font-size: 14px; }
  .nieuws-leeg-categorie {
    text-align: center; padding: 48px 32px; color: var(--ink-muted); font-size: 14px;
  }
  .popup-overlay {
    position: fixed; inset: 0; background: rgba(4,27,51,0.45); z-index: 100;
    display: flex; align-items: center; justify-content: center; padding: 16px;
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  }
  .popup-kaart {
    background: var(--glas-oppervlak); -webkit-backdrop-filter: blur(24px) saturate(160%);
    backdrop-filter: blur(24px) saturate(160%); border: 1px solid var(--glas-rand);
    border-radius: 22px; width: 100%; max-width: 420px; max-height: 80vh; overflow-y: auto; padding: 0;
    box-shadow: 0 20px 50px rgba(4,27,51,0.35), inset 0 1px 0 var(--glas-hooglicht-boven), inset 0 -1px 0 var(--glas-hooglicht-onder);
  }
  .popup-kop {
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
    padding: 18px 20px; border-bottom: 1px solid var(--glas-rand); position: sticky; top: 0;
    background: var(--glas-oppervlak); -webkit-backdrop-filter: blur(24px) saturate(160%);
    backdrop-filter: blur(24px) saturate(160%); border-radius: 22px 22px 0 0;
  }
  .popup-kop h3 { margin: 0; font-size: 15.5px; font-family: 'Unbounded', sans-serif; }
  .popup-sluit {
    background: rgba(91,107,125,0.12); border: none; border-radius: 50%; width: 30px; height: 30px;
    font-size: 15px; cursor: pointer; color: var(--ink-muted); flex-shrink: 0;
  }
  .popup-lichaam { padding: 18px 20px; }
  .popup-lichaam .lichaam { margin: 10px 0 0; font-size: 14px; line-height: 1.6; white-space: pre-line; }
  .popup-lichaam img { width: 100%; height: 160px; object-fit: cover; border-radius: 14px; }
  .popup-acties { display: flex; justify-content: flex-end; gap: 8px; padding: 14px 20px; border-top: 1px solid var(--line); }
  .popup-acties button {
    padding: 9px 16px; border-radius: 10px; font-size: 13.5px; font-weight: 700; cursor: pointer; font-family: inherit; border: none;
  }
  .popup-acties .verberg-knop { background: transparent; color: var(--ink-muted); }
  .popup-acties .sluit-knop { background: var(--navy); color: #fff; }
</style>
</head>
<body>
<header>
  <img src="/assets/img/logo.png" alt="" width="40" height="39" style="border-radius: 8px;" />
  <div style="flex: 1; min-width: 0;">
    <div class="merk"></div>
    <h1 data-i18n="navNieuws">Nieuws</h1>
  </div>
  <div id="account-plek"></div>
</header>
<main>
  <div class="nieuws-categorieen" id="nieuws-categorieen"></div>
  <div class="nieuws-titelblok">
    <h2>Clubnieuws</h2>
    <p>Het laatste nieuws van de club en uit de pickleballwereld.</p>
  </div>
  <div id="nieuws-deck" class="laden">Laden…</div>
</main>
<div id="nav-plek"></div>
<script src="/assets/supabase.js"></script>
<script src="/assets/theme.js"></script>
<script src="/assets/i18n.js"></script>
<script src="/assets/nav.js"></script>
<script src="/assets/coverflow-deck.js"></script>
<script>
  const sessie = vereisSessie();
  initNav('nieuws');

  const CATEGORIE_VOLGORDE = ['toernooi', 'bond', 'club', 'jeugd', 'algemeen'];
  const categorieLabels = { alle: 'Alle', toernooi: 'Toernooi', bond: 'Bond', club: 'Club', jeugd: 'Jeugd', algemeen: 'Algemeen' };

  let alleBerichten = [];
  let categorie = 'alle';
  let nieuwsDeck = null;

  function nieuwsSleutel(n) { return String(n.id); }

  function toonVolledigNieuws(n) {
    const bestaand = document.getElementById('nieuws-popup');
    if (bestaand) bestaand.remove();
    const overlay = document.createElement('div');
    overlay.className = 'popup-overlay';
    overlay.id = 'nieuws-popup';
    overlay.innerHTML = '<div class="popup-kaart">' +
      '<div class="popup-kop"><h3>' + escapeHtml(n.titel) + '</h3><button type="button" class="popup-sluit" aria-label="Sluiten">✕</button></div>' +
      '<div class="popup-lichaam">' +
      (n.afbeelding_url ? '<img src="' + escapeHtml(n.afbeelding_url) + '" alt="" />' : '') +
      '<p class="lichaam">' + escapeHtml(n.inhoud) + '</p>' +
      '</div>' +
      '<div class="popup-acties">' +
      '<button type="button" class="verberg-knop" id="verberg-nieuws-knop">Verbergen</button>' +
      '<button type="button" class="sluit-knop" id="sluit-nieuws-knop">Sluiten</button>' +
      '</div></div>';
    overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });
    overlay.querySelector('.popup-sluit').addEventListener('click', () => overlay.remove());
    document.getElementById('sluit-nieuws-knop').addEventListener('click', () => overlay.remove());
    document.getElementById('verberg-nieuws-knop').addEventListener('click', async () => {
      overlay.remove();
      await verbergBericht(n.id);
    });
    document.body.appendChild(overlay);
  }

  /// Servergebonden verbergen (nieuws_verborgen-tabel, per lid) i.p.v. de
  /// vroegere localStorage-lijst — zo blijft een verborgen bericht ook op
  /// de app verborgen, en andersom. Matcht nieuws_screen.dart's
  /// _verbergBericht/_laden().
  async function verbergBericht(nieuwsId) {
    try {
      await voegToe('nieuws_verborgen', { lid_id: sessie.user_id, nieuws_id: nieuwsId });
    } catch (e) { /* al verborgen of race met een ander apparaat — negeren */ }
    await laadNieuws();
  }

  function openBericht(n) {
    if (n.link && n.link.startsWith('http')) {
      window.open(n.link, '_blank', 'noopener');
    } else {
      toonVolledigNieuws(n);
    }
  }

  function bouwKaart(n) {
    const foto = n.afbeelding_url
      ? '<img class="cf-foto" src="' + escapeHtml(n.afbeelding_url) + '" alt="" />'
      : '<div class="cf-foto-leeg"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9.5 9.5 L14.5 14.5 M14.5 9.5 L9.5 14.5"/></svg></div>';
    const label = categorieLabels[n.categorie] || categorieLabels.algemeen;
    return foto +
      '<div class="cf-onderlaag">' +
      '<span class="cf-badge">' + escapeHtml(label) + '</span>' +
      '<div class="cf-titel">' + escapeHtml(n.titel) + '</div>' +
      '</div>';
  }

  function renderCategorieen(aanwezig) {
    const el = document.getElementById('nieuws-categorieen');
    const opties = ['alle', ...aanwezig];
    el.innerHTML = opties.map(c =>
      '<button type="button" class="categorie-pil' + (c === categorie ? ' actief' : '') + '" data-categorie="' + c + '">' +
      categorieLabels[c] + '</button>'
    ).join('');
    el.querySelectorAll('[data-categorie]').forEach(btn => {
      btn.addEventListener('click', () => {
        categorie = btn.dataset.categorie;
        renderDeck();
        renderCategorieen(aanwezig);
      });
    });
  }

  function renderDeck() {
    const el = document.getElementById('nieuws-deck');
    const gefilterd = categorie === 'alle' ? alleBerichten : alleBerichten.filter(n => (n.categorie || 'algemeen') === categorie);
    if (!gefilterd.length) {
      el.className = '';
      el.innerHTML = '<div class="nieuws-leeg-categorie">Geen nieuws gevonden in deze categorie.</div>';
      nieuwsDeck = null;
      return;
    }
    el.className = '';
    const kaarten = gefilterd.map(bouwKaart);
    if (nieuwsDeck) {
      el.innerHTML = '';
      nieuwsDeck = null;
    }
    nieuwsDeck = initCoverflowDeck(el, kaarten, {
      leegTekst: 'Nog geen nieuwsberichten.',
      onKaartTik: (index) => openBericht(gefilterd[index]),
    });
  }

  async function laadNieuws() {
    const el = document.getElementById('nieuws-deck');
    const vandaag = new Date().toISOString().substring(0, 10);
    const [rows, verborgenRows] = await Promise.all([
      haalOp('nieuws', {
        select: 'id,titel,inhoud,gepubliceerd_op,categorie,link,afbeelding_url,volgorde',
        or: '(vervaldatum.is.null,vervaldatum.gte.' + vandaag + ')',
        order: 'gepubliceerd_op.desc,volgorde.asc',
        limit: '50',
      }),
      haalOp('nieuws_verborgen', { select: 'nieuws_id', lid_id: 'eq.' + sessie.user_id }),
    ]);
    const verborgenIds = new Set(verborgenRows.map(r => r.nieuws_id));
    alleBerichten = rows.filter(n => !verborgenIds.has(n.id));

    const aanwezig = CATEGORIE_VOLGORDE.filter(c => alleBerichten.some(n => (n.categorie || 'algemeen') === c));
    renderCategorieen(aanwezig);
    renderDeck();
  }

  laadNieuws().catch(e => {
    document.getElementById('nieuws-deck').textContent = 'Kon nieuws niet laden: ' + e.message;
  });
</script>
</body>
</html>
