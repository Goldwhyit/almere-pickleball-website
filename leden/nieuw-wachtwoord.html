<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8" />
<script>(function(){try{var t=localStorage.getItem('pb_thema');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Nieuw wachtwoord — Almere Pickleball</title>
<meta name="robots" content="noindex" />
<link rel="canonical" href="https://www.almerepickleball.nl/leden/nieuw-wachtwoord.html" />
<link rel="icon" type="image/png" href="/assets/img/logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --navy: #2457ff; --navy-deep: #003d82; --accent: #e41d23; --gold: #f9e534; --gold-deep: #b8860a;
    --paper: #f5f8fc; --card: #ffffff; --ink: #0b1420; --ink-muted: #5b6b7d; --line: rgba(4,27,51,0.1);
    --danger: var(--accent);
  }
  @media (prefers-color-scheme: dark) {
    :root { --gold: #dbc90a; --paper: #071224; --card: #101d30; --ink: #eef3f9; --ink-muted: #9fb2c4; --line: rgba(255,255,255,0.12); }
  }
  :root[data-theme="dark"] { --gold: #dbc90a; --paper: #071224; --card: #101d30; --ink: #eef3f9; --ink-muted: #9fb2c4; --line: rgba(255,255,255,0.12); }
  :root[data-theme="light"] { --gold: #f9e534; --paper: #f5f8fc; --card: #ffffff; --ink: #0b1420; --ink-muted: #5b6b7d; --line: rgba(4,27,51,0.1); }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: 'Manrope', -apple-system, sans-serif; background: var(--paper); color: var(--ink);
    padding: 24px;
  }
  .kaart {
    width: 100%; max-width: 380px; background: var(--card); border: 1px solid var(--line);
    border-radius: 20px; padding: 32px 28px; box-shadow: 0 4px 24px rgba(0,0,0,0.06);
  }
  .merk { font-family: 'Unbounded', sans-serif; font-weight: 500; font-size: 12px; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--navy); text-align: center; }
  @media (prefers-color-scheme: dark) { .merk { color: #8ab6ec; } }
  :root[data-theme="dark"] .merk { color: #8ab6ec; }
  h1 { font-family: 'Unbounded', sans-serif; font-size: 22px; margin: 8px 0 4px; text-align: center; }
  p.uitleg { text-align: center; color: var(--ink-muted); font-size: 14px; margin: 0 0 24px; }
  label { display: block; font-size: 13px; font-weight: 600; color: var(--ink-muted); margin-top: 14px; }
  label:first-of-type { margin-top: 0; }
  input {
    width: 100%; margin-top: 6px; padding: 12px 14px; border-radius: 10px; border: 1.5px solid var(--line);
    background: var(--paper); color: var(--ink); font-size: 15px;
  }
  button.primair {
    width: 100%; margin-top: 22px; padding: 13px; border: none; border-radius: 10px;
    background: var(--gold); color: #241a02; font-size: 15px; font-weight: 700; cursor: pointer;
  }
  button.primair:disabled { opacity: 0.5; cursor: default; }
  .fout { color: var(--danger); font-size: 13.5px; margin-top: 12px; text-align: center; }
  .goed { color: #148c5a; font-size: 13.5px; margin-top: 12px; text-align: center; }
  .terug { display: block; text-align: center; margin-top: 20px; font-size: 13px; color: var(--ink-muted); text-decoration: none; }
</style>
</head>
<body>
<div class="kaart">
  <img src="/assets/img/logo.png" alt="Almere Pickleball" width="72" height="70" style="display: block; margin: 0 auto 10px;" />
  <div class="merk">Almere Pickleball</div>
  <h1 id="titel">Nieuw wachtwoord</h1>
  <p class="uitleg" id="uitleg">Kies een nieuw wachtwoord voor je account.</p>

  <form id="wachtwoord-form">
    <label for="wachtwoord">Nieuw wachtwoord</label>
    <input type="password" id="wachtwoord" autocomplete="new-password" minlength="8" required />
    <label for="bevestig">Bevestig wachtwoord</label>
    <input type="password" id="bevestig" autocomplete="new-password" minlength="8" required />
    <button type="submit" class="primair" id="opslaan-knop">Wachtwoord opslaan</button>
    <div class="fout" id="fout-melding"></div>
    <div class="goed" id="goed-melding"></div>
  </form>

  <div id="geen-token-melding" hidden>
    <p class="fout">Deze link is verlopen of ongeldig. Vraag een nieuwe aan via "Wachtwoord vergeten?" op de inlogpagina.</p>
  </div>

  <a class="terug" href="/leden/">← Terug naar inloggen</a>
</div>
<script src="/assets/supabase.js"></script>
<script>
  // Supabase levert de tokens in de URL-hash aan (#access_token=...&type=
  // recovery&...), of een foutmelding (#error=...&error_description=...) als
  // de link al gebruikt/verlopen is — nooit in de querystring, maar we
  // checken defensief ook die kant voor de robuustheid.
  function leesFragmentParams() {
    const bron = window.location.hash ? window.location.hash.substring(1) : window.location.search.substring(1);
    return new URLSearchParams(bron);
  }

  const params = leesFragmentParams();
  const accessToken = params.get('access_token');
  const foutCode = params.get('error') || params.get('error_code');

  const form = document.getElementById('wachtwoord-form');
  const geenTokenEl = document.getElementById('geen-token-melding');

  if (!accessToken || foutCode) {
    form.hidden = true;
    geenTokenEl.hidden = false;
  } else {
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const knop = document.getElementById('opslaan-knop');
      const foutEl = document.getElementById('fout-melding');
      const goedEl = document.getElementById('goed-melding');
      const wachtwoord = document.getElementById('wachtwoord').value;
      const bevestig = document.getElementById('bevestig').value;
      foutEl.textContent = '';
      goedEl.textContent = '';

      if (wachtwoord.length < 8) {
        foutEl.textContent = 'Minimaal 8 tekens.';
        return;
      }
      if (wachtwoord !== bevestig) {
        foutEl.textContent = 'De wachtwoorden komen niet overeen.';
        return;
      }

      knop.disabled = true;
      knop.textContent = 'Bezig…';
      try {
        const resp = await fetch(AUTH_BASE + '/user', {
          method: 'PUT',
          headers: { apikey: ANON_KEY, Authorization: 'Bearer ' + accessToken, 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: wachtwoord }),
        });
        const data = await resp.json().catch(() => ({}));
        if (!resp.ok) throw new Error(data.error_description || data.msg || 'Opslaan is mislukt.');
        form.hidden = true;
        goedEl.textContent = 'Wachtwoord bijgewerkt. Je kunt nu inloggen.';
        document.getElementById('titel').textContent = 'Gelukt';
        document.getElementById('uitleg').hidden = true;
      } catch (err) {
        foutEl.textContent = err.message;
        knop.disabled = false;
        knop.textContent = 'Wachtwoord opslaan';
      }
    });
  }
</script>
<script src="/assets/theme.js"></script>
</body>
</html>
