<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8" />
<script>(function(){try{var t=localStorage.getItem('pb_thema');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Profiel — Almere Pickleball</title>
<meta name="robots" content="noindex" />
<link rel="icon" type="image/png" href="/assets/img/logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/assets/leden.css" />
<style>
  .pil-knop {
    padding: 9px 18px; border-radius: 999px; border: none; font-size: 13px; font-weight: 700;
    cursor: pointer; font-family: inherit; background: var(--navy); color: #fff;
  }
  .pil-knop.secundair { background: transparent; color: var(--navy); border: 1.5px solid var(--navy); }
  @media (prefers-color-scheme: dark) { .pil-knop.secundair { color: #8ab6ec; border-color: #8ab6ec; } }
  .pil-knoppen-rij { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  .gegevens-weergave-rij {
    display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 13.5px;
  }
  .gegevens-weergave-rij:first-of-type { border-top: none; padding-top: 0; }
  .gegevens-weergave-rij .label { color: var(--ink-muted); flex-shrink: 0; }
  .gegevens-weergave-rij .waarde { font-weight: 600; text-align: right; word-break: break-word; }
  .veld-rij { margin-bottom: 12px; }
  .veld-rij label { display: block; font-size: 12.5px; color: var(--ink-muted); margin-bottom: 4px; font-weight: 600; }
  .veld-rij input, .veld-rij select, .veld-rij textarea {
    width: 100%; padding: 10px 12px; border-radius: 10px; border: 1.5px solid var(--line);
    background: var(--paper); color: var(--ink); font-size: 14.5px; font-family: inherit;
  }
  .veld-rij textarea { resize: vertical; min-height: 60px; }
  .veld-rij input:disabled { opacity: 0.6; }
  .veld-twee { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 6px; }
  .stat-tegel {
    background: var(--paper); border: 1px solid var(--line); border-radius: 10px;
    padding: 12px 10px; text-align: center;
  }
  .stat-tegel .waarde { font-size: 22px; font-weight: 700; color: var(--navy); }
  @media (prefers-color-scheme: dark) { .stat-tegel .waarde { color: #8ab6ec; } }
  .stat-tegel .label { font-size: 11px; color: var(--ink-muted); margin-top: 2px; }
  .podium-rij { display: flex; gap: 14px; margin-top: 12px; font-size: 13.5px; }
  .rating-badge {
    display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 12px;
    background: rgba(255,210,63,0.14); margin-bottom: 4px;
  }
  .rating-badge .cijfer { font-size: 24px; font-weight: 700; color: var(--gold-deep); }
  @media (prefers-color-scheme: dark) { .rating-badge .cijfer { color: var(--gold); } }
  .rating-badge .wedstrijden { font-size: 12px; color: var(--ink-muted); }
  .speler-slot { margin-bottom: 10px; padding: 10px; border: 1px solid var(--line); border-radius: 10px; }
  .speler-slot label { display: block; font-size: 12px; font-weight: 700; margin-bottom: 6px; }
  .speler-slot select { width: 100%; margin-bottom: 6px; }
  .extern-invoer { display: flex; gap: 6px; }
  .extern-invoer input, .extern-invoer select { flex: 1; }
  .wedstrijd-item {
    padding: 10px 0; border-top: 1px solid var(--line); font-size: 13.5px; display: flex;
    justify-content: space-between; align-items: center; gap: 8px;
  }
  .wedstrijd-item:first-of-type { border-top: none; padding-top: 0; }
  .wedstrijd-status {
    padding: 3px 9px; border-radius: 999px; font-size: 11px; font-weight: 700; flex-shrink: 0;
  }
  .wedstrijd-status.in_behandeling { background: rgba(255,210,63,0.16); color: var(--gold-deep); }
  @media (prefers-color-scheme: dark) { .wedstrijd-status.in_behandeling { color: var(--gold); } }
  .wedstrijd-status.goedgekeurd { background: rgba(20,140,90,0.12); color: #148c5a; }
  .wedstrijd-status.afgekeurd { background: rgba(179,38,30,0.1); color: #b3261e; }
  .vergelijk-knop {
    background: none; border: none; color: var(--navy); font-family: inherit; font-size: 12.5px;
    font-weight: 700; cursor: pointer; padding: 0; margin-top: 8px;
  }
  @media (prefers-color-scheme: dark) { .vergelijk-knop { color: #8ab6ec; } }
  .popup-overlay {
    position: fixed; inset: 0; background: rgba(4,27,51,0.45); z-index: 100;
    display: flex; align-items: flex-end; justify-content: center;
  }
  .popup-kaart {
    background: var(--card); border-radius: 18px 18px 0 0; width: 100%; max-width: 480px;
    max-height: 80vh; overflow-y: auto; padding: 20px;
  }
  @media (min-width: 560px) {
    .popup-overlay { align-items: center; }
    .popup-kaart { border-radius: 18px; }
  }
  .popup-kop { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .popup-kop h3 { margin: 0; font-size: 16px; }
  .popup-sluit { background: none; border: none; font-size: 20px; cursor: pointer; color: var(--ink-muted); }
  .plan-regel {
    padding: 12px 0; border-top: 1px solid var(--line); display: flex; justify-content: space-between; gap: 10px;
  }
  .plan-regel:first-of-type { border-top: none; padding-top: 0; }
  .plan-regel .naam { font-weight: 700; font-size: 14px; }
  .plan-regel .sub { font-size: 12px; color: var(--ink-muted); margin-top: 2px; }
  .plan-regel .prijs { font-weight: 700; font-size: 14px; color: var(--navy); white-space: nowrap; }
  @media (prefers-color-scheme: dark) { .plan-regel .prijs { color: #8ab6ec; } }
</style>
</head>
<body>
<header>
  <img src="/assets/img/logo.png" alt="" width="40" height="39" style="border-radius: 8px;" />
  <div style="flex: 1;">
    <div class="merk">Almere Pickleball</div>
    <h1 id="welkom">Profiel</h1>
  </div>
  <div id="account-plek"></div>
</header>
<main>
  <div class="kaart">
    <h2>Mijn abonnement</h2>
    <div id="abonnement-inhoud" class="laden">Laden…</div>
  </div>

  <div class="kaart">
    <h2>Mijn gegevens</h2>
    <div id="gegevens-inhoud" class="laden">Laden…</div>
  </div>

  <div class="kaart">
    <h2>Spelersstatistieken</h2>
    <div id="statistieken-inhoud" class="laden">Laden…</div>
  </div>

  <div class="kaart">
    <h2>DUPR / rating</h2>
    <div id="rating-inhoud" class="laden">Laden…</div>
  </div>

  <p style="text-align:center;font-size:12.5px;color:var(--ink-muted)">
    <a href="/veelgestelde-vragen/" style="color:inherit">Veelgestelde vragen</a>
    <span> · </span>
    <a href="/privacy/" style="color:inherit">Privacybeleid</a>
  </p>
</main>
<div id="nav-plek"></div>
<script src="/assets/supabase.js"></script>
<script src="/assets/theme.js"></script>
<script src="/assets/nav.js"></script>
<script>
  const sessie = vereisSessie();
  initNav('profiel');

  let mijnLeeftijd = null;
  let mijnAbonnement = null;
  let alleLeden = null;

  const betaalwijzePerVorm = { jaar: 'jaarlijks_vooruit', maand: 'maandelijkse_incasso', strippenkaart: 'eenmalig', sessie: 'per_sessie', proef: 'eenmalig' };
  const niveauLabels = { beginner: 'Beginner', gevorderd: 'Gevorderd', competitie: 'Competitie' };
  const geslachtLabels = { m: 'Man', v: 'Vrouw', x: 'Anders' };
  const dagnamenKort = ['maandag', 'dinsdag', 'woensdag', 'donderdag', 'vrijdag', 'zaterdag', 'zondag'];

  async function toonUpgradePopup() {
    toonPopup('Overstappen naar 2x per week', '<p class="details">Even het bedrag berekenen…</p>');
    try {
      const rows = await rpc('bereken_upgrade_bedrag', { p_lid_abonnement_id: mijnAbonnement.id });
      const info = Array.isArray(rows) ? rows[0] : rows;
      toonPopup('Overstappen naar 2x per week',
        '<p class="details">Je stapt over naar <strong>' + info.nieuw_abonnement_naam + '</strong>. ' +
        'Voor de rest van de huidige periode betaal je het geprorateerde verschil:</p>' +
        '<p style="font-size:24px;font-weight:700;color:var(--navy);margin:10px 0">€' + Number(info.bedrag).toFixed(2) + '</p>' +
        '<button class="knop aanmelden" id="upgrade-betaal-knop" style="display:block;width:100%">Betalen en overstappen</button>' +
        '<div id="upgrade-melding"></div>');
      document.getElementById('upgrade-betaal-knop').addEventListener('click', async (e) => {
        e.target.disabled = true; e.target.textContent = 'Bezig…';
        try {
          const res = await functieAanroepen('create-mollie-payment', { type: 'abonnement_upgrade', lid_abonnement_id: mijnAbonnement.id });
          if (res.checkoutUrl) { window.location.href = res.checkoutUrl; return; }
          throw new Error(res.error || 'Kon betaling niet starten.');
        } catch (fout) {
          document.getElementById('upgrade-melding').innerHTML = '<div class="melding fout">' + fout.message + '</div>';
          e.target.disabled = false; e.target.textContent = 'Betalen en overstappen';
        }
      });
    } catch (e) {
      toonPopup('Overstappen naar 2x per week', '<div class="melding fout">' + e.message + '</div>');
    }
  }
  const datumFormat = new Intl.DateTimeFormat('nl-NL', { day: 'numeric', month: 'long', year: 'numeric' });

  function berekenLeeftijd(geboortedatum) {
    if (!geboortedatum) return null;
    const nu = new Date(); const gd = new Date(geboortedatum);
    let leeftijd = nu.getFullYear() - gd.getFullYear();
    if (nu.getMonth() < gd.getMonth() || (nu.getMonth() === gd.getMonth() && nu.getDate() < gd.getDate())) leeftijd--;
    return leeftijd;
  }

  function sluitPopups() {
    document.querySelectorAll('.popup-overlay').forEach(el => el.remove());
  }

  function toonPopup(titel, inhoudHtml) {
    sluitPopups();
    const overlay = document.createElement('div');
    overlay.className = 'popup-overlay';
    overlay.innerHTML = '<div class="popup-kaart"><div class="popup-kop"><h3>' + titel + '</h3>' +
      '<button type="button" class="popup-sluit" aria-label="Sluiten">✕</button></div>' + inhoudHtml + '</div>';
    overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });
    overlay.querySelector('.popup-sluit').addEventListener('click', () => overlay.remove());
    document.body.appendChild(overlay);
  }

  // ---------- Mijn gegevens ----------

  let mijnLid = null;

  async function laadProfiel() {
    const rows = await haalOp('leden', {
      select: 'naam,email,telefoon,geboortedatum,geslacht,niveau,adres,ervaring,medische_info,' +
        'noodcontact_naam,noodcontact_telefoon,lid_sinds,rating,matches_played',
      id: 'eq.' + sessie.user_id,
    });
    if (!rows.length) return;
    mijnLid = rows[0];
    document.getElementById('welkom').textContent = 'Welkom, ' + mijnLid.naam;
    mijnLeeftijd = berekenLeeftijd(mijnLid.geboortedatum);
    toonGegevensWeergave();
  }

  /// Standaard afgeschermde weergave — alleen-lezen totdat "Wijzigen"
  /// wordt aangetikt (voorkomt dat iemand per ongeluk een veld aanpast).
  function toonGegevensWeergave() {
    const el = document.getElementById('gegevens-inhoud');
    const lid = mijnLid;
    const regel = (label, waarde) => '<div class="gegevens-weergave-rij"><span class="label">' + label + '</span><span class="waarde">' + (waarde || '–') + '</span></div>';
    el.className = '';
    el.innerHTML =
      regel('Naam', lid.naam) +
      regel('E-mail', lid.email) +
      regel('Telefoon', lid.telefoon) +
      regel('Geboortedatum', lid.geboortedatum ? datumFormat.format(new Date(lid.geboortedatum)) : null) +
      regel('Geslacht', lid.geslacht ? geslachtLabels[lid.geslacht] : null) +
      regel('Niveau', niveauLabels[lid.niveau] || lid.niveau) +
      regel('Adres', lid.adres) +
      regel('Speelervaring', lid.ervaring) +
      regel('Noodcontact', lid.noodcontact_naam ? lid.noodcontact_naam + (lid.noodcontact_telefoon ? ' · ' + lid.noodcontact_telefoon : '') : null) +
      regel('Medische info', lid.medische_info) +
      (lid.lid_sinds ? regel('Lid sinds', datumFormat.format(new Date(lid.lid_sinds))) : '') +
      '<div class="pil-knoppen-rij"><button type="button" class="pil-knop" id="gegevens-wijzig-knop">Wijzigen</button></div>';
    document.getElementById('gegevens-wijzig-knop').addEventListener('click', toonGegevensFormulier);
  }

  function toonGegevensFormulier() {
    const el = document.getElementById('gegevens-inhoud');
    const lid = mijnLid;
    el.className = '';
    el.innerHTML =
      '<div class="veld-rij"><label>Naam *</label><input type="text" id="veld-naam" value="' + (lid.naam || '') + '" /></div>' +
      '<div class="veld-rij"><label>E-mail</label><input type="email" value="' + (lid.email || '') + '" disabled /></div>' +
      '<div class="veld-twee">' +
      '<div class="veld-rij"><label>Telefoon</label><input type="tel" id="veld-telefoon" value="' + (lid.telefoon || '') + '" /></div>' +
      '<div class="veld-rij"><label>Geboortedatum</label><input type="date" id="veld-geboortedatum" value="' + (lid.geboortedatum || '') + '" /></div>' +
      '</div>' +
      '<div class="veld-twee">' +
      '<div class="veld-rij"><label>Geslacht</label><select id="veld-geslacht">' +
      '<option value="">Kies…</option>' +
      ['m', 'v', 'x'].map(g => '<option value="' + g + '"' + (lid.geslacht === g ? ' selected' : '') + '>' + geslachtLabels[g] + '</option>').join('') +
      '</select></div>' +
      '<div class="veld-rij"><label>Niveau</label><select id="veld-niveau">' +
      Object.keys(niveauLabels).map(n => '<option value="' + n + '"' + (lid.niveau === n ? ' selected' : '') + '>' + niveauLabels[n] + '</option>').join('') +
      '</select></div>' +
      '</div>' +
      '<div class="veld-rij"><label>Adres</label><input type="text" id="veld-adres" value="' + (lid.adres || '') + '" /></div>' +
      '<div class="veld-rij"><label>Speelervaring</label><textarea id="veld-ervaring">' + (lid.ervaring || '') + '</textarea></div>' +
      '<div class="veld-twee">' +
      '<div class="veld-rij"><label>Noodcontact naam</label><input type="text" id="veld-noodcontact-naam" value="' + (lid.noodcontact_naam || '') + '" /></div>' +
      '<div class="veld-rij"><label>Noodcontact telefoon</label><input type="tel" id="veld-noodcontact-telefoon" value="' + (lid.noodcontact_telefoon || '') + '" /></div>' +
      '</div>' +
      '<div class="veld-rij"><label>Medische info (bijv. blessures/allergieën)</label><textarea id="veld-medische-info">' + (lid.medische_info || '') + '</textarea></div>' +
      (lid.lid_sinds ? '<p class="details">Lid sinds ' + datumFormat.format(new Date(lid.lid_sinds)) + '</p>' : '') +
      '<div class="pil-knoppen-rij">' +
      '<button type="button" class="pil-knop" id="gegevens-opslaan-knop">Opslaan</button>' +
      '<button type="button" class="pil-knop secundair" id="gegevens-annuleer-knop">Annuleren</button>' +
      '</div>' +
      '<div id="gegevens-melding"></div>';
    document.getElementById('gegevens-opslaan-knop').addEventListener('click', slaGegevensOp);
    document.getElementById('gegevens-annuleer-knop').addEventListener('click', toonGegevensWeergave);
  }

  function leegOfWaarde(id) {
    const v = document.getElementById(id).value.trim();
    return v === '' ? null : v;
  }

  async function slaGegevensOp() {
    const meldingEl = document.getElementById('gegevens-melding');
    const naam = document.getElementById('veld-naam').value.trim();
    if (!naam) { meldingEl.innerHTML = '<div class="melding fout">Naam is verplicht.</div>'; return; }
    const btn = document.getElementById('gegevens-opslaan-knop');
    btn.disabled = true;
    btn.textContent = 'Bezig…';
    try {
      await werkBij('leden', { id: 'eq.' + sessie.user_id }, {
        naam,
        telefoon: leegOfWaarde('veld-telefoon'),
        geboortedatum: leegOfWaarde('veld-geboortedatum'),
        geslacht: document.getElementById('veld-geslacht').value || null,
        niveau: document.getElementById('veld-niveau').value,
        adres: leegOfWaarde('veld-adres'),
        ervaring: leegOfWaarde('veld-ervaring'),
        noodcontact_naam: leegOfWaarde('veld-noodcontact-naam'),
        noodcontact_telefoon: leegOfWaarde('veld-noodcontact-telefoon'),
        medische_info: leegOfWaarde('veld-medische-info'),
      });
      await laadProfiel();
      toonGegevensWeergave();
    } catch (e) {
      meldingEl.innerHTML = '<div class="melding fout">' + e.message + '</div>';
      btn.disabled = false;
      btn.textContent = 'Opslaan';
    }
  }

  // ---------- Spelersstatistieken ----------

  async function laadSpelersStatistieken() {
    const el = document.getElementById('statistieken-inhoud');
    const [avondRows, teams] = await Promise.all([
      haalOp('lid_avond_statistieken', { select: 'gespeeld,gewonnen', lid_id: 'eq.' + sessie.user_id }),
      haalOp('toernooi_teams', { select: 'id', or: '(speler1_id.eq.' + sessie.user_id + ',speler2_id.eq.' + sessie.user_id + ')' }),
    ]);
    const avond = avondRows[0] || { gespeeld: 0, gewonnen: 0 };
    const teamIds = teams.map(t => t.id);
    let eerste = 0, tweede = 0, derde = 0;
    if (teamIds.length) {
      const ids = teamIds.join(',');
      const podiumToernooien = await haalOp('toernooien', {
        select: 'podium_1,podium_2,podium_3',
        or: '(podium_1.in.(' + ids + '),podium_2.in.(' + ids + '),podium_3.in.(' + ids + '))',
      });
      podiumToernooien.forEach(t => {
        if (teamIds.includes(t.podium_1)) eerste++;
        if (teamIds.includes(t.podium_2)) tweede++;
        if (teamIds.includes(t.podium_3)) derde++;
      });
    }
    const gespeeld = avond.gespeeld || 0;
    const gewonnen = avond.gewonnen || 0;
    const winrate = gespeeld > 0 ? Math.round((gewonnen / gespeeld) * 100) : null;

    el.className = '';
    el.innerHTML =
      '<div class="stat-grid">' +
      '<div class="stat-tegel"><div class="waarde">' + gespeeld + '</div><div class="label">Speelavonden</div></div>' +
      '<div class="stat-tegel"><div class="waarde">' + (winrate === null ? '–' : winrate + '%') + '</div><div class="label">Win-percentage</div></div>' +
      '<div class="stat-tegel"><div class="waarde">' + teamIds.length + '</div><div class="label">Toernooien</div></div>' +
      '</div>' +
      (eerste || tweede || derde
        ? '<div class="podium-rij">' +
          (eerste ? '<span>🥇 ' + eerste + '</span>' : '') +
          (tweede ? '<span>🥈 ' + tweede + '</span>' : '') +
          (derde ? '<span>🥉 ' + derde + '</span>' : '') +
          '</div>'
        : '');
  }

  // ---------- DUPR / rating + wedstrijd melden ----------

  function slotHtml(slotNaam, label) {
    const opties = (alleLeden || []).filter(l => l.id !== sessie.user_id)
      .map(l => '<option value="' + l.id + '">' + l.naam + '</option>').join('');
    return '<div class="speler-slot" data-slot-wrap="' + slotNaam + '">' +
      '<label>' + label + '</label>' +
      '<select data-slot-select="' + slotNaam + '">' +
      '<option value="">Kies clublid…</option>' + opties +
      '<option value="__extern__">Extern (geen lid)</option></select>' +
      '<div class="extern-invoer" data-slot-extern="' + slotNaam + '" style="display:none">' +
      '<input type="text" placeholder="Naam" data-slot-naam="' + slotNaam + '" />' +
      '<select data-slot-niveau="' + slotNaam + '">' +
      Object.keys(niveauLabels).map(n => '<option value="' + n + '">' + niveauLabels[n] + '</option>').join('') +
      '</select></div></div>';
  }

  function leesSlot(slotNaam) {
    const select = document.querySelector('[data-slot-select="' + slotNaam + '"]');
    if (!select || !select.value) return { lid_id: null, naam: null, niveau: null };
    if (select.value === '__extern__') {
      const naam = document.querySelector('[data-slot-naam="' + slotNaam + '"]').value.trim();
      const niveau = document.querySelector('[data-slot-niveau="' + slotNaam + '"]').value;
      return { lid_id: null, naam: naam || null, niveau: naam ? niveau : null };
    }
    return { lid_id: select.value, naam: null, niveau: null };
  }

  function toonWedstrijdFormulier() {
    const houder = document.getElementById('wedstrijd-formulier');
    houder.style.display = houder.style.display === 'none' ? 'block' : 'none';
  }

  function wisselTypeSlots() {
    const type = document.getElementById('wedstrijd-type').value;
    const enkel = type === 'enkel';
    document.querySelector('[data-slot-wrap="partner"]').style.display = enkel ? 'none' : 'block';
    document.querySelector('[data-slot-wrap="tegenstander2"]').style.display = enkel ? 'none' : 'block';
  }

  async function meldWedstrijd() {
    const meldingEl = document.getElementById('wedstrijd-melding');
    meldingEl.innerHTML = '';
    const type = document.getElementById('wedstrijd-type').value;
    const datum = document.getElementById('wedstrijd-datum').value;
    const eigenScore = Number(document.getElementById('eigen-score').value);
    const tegenScore = Number(document.getElementById('tegen-score').value);
    if (!datum) { meldingEl.innerHTML = '<div class="melding fout">Vul een datum in.</div>'; return; }
    if (Number.isNaN(eigenScore) || Number.isNaN(tegenScore) || eigenScore === tegenScore) {
      meldingEl.innerHTML = '<div class="melding fout">Vul geldige, verschillende scores in.</div>';
      return;
    }
    const tegenstander1 = leesSlot('tegenstander1');
    if (!tegenstander1.lid_id && !tegenstander1.naam) {
      meldingEl.innerHTML = '<div class="melding fout">Vul een tegenstander in.</div>';
      return;
    }
    const payload = { datum, type, eigen_score: eigenScore, tegen_score: tegenScore, melder_id: sessie.user_id };
    if (type !== 'enkel') {
      const partner = leesSlot('partner');
      if (!partner.lid_id && !partner.naam) {
        meldingEl.innerHTML = '<div class="melding fout">Vul je partner in.</div>';
        return;
      }
      payload.partner_lid_id = partner.lid_id;
      payload.partner_naam = partner.naam;
      payload.partner_niveau = partner.niveau;
      const tegenstander2 = leesSlot('tegenstander2');
      if (!tegenstander2.lid_id && !tegenstander2.naam) {
        meldingEl.innerHTML = '<div class="melding fout">Vul de tweede tegenstander in.</div>';
        return;
      }
      payload.tegenstander2_lid_id = tegenstander2.lid_id;
      payload.tegenstander2_naam = tegenstander2.naam;
      payload.tegenstander2_niveau = tegenstander2.niveau;
    }
    payload.tegenstander1_lid_id = tegenstander1.lid_id;
    payload.tegenstander1_naam = tegenstander1.naam;
    payload.tegenstander1_niveau = tegenstander1.niveau;

    try {
      await voegToe('gemelde_wedstrijden', payload);
      meldingEl.innerHTML = '<div class="melding ok">Wedstrijd gemeld — een beheerder beoordeelt deze.</div>';
      await laadRatingSectie();
    } catch (e) {
      meldingEl.innerHTML = '<div class="melding fout">' + e.message + '</div>';
    }
  }

  function wedstrijdStatusLabel(status) {
    return { in_behandeling: 'In behandeling', goedgekeurd: 'Goedgekeurd', afgekeurd: 'Afgekeurd' }[status] || status;
  }

  const typeLabels = { enkel: 'Enkel', dubbel_gemixed: 'Dubbel gemixed', dubbel_vrouwen: 'Dubbel vrouwen', dubbel_mannen: 'Dubbel mannen' };

  async function laadRatingSectie() {
    const el = document.getElementById('rating-inhoud');
    if (!alleLeden) {
      alleLeden = await haalOp('leden', { select: 'id,naam', order: 'naam.asc' });
    }
    const gemeld = await haalOp('gemelde_wedstrijden', {
      select: 'id,datum,type,eigen_score,tegen_score,status,nieuwe_rating',
      melder_id: 'eq.' + sessie.user_id, order: 'created_at.desc', limit: '10',
    });

    const rating = mijnLid.rating != null ? Number(mijnLid.rating).toFixed(2) : '3.00';
    const wedstrijdenHtml = gemeld.length
      ? gemeld.map(w => '<div class="wedstrijd-item"><span>' +
          new Date(w.datum).toLocaleDateString('nl-NL', { day: 'numeric', month: 'short' }) + ' · ' +
          typeLabels[w.type] + ' · ' + w.eigen_score + '-' + w.tegen_score +
          (w.status === 'goedgekeurd' && w.nieuwe_rating ? ' · nieuw: ' + Number(w.nieuwe_rating).toFixed(2) : '') +
          '</span><span class="wedstrijd-status ' + w.status + '">' + wedstrijdStatusLabel(w.status) + '</span></div>').join('')
      : '<p class="details">Nog geen wedstrijden gemeld.</p>';

    el.className = '';
    el.innerHTML =
      '<div class="rating-badge"><span class="cijfer">' + rating + '</span>' +
      '<span class="wedstrijden">' + (mijnLid.matches_played || 0) + ' partijen meegeteld</span></div>' +
      '<p class="details">Meld een gespeelde wedstrijd (buiten de reguliere speelavond/toernooi om) om je rating bij te werken. Een beheerder beoordeelt elke melding.</p>' +
      '<button class="knop aanmelden" id="wedstrijd-melden-knop" type="button">Wedstrijd melden</button>' +
      '<div id="wedstrijd-formulier" style="display:none;margin-top:14px">' +
      '<div class="veld-rij"><label>Datum</label><input type="date" id="wedstrijd-datum" max="' + new Date().toISOString().substring(0, 10) + '" /></div>' +
      '<div class="veld-rij"><label>Type</label><select id="wedstrijd-type">' +
      Object.keys(typeLabels).map(t => '<option value="' + t + '">' + typeLabels[t] + '</option>').join('') +
      '</select></div>' +
      slotHtml('partner', 'Partner') +
      slotHtml('tegenstander1', 'Tegenstander 1') +
      slotHtml('tegenstander2', 'Tegenstander 2') +
      '<div class="veld-twee">' +
      '<div class="veld-rij"><label>Score (jij/jullie)</label><input type="number" id="eigen-score" min="0" /></div>' +
      '<div class="veld-rij"><label>Score (tegenstander)</label><input type="number" id="tegen-score" min="0" /></div>' +
      '</div>' +
      '<button class="knop aanmelden" id="wedstrijd-versturen-knop" type="button">Melding versturen</button>' +
      '<div id="wedstrijd-melding"></div>' +
      '</div>' +
      '<div style="margin-top:16px"><h2 style="margin-bottom:8px">Mijn gemelde wedstrijden</h2>' + wedstrijdenHtml + '</div>';

    document.getElementById('wedstrijd-melden-knop').addEventListener('click', toonWedstrijdFormulier);
    document.getElementById('wedstrijd-versturen-knop').addEventListener('click', meldWedstrijd);
    document.getElementById('wedstrijd-type').addEventListener('change', wisselTypeSlots);
    wisselTypeSlots();
  }

  // ---------- Abonnement ----------

  async function laadAbonnement() {
    const el = document.getElementById('abonnement-inhoud');

    const vormLabels = { jaar: 'Jaarlijks', maand: 'Maandelijks', strippenkaart: 'Strippenkaart', sessie: 'Per sessie', proef: 'Proeflidmaatschap' };
    const actief = await haalOp('lid_abonnementen', {
      select: 'id,status,strippen_resterend,geldig_tot,start_datum,opgezegd_op,eind_datum,vaste_dag,abonnementen(naam,vorm,prijs,sessies_per_week)',
      lid_id: 'eq.' + sessie.user_id, status: 'eq.actief', limit: '1',
    });
    if (actief.length) {
      mijnAbonnement = actief[0];
      const abo = mijnAbonnement.abonnementen;
      const naam = abo ? abo.naam : '';
      const regel = (label, waarde) => waarde ? '<div class="gegevens-weergave-rij"><span class="label">' + label + '</span><span class="waarde">' + waarde + '</span></div>' : '';
      let details = '';
      if (abo) {
        details += regel('Vorm', vormLabels[abo.vorm] || abo.vorm);
        details += regel('Prijs', '€' + Number(abo.prijs).toFixed(2) + (abo.vorm === 'jaar' ? ' / jaar' : abo.vorm === 'maand' ? ' / maand' : abo.vorm === 'sessie' ? ' / keer' : ''));
        if (abo.sessies_per_week) details += regel('Speelfrequentie', abo.sessies_per_week + 'x per week');
      }
      if (mijnAbonnement.start_datum) details += regel('Gestart op', datumFormat.format(new Date(mijnAbonnement.start_datum)));
      if (abo && (abo.vorm === 'strippenkaart' || abo.vorm === 'proef') && mijnAbonnement.geldig_tot) {
        details += regel('Strippen resterend', (mijnAbonnement.strippen_resterend ?? 0) + ' over, geldig tot ' + datumFormat.format(new Date(mijnAbonnement.geldig_tot)));
      }
      const eenxPerWeek = abo && ['jaar', 'maand'].includes(abo.vorm) && abo.sessies_per_week === 1;
      if (eenxPerWeek && mijnAbonnement.vaste_dag) details += regel('Vaste speeldag', dagnamenKort[mijnAbonnement.vaste_dag - 1]);
      if (mijnAbonnement.opgezegd_op && mijnAbonnement.eind_datum) {
        details += '<div class="gegevens-weergave-rij"><span class="label">Status</span><span class="waarde" style="color:var(--gold-deep)">Opgezegd — geldig tot ' + datumFormat.format(new Date(mijnAbonnement.eind_datum)) + '</span></div>';
      }

      el.innerHTML = '<div class="status-regel"><span class="status-badge">' + naam + '</span></div>' +
        '<div style="margin-top:10px">' + details + '</div>' +
        '<div class="pil-knoppen-rij">' +
        '<button type="button" class="pil-knop" id="vergelijk-knop">Vergelijk abonnementen</button>' +
        (eenxPerWeek ? '<button type="button" class="pil-knop" id="upgrade-2x-knop">Overstappen naar 2x/week</button>' : '') +
        (mijnAbonnement.opgezegd_op ? '' : '<button type="button" class="pil-knop secundair" id="opzeg-knop">Opzeggen</button>') +
        '</div>' +
        '<div id="abonnement-melding"></div>';
      if (document.getElementById('opzeg-knop')) document.getElementById('opzeg-knop').addEventListener('click', opzeggen);
      document.getElementById('vergelijk-knop').addEventListener('click', toonVergelijking);
      if (document.getElementById('upgrade-2x-knop')) document.getElementById('upgrade-2x-knop').addEventListener('click', toonUpgradePopup);
      return;
    }

    const wachtend = await haalOp('lid_abonnementen', {
      select: 'id,abonnementen(naam)',
      lid_id: 'eq.' + sessie.user_id, status: 'eq.in_afwachting', order: 'created_at.desc', limit: '1',
    });
    if (wachtend.length) {
      mijnAbonnement = null;
      const naam = wachtend[0].abonnementen ? wachtend[0].abonnementen.naam : '';
      el.innerHTML = '<span class="status-badge leeg">In afwachting van betaling — ' + naam + '</span>' +
        '<button class="knop aanmelden" id="betaal-knop" style="margin-top:12px;display:block">Betaal nu via iDEAL</button>' +
        '<div id="abonnement-melding"></div>';
      document.getElementById('betaal-knop').addEventListener('click', (e) => betaalWachtendAbonnement(wachtend[0].id, e.target));
      return;
    }

    mijnAbonnement = null;
    await toonAbonnementKiezer(el);
  }

  function prijsLabel(a) {
    if (a.vorm === 'jaar') return '€' + Number(a.prijs).toFixed(2) + ' / jaar';
    if (a.vorm === 'maand') return '€' + Number(a.prijs).toFixed(2) + ' / maand';
    if (a.vorm === 'strippenkaart') return '€' + Number(a.prijs).toFixed(2) + ' eenmalig';
    if (a.vorm === 'sessie') return '€' + Number(a.prijs).toFixed(2) + ' / keer';
    return Number(a.prijs) > 0 ? '€' + Number(a.prijs).toFixed(2) : 'Gratis';
  }

  function subLabel(a) {
    const delen = [];
    if (a.sessies_per_week) delen.push(a.sessies_per_week + 'x per week');
    if (a.vorm === 'strippenkaart' && a.strippen) delen.push(a.strippen + ' strippen, ' + (a.geldig_maanden || '?') + ' mnd geldig');
    if (a.jaarkorting_pct > 0) delen.push(a.jaarkorting_pct + '% korting bij ineens betalen');
    return delen.join(' · ');
  }

  async function toonVergelijking() {
    const categorie = (mijnLeeftijd !== null && mijnLeeftijd <= 17) ? 'jeugd' : 'volwassen';
    const opties = await haalOp('abonnementen', { select: '*', actief: 'eq.true', categorie: 'in.(' + categorie + ',alle)', order: 'vorm.asc' });
    const regels = opties.map(a => {
      const huidig = mijnAbonnement && mijnAbonnement.abonnementen && mijnAbonnement.abonnementen.naam === a.naam;
      return '<div class="plan-regel">' +
        '<div><div class="naam">' + a.naam + (huidig ? ' (huidig)' : '') + '</div>' +
        (subLabel(a) ? '<div class="sub">' + subLabel(a) + '</div>' : '') + '</div>' +
        '<div class="prijs">' + prijsLabel(a) + '</div></div>';
    }).join('');
    toonPopup('Vergelijk abonnementen', regels || '<p class="details">Geen abonnementen beschikbaar.</p>');
  }

  function toonAbonnementMelding(tekst, isFout) {
    const el = document.getElementById('abonnement-melding');
    if (el) el.innerHTML = '<div class="melding ' + (isFout ? 'fout' : 'ok') + '">' + tekst + '</div>';
  }

  async function toonAbonnementKiezer(el) {
    const categorie = (mijnLeeftijd !== null && mijnLeeftijd <= 17) ? 'jeugd' : 'volwassen';
    const opties = await haalOp('abonnementen', { select: '*', actief: 'eq.true', categorie: 'in.(' + categorie + ',alle)', order: 'vorm.asc' });
    if (!opties.length) { el.textContent = 'Geen abonnementsvormen beschikbaar.'; return; }
    el.innerHTML = '<span class="status-badge leeg">Geen actief abonnement</span>' +
      '<div style="margin-top:14px;display:flex;flex-direction:column;gap:8px">' +
      opties.map((a, i) => {
        const prijs = Number(a.prijs) > 0 ? '€' + Number(a.prijs).toFixed(2) : 'Gratis';
        return '<label style="display:flex;align-items:center;gap:8px;font-size:13.5px;padding:8px;border:1.5px solid var(--line);border-radius:10px;cursor:pointer">' +
          '<input type="radio" name="abo-keuze" value="' + i + '" ' + (i === 0 ? 'checked' : '') + ' />' +
          '<span style="flex:1">' + a.naam + '</span><strong>' + prijs + '</strong></label>';
      }).join('') +
      '</div><button class="knop aanmelden" id="start-abo-knop" style="margin-top:14px">Abonnement starten</button>' +
      '<div id="abonnement-melding"></div>';
    document.getElementById('start-abo-knop').addEventListener('click', (e) => {
      const gekozenIndex = Number(el.querySelector('input[name="abo-keuze"]:checked').value);
      startAbonnement(opties[gekozenIndex], e.target);
    });
  }

  async function startAbonnement(abo, btn) {
    btn.disabled = true;
    btn.textContent = 'Bezig…';
    const betaalwijze = betaalwijzePerVorm[abo.vorm] || 'eenmalig';
    try {
      if (Number(abo.prijs) <= 0) {
        const isStrippenkaart = abo.vorm === 'strippenkaart' || abo.vorm === 'proef';
        const nu = new Date();
        const rij = { lid_id: sessie.user_id, abonnement_id: abo.id, betaalwijze, status: 'actief' };
        if (isStrippenkaart) {
          rij.strippen_resterend = abo.strippen;
          const geldigTot = new Date(nu); geldigTot.setMonth(geldigTot.getMonth() + Number(abo.geldig_maanden));
          rij.geldig_tot = geldigTot.toISOString().substring(0, 10);
        }
        await voegToe('lid_abonnementen', rij);
        await laadAbonnement();
        toonAbonnementMelding('Abonnement gestart.', false);
        return;
      }
      const res = await functieAanroepen('create-mollie-payment', { type: 'abonnement', abonnement_id: abo.id, betaalwijze });
      await laadAbonnement();
      if (res.checkoutUrl) {
        toonAbonnementMelding('Je wordt doorgestuurd naar de betaalpagina…', false);
        window.location.href = res.checkoutUrl;
      }
    } catch (e) {
      toonAbonnementMelding(e.message, true);
      btn.disabled = false;
      btn.textContent = 'Abonnement starten';
    }
  }

  async function betaalWachtendAbonnement(lidAbonnementId, btn) {
    btn.disabled = true;
    btn.textContent = 'Bezig…';
    try {
      const res = await functieAanroepen('create-mollie-payment', { type: 'abonnement', lid_abonnement_id: lidAbonnementId });
      if (res.checkoutUrl) {
        toonAbonnementMelding('Je wordt doorgestuurd naar de betaalpagina…', false);
        window.location.href = res.checkoutUrl;
      }
    } catch (e) {
      toonAbonnementMelding(e.message, true);
      btn.disabled = false;
      btn.textContent = 'Betaal nu via iDEAL';
    }
  }

  async function opzeggen() {
    if (!confirm('Weet je zeker dat je je abonnement wilt opzeggen?')) return;
    try {
      await rpc('zeg_abonnement_op', {});
      await laadAbonnement();
      toonAbonnementMelding('Abonnement opgezegd.', false);
    } catch (e) {
      toonAbonnementMelding(e.message, true);
    }
  }

  (async () => {
    await laadProfiel();
    await Promise.all([laadAbonnement(), laadSpelersStatistieken(), laadRatingSectie()]);
  })().catch(e => console.error(e));
</script>
</body>
</html>
