<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8" />
<script>(function(){try{var t=localStorage.getItem('pb_thema');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mijn Almere Pickleball</title>
<meta name="robots" content="noindex" />
<link rel="icon" type="image/png" href="/assets/img/logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/assets/leden.css" />
<style>
  .mini-stat-rij { display: flex; gap: 10px; margin-top: 12px; }
  .mini-stat { flex: 1; background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; text-align: center; }
  .mini-stat .waarde { font-size: 17px; font-weight: 700; color: var(--navy); }
  @media (prefers-color-scheme: dark) { .mini-stat .waarde { color: #8ab6ec; } }
  .mini-stat .label { font-size: 10.5px; color: var(--ink-muted); }
  .aanmelders-knop {
    display: flex; align-items: center; gap: 6px; margin-top: 10px; padding: 0; background: none; border: none;
    color: var(--navy); font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer;
  }
  @media (prefers-color-scheme: dark) { .aanmelders-knop { color: #8ab6ec; } }
  .aangemeld-badge {
    display: inline-block; padding: 3px 9px; border-radius: 999px; font-size: 11px; font-weight: 700;
    background: rgba(20,140,90,0.12); color: #148c5a; margin-left: 8px;
  }
  .landelijk-item { padding: 10px 0; border-top: 1px solid var(--line); }
  .landelijk-item:first-of-type { border-top: none; padding-top: 0; }
  .landelijk-item .naam { font-weight: 700; font-size: 13.5px; }
  .landelijk-item .sub { font-size: 12px; color: var(--ink-muted); margin-top: 1px; }
  .popup-overlay {
    position: fixed; inset: 0; background: rgba(4,27,51,0.45); z-index: 100;
    display: flex; align-items: center; justify-content: center; padding: 16px;
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  }
  .popup-kaart {
    background: var(--glas-oppervlak); -webkit-backdrop-filter: blur(24px) saturate(160%);
    backdrop-filter: blur(24px) saturate(160%); border: 1px solid var(--glas-rand);
    border-radius: 22px; width: 100%; max-width: 400px; max-height: 80vh; overflow-y: auto; padding: 20px;
    box-shadow: 0 20px 50px rgba(4,27,51,0.35), inset 0 1px 0 var(--glas-hooglicht-boven), inset 0 -1px 0 var(--glas-hooglicht-onder);
  }
  .popup-kop { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .popup-kop h3 { margin: 0; font-size: 15.5px; }
  .popup-sluit { background: rgba(91,107,125,0.12); border: none; border-radius: 50%; width: 28px; height: 28px; font-size: 14px; cursor: pointer; color: var(--ink-muted); }
  .lid-regel {
    display: flex; align-items: center; gap: 10px; padding: 10px 12px;
    background: var(--paper); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 6px;
  }
  .lid-regel:last-child { margin-bottom: 0; }
  .lid-avatar {
    width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0; object-fit: cover;
    background: linear-gradient(135deg, var(--navy), var(--navy-deep)); color: #fff;
    display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px;
  }
  .i-inline { width: 14px; height: 14px; vertical-align: -2px; margin-right: 3px; flex-shrink: 0; }
  /* Betaalherinnering — zelfde behandeling als de app se accent-gekleurde
     banner (home_screen.dart _betaalherinneringBanner). */
  .betaal-banner {
    background: rgba(228,29,35,0.08); border: 1px solid rgba(228,29,35,0.25);
    border-radius: 16px; padding: 16px; margin-bottom: 14px;
  }
  .betaal-banner .kop { display: flex; align-items: flex-start; gap: 10px; }
  .betaal-banner .kop svg { width: 22px; height: 22px; color: var(--accent); flex-shrink: 0; margin-top: 1px; }
  .betaal-banner .titel { font-weight: 700; color: var(--accent); font-size: 15px; }
  .betaal-banner .bericht { margin-top: 4px; font-size: 14px; }
  .betaal-banner .knop-betalen {
    margin-top: 12px; display: inline-flex; align-items: center; gap: 6px;
    background: var(--accent); color: #fff; border: none; border-radius: 10px;
    padding: 10px 16px; font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit;
  }
  .betaal-instructies-tekst a { color: var(--navy); font-weight: 600; }
  .ideal-knop {
    width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px;
    background: var(--navy); color: #fff; border: none; border-radius: 10px;
    padding: 12px; font-size: 14.5px; font-weight: 700; cursor: pointer; font-family: inherit;
  }
  .ideal-knop:disabled { opacity: 0.6; cursor: default; }
  /* "Samen spelen?"-verzoek — matcht home_screen.dart _samenSpelenBanner. */
  .samenspelen-banner {
    background: rgba(36,87,255,0.08); border: 1px solid rgba(36,87,255,0.2);
    border-radius: 16px; padding: 16px; margin-bottom: 14px;
  }
  .samenspelen-banner .kop { display: flex; align-items: center; gap: 10px; font-weight: 600; }
  .samenspelen-banner .kop svg { width: 22px; height: 22px; color: var(--navy); flex-shrink: 0; }
  .samenspelen-banner .knoppen-rij { display: flex; gap: 8px; margin-top: 10px; }
  .samenspelen-banner button {
    flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px;
    padding: 9px; border-radius: 10px; font-size: 13.5px; font-weight: 700; cursor: pointer; font-family: inherit;
  }
  .samenspelen-banner .knop-ja { background: var(--navy); color: #fff; border: none; }
  .samenspelen-banner .knop-nee { background: transparent; color: var(--navy); border: 1.5px solid var(--navy); }
  /* Statistiekentegels — gedeeld door "Jouw statistieken" en "Club" (zelfde
     _statTegel-behandeling in de app, hergebruikt voor beide rijen). */
  .stat-tegel-rij { display: flex; gap: 8px; }
  .kaart .stat-tegel-rij { margin-top: 10px; }
  .kaart .kop-met-icoon { display: flex; align-items: center; gap: 6px; }
  .kaart .kop-met-icoon svg { width: 18px; height: 18px; color: var(--navy); }
  .kaart .kop-met-icoon span { font-size: 13px; font-weight: 600; color: var(--ink-muted); }
  .stat-tegel-los { flex: 1; padding: 10px 4px; border-radius: 10px; text-align: center; }
  .stat-tegel-los .waarde { font-size: 19px; font-weight: 700; }
  .stat-tegel-los .label { font-size: 10.5px; color: var(--ink-muted); margin-top: 2px; }
  .uitnodig-kaart {
    display: flex; align-items: center; gap: 14px; width: 100%; text-align: left;
    border: none; cursor: pointer; font-family: inherit;
  }
  .uitnodig-icoon {
    width: 44px; height: 44px; flex-shrink: 0; border-radius: 50%; background: rgba(36,87,255,0.1);
    color: var(--navy); display: flex; align-items: center; justify-content: center;
  }
  .uitnodig-icoon svg { width: 22px; height: 22px; }
  .uitnodig-tekst { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .uitnodig-titel { font-weight: 600; font-size: 14.5px; color: var(--ink); }
  .uitnodig-sub { font-size: 12.5px; color: var(--ink-muted); }
</style>
</head>
<body>
<header>
  <img src="/assets/img/logo.png" alt="" width="40" height="39" style="border-radius: 8px;" />
  <div style="flex: 1; min-width: 0;">
    <div class="merk"></div>
    <h1 id="welkom">Welkom</h1>
  </div>
  <div id="account-plek"></div>
</header>
<main>
  <div id="betaalherinnering-plek"></div>
  <div id="samenspelen-plek"></div>
  <div class="kaart">
    <h2>Mijn abonnement</h2>
    <div id="abonnement-inhoud" class="laden">Laden…</div>
  </div>
  <div class="kaart">
    <h2>Eerstvolgende speelavond</h2>
    <div id="volgende-speelavond-inhoud" class="laden">Laden…</div>
  </div>
  <div class="kaart" id="statistieken-kaart" style="display:none">
    <div class="kop-met-icoon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M18 17V9M13 17V5M8 17v-4"/></svg><span>Jouw statistieken</span></div>
    <div id="statistieken-inhoud" class="stat-tegel-rij"></div>
  </div>
  <div class="kaart">
    <h2>Laatste nieuws</h2>
    <div id="nieuws-inhoud" class="laden">Laden…</div>
  </div>
  <div class="kaart">
    <div class="kop-met-icoon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.4"/><path d="M3 20c0-3 3-5 6-5s6 2 6 5"/><path d="M15 15.5c2.2.3 4 2 4 4.5"/></svg><span>Club</span></div>
    <div id="club-stats-inhoud" class="stat-tegel-rij laden">Laden…</div>
  </div>
  <button type="button" class="kaart uitnodig-kaart" id="uitnodig-vriend-knop">
    <span class="uitnodig-icoon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 3-6.2 6.5-6.2s6.5 2.6 6.5 6.2"/><circle cx="18" cy="8" r="2.8"/><path d="M14.5 15.2c2.4.4 4.2 2.3 4.2 4.8"/></svg></span>
    <span class="uitnodig-tekst">
      <span class="uitnodig-titel">Nodig een vriend uit</span>
      <span class="uitnodig-sub">Samen spelen is leuker.</span>
    </span>
  </button>
</main>
<div id="nav-plek"></div>
<script src="/assets/supabase.js"></script>
<script src="/assets/theme.js"></script>
<script src="/assets/i18n.js"></script>
<script src="/assets/nav.js"></script>
<script src="/assets/verjaardag/insluiten.js"></script>
<script>
  const sessie = vereisSessie();
  initNav('home');

  const dagnamen = ['maandag', 'dinsdag', 'woensdag', 'donderdag', 'vrijdag', 'zaterdag', 'zondag'];

  function berekenLeeftijd(geboortedatum) {
    if (!geboortedatum) return null;
    const nu = new Date(); const gd = new Date(geboortedatum);
    let leeftijd = nu.getFullYear() - gd.getFullYear();
    if (nu.getMonth() < gd.getMonth() || (nu.getMonth() === gd.getMonth() && nu.getDate() < gd.getDate())) leeftijd--;
    return leeftijd;
  }

  function initialen(naam) {
    return naam.split(' ').filter(Boolean).slice(0, 2).map(n => n[0].toUpperCase()).join('');
  }

  function toonLedenPopup(titel, leden) {
    const bestaand = document.getElementById('home-popup');
    if (bestaand) bestaand.remove();
    const overlay = document.createElement('div');
    overlay.className = 'popup-overlay';
    overlay.id = 'home-popup';
    overlay.innerHTML = '<div class="popup-kaart"><div class="popup-kop"><h3>' + escapeHtml(titel) + '</h3>' +
      '<button type="button" class="popup-sluit" aria-label="Sluiten">✕</button></div>' +
      (leden.length
        ? leden.map(l => '<div class="lid-regel">' +
            (l.avatar_url ? '<img class="lid-avatar" src="' + escapeHtml(l.avatar_url) + '" alt="" />' : '<span class="lid-avatar">' + escapeHtml(initialen(l.naam)) + '</span>') +
            '<span>' + escapeHtml(l.naam) + '</span></div>').join('')
        : '<p class="details">Nog niemand aangemeld.</p>') +
      '</div>';
    overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });
    overlay.querySelector('.popup-sluit').addEventListener('click', () => overlay.remove());
    document.body.appendChild(overlay);
  }

  async function laadProfiel() {
    const rows = await haalOp('leden', { select: 'naam,geboortedatum', id: 'eq.' + sessie.user_id });
    if (!rows.length) return;
    // De naam staat nu al in de header (zie nav.js) — hier alleen nog de
    // verjaardagscontrole nodig.
    toonVerjaardagAlsJarig(rows[0].geboortedatum, rows[0].naam.split(' ')[0]).catch(() => {});
  }

  /// Openstaande betaalherinnering van de beheerder (nog niet als voldaan
  /// afgevinkt) — blijft als banner staan tot een beheerder de betaling
  /// bevestigt. Matcht home_screen.dart's _betaalherinneringBanner.
  async function laadBetaalherinnering() {
    const el = document.getElementById('betaalherinnering-plek');
    const rows = await haalOp('betaal_herinneringen', {
      select: 'id,bericht,lid_abonnement_id',
      lid_id: 'eq.' + sessie.user_id, voldaan: 'eq.false',
      order: 'created_at.desc', limit: '1',
    });
    if (!rows.length) { el.innerHTML = ''; return; }
    const herinnering = rows[0];
    el.innerHTML = '<div class="betaal-banner">' +
      '<div class="kop"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="13"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>' +
      '<div><div class="titel">Betaling nodig</div><div class="bericht">' + escapeHtml(herinnering.bericht) + '</div></div></div>' +
      '<button type="button" class="knop-betalen" id="betalen-knop"><svg class="i-inline" style="margin-right:0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg> Betalen</button>' +
      '</div>';
    document.getElementById('betalen-knop').addEventListener('click', () => toonBetaalinstructies(herinnering.lid_abonnement_id));
  }

  /// Toont de door de beheerder ingevulde betaalinstructies + (als er een
  /// lid_abonnement_id is) een directe iDEAL-betaalknop. Matcht de app se
  /// widgets/betaalinstructies.dart.
  async function toonBetaalinstructies(lidAbonnementId) {
    const bestaand = document.getElementById('betaal-popup');
    if (bestaand) bestaand.remove();
    const rows = await haalOp('club_instellingen', { select: 'betaalinstructies', id: 'eq.true' });
    const instructies = (rows[0] && rows[0].betaalinstructies || '').trim();
    const instructiesHtml = instructies
      ? '<p class="betaal-instructies-tekst">' + escapeHtml(instructies).replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>') + '</p>'
      : '<p class="details">Neem contact op met het bestuur voor de betaalgegevens.</p>';
    const overlay = document.createElement('div');
    overlay.className = 'popup-overlay';
    overlay.id = 'betaal-popup';
    overlay.innerHTML = '<div class="popup-kaart">' +
      '<div class="popup-kop"><h3>Hoe kun je betalen?</h3><button type="button" class="popup-sluit" aria-label="Sluiten">✕</button></div>' +
      (lidAbonnementId
        ? '<button type="button" class="ideal-knop" id="ideal-knop">⚡ Betaal nu via iDEAL</button>' +
          '<p class="details" style="margin:10px 0">Of betaal liever zelf (contant/overschrijving):</p>'
        : '') +
      instructiesHtml +
      '<p class="details" style="margin-top:14px">Heb je al betaald? De beheerder verwerkt dit zodra het binnen is.</p>' +
      '</div>';
    overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });
    overlay.querySelector('.popup-sluit').addEventListener('click', () => overlay.remove());
    document.body.appendChild(overlay);
    const idealKnop = document.getElementById('ideal-knop');
    if (idealKnop) {
      idealKnop.addEventListener('click', async () => {
        idealKnop.disabled = true;
        idealKnop.textContent = 'Bezig…';
        try {
          const res = await functieAanroepen('create-mollie-payment', { type: 'abonnement', lid_abonnement_id: lidAbonnementId });
          if (res.checkoutUrl) window.location.href = res.checkoutUrl;
        } catch (e) {
          alert(e.message || 'Kan de betaalpagina niet openen.');
          idealKnop.disabled = false;
          idealKnop.textContent = '⚡ Betaal nu via iDEAL';
        }
      });
    }
  }

  /// Openstaande "Samen spelen?"-verzoeken van vandaag — matcht
  /// home_screen.dart's _laadSamenSpelenVerzoeken/_samenSpelenBanner.
  async function laadSamenSpelen() {
    const el = document.getElementById('samenspelen-plek');
    const beginVandaag = new Date(); beginVandaag.setHours(0, 0, 0, 0);
    const verzoeken = await haalOp('speel_verzoeken', {
      select: 'id,van_lid_id,leden!speel_verzoeken_van_lid_id_fkey(naam)',
      naar_lid_id: 'eq.' + sessie.user_id, status: 'eq.open',
      created_at: 'gte.' + beginVandaag.toISOString(),
      order: 'created_at.desc',
    });
    el.innerHTML = verzoeken.map(v => '<div class="samenspelen-banner" data-verzoek="' + v.id + '">' +
      '<div class="kop"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 3v18" stroke-linecap="round"/><path d="M5 4h11l-2.5 3.5L16 11H5" stroke-linejoin="round"/></svg>' +
      '<span>' + escapeHtml((v.leden && v.leden.naam) || '?') + ' vraagt: samen spelen?</span></div>' +
      '<div class="knoppen-rij">' +
      '<button type="button" class="knop-ja" data-antwoord="ja">✓ Ja</button>' +
      '<button type="button" class="knop-nee" data-antwoord="nee">✕ Nee</button>' +
      '</div></div>').join('');
    el.querySelectorAll('[data-antwoord]').forEach(btn => btn.addEventListener('click', async () => {
      const banner = btn.closest('[data-verzoek]');
      await werkBij('speel_verzoeken', { id: 'eq.' + banner.dataset.verzoek }, { status: btn.dataset.antwoord });
      banner.remove();
    }));
  }

  /// "Jouw statistieken" (alle tijden) — alleen tonen als er al gespeeld is,
  /// matcht home_screen.dart's `if (d.stats.alleTijden.gespeeld > 0)`.
  async function laadStatistieken() {
    const kaart = document.getElementById('statistieken-kaart');
    const el = document.getElementById('statistieken-inhoud');
    const rows = await haalOp('lid_avond_statistieken', { select: 'gespeeld,gewonnen', lid_id: 'eq.' + sessie.user_id });
    const s = rows[0] || { gespeeld: 0, gewonnen: 0 };
    if (!s.gespeeld) { kaart.style.display = 'none'; return; }
    const winstPct = Math.round((s.gewonnen / s.gespeeld) * 100);
    kaart.style.display = '';
    el.innerHTML =
      '<div class="stat-tegel-los" style="background:rgba(36,87,255,0.06)"><div class="waarde" style="color:var(--navy)">' + s.gespeeld + '</div><div class="label">Gespeeld</div></div>' +
      '<div class="stat-tegel-los" style="background:rgba(228,29,35,0.06)"><div class="waarde" style="color:var(--accent)">' + winstPct + '%</div><div class="label">Winst</div></div>';
  }

  /// Club-brede cijfers — matcht home_screen.dart's _laadClubStats/_clubStatsRij.
  async function laadClubStats() {
    const el = document.getElementById('club-stats-inhoud');
    const [leden, speeldagen] = await Promise.all([
      haalOp('leden', { select: 'lid_sinds', actief: 'eq.true' }),
      haalOp('speeldagen', { select: 'aantal_banen', actief: 'eq.true' }),
    ]);
    const nu = new Date();
    const nieuweDezeMaand = leden.filter(l => {
      if (!l.lid_sinds) return false;
      const d = new Date(l.lid_sinds);
      return d.getFullYear() === nu.getFullYear() && d.getMonth() === nu.getMonth();
    }).length;
    const actieveBanen = speeldagen.reduce((som, sd) => som + (sd.aantal_banen || 0), 0);
    el.className = 'stat-tegel-rij';
    el.innerHTML =
      '<div class="stat-tegel-los" style="background:rgba(36,87,255,0.06)"><div class="waarde" style="color:var(--navy)">' + leden.length + '</div><div class="label">Totaal Leden</div></div>' +
      '<div class="stat-tegel-los" style="background:rgba(228,29,35,0.06)"><div class="waarde" style="color:var(--accent)">+' + nieuweDezeMaand + '</div><div class="label">Nieuw deze maand</div></div>' +
      '<div class="stat-tegel-los" style="background:rgba(91,107,125,0.08)"><div class="waarde" style="color:var(--ink)">' + actieveBanen + '</div><div class="label">Actieve Banen</div></div>';
  }

  async function laadAbonnement() {
    const el = document.getElementById('abonnement-inhoud');
    const [actief, avond] = await Promise.all([
      haalOp('lid_abonnementen', {
        select: 'status,strippen_resterend,geldig_tot,abonnementen(naam,vorm)',
        lid_id: 'eq.' + sessie.user_id, status: 'eq.actief', limit: '1',
      }),
      haalOp('lid_avond_statistieken', { select: 'gespeeld,gewonnen', lid_id: 'eq.' + sessie.user_id }),
    ]);
    const stats = avond[0] || { gespeeld: 0, gewonnen: 0 };
    const winrate = stats.gespeeld > 0 ? Math.round((stats.gewonnen / stats.gespeeld) * 100) : null;
    const statsHtml = '<div class="mini-stat-rij">' +
      '<div class="mini-stat"><div class="waarde">' + stats.gespeeld + '</div><div class="label">Speelavonden</div></div>' +
      '<div class="mini-stat"><div class="waarde">' + (winrate === null ? '–' : winrate + '%') + '</div><div class="label">Win-%</div></div>' +
      '</div>';

    if (actief.length) {
      const naam = actief[0].abonnementen ? actief[0].abonnementen.naam : '';
      el.innerHTML = '<div class="status-regel"><span class="status-badge">' + escapeHtml(naam) + '</span></div>' + statsHtml +
        '<p style="margin-top:10px"><a href="/leden/profiel.html" style="color:var(--navy);font-size:13px;font-weight:700;text-decoration:none">Beheren →</a></p>';
      return;
    }
    const wachtend = await haalOp('lid_abonnementen', {
      select: 'id', lid_id: 'eq.' + sessie.user_id, status: 'eq.in_afwachting', limit: '1',
    });
    if (wachtend.length) {
      el.innerHTML = '<span class="status-badge leeg">In afwachting van betaling</span>' + statsHtml +
        '<p style="margin-top:10px"><a href="/leden/profiel.html" style="color:var(--navy);font-size:13px;font-weight:700;text-decoration:none">Afronden →</a></p>';
      return;
    }
    el.innerHTML = '<span class="status-badge leeg">Geen actief abonnement</span>' + statsHtml +
      '<p style="margin-top:10px"><a href="/leden/profiel.html" style="color:var(--navy);font-size:13px;font-weight:700;text-decoration:none">Abonnement starten →</a></p>';
  }

  async function laadVolgendeSpeelavond() {
    const el = document.getElementById('volgende-speelavond-inhoud');
    const speeldagen = await haalOp('speeldagen', { select: 'id,weekdag,start_tijd,eind_tijd,locatie,max_spelers', actief: 'eq.true' });
    if (!speeldagen.length) { el.textContent = 'Geen speelavonden gevonden.'; return; }
    const nu = new Date();
    let volgende = null;
    for (let dag = new Date(nu.getFullYear(), nu.getMonth(), nu.getDate()); !volgende; dag.setDate(dag.getDate() + 1)) {
      if (dag.getMonth() === 6) continue;
      const isodow = dag.getDay() === 0 ? 7 : dag.getDay();
      for (const sd of speeldagen) {
        if (sd.weekdag !== isodow) continue;
        const [suur, smin] = sd.start_tijd.split(':').map(Number);
        const start = new Date(dag.getFullYear(), dag.getMonth(), dag.getDate(), suur, smin);
        if (start < nu) continue;
        volgende = { speeldagId: sd.id, start, locatie: sd.locatie, eindTijd: sd.eind_tijd, maxSpelers: sd.max_spelers };
        break;
      }
    }

    const reserveringen = await haalOp('reserveringen', {
      select: 'lid_id,leden(naam,avatar_url)', speeldag_id: 'eq.' + volgende.speeldagId, start_tijd: 'eq.' + volgende.start.toISOString(),
    });
    const benIkAangemeld = reserveringen.some(r => r.lid_id === sessie.user_id);

    el.innerHTML = '<div class="speeldag-regel"><span><span class="dag">' +
      dagnamen[volgende.start.getDay() === 0 ? 6 : volgende.start.getDay() - 1] + ' ' +
      volgende.start.toLocaleDateString('nl-NL', { day: 'numeric', month: 'long' }) + ', ' +
      volgende.start.toTimeString().slice(0, 5) + '–' + volgende.eindTijd.slice(0, 5) +
      (benIkAangemeld ? '<span class="aangemeld-badge">✓ Aangemeld</span>' : '') + '</span><br>' +
      '<span class="locatie">' + escapeHtml(volgende.locatie) + '</span></span></div>' +
      '<button type="button" class="aanmelders-knop" id="zie-aanmelders-knop"><svg class="i-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.4"/><path d="M3 20c0-3 3-5 6-5s6 2 6 5"/><path d="M15 15.5c2.2.3 4 2 4 4.5"/></svg>' + reserveringen.length + '/' + volgende.maxSpelers + ' aangemeld — bekijk wie →</button>' +
      '<p style="margin-top:10px"><a href="/leden/reserveren.html" style="color:var(--navy);font-size:13px;font-weight:700;text-decoration:none">Aanmelden/afmelden →</a></p>';

    document.getElementById('zie-aanmelders-knop').addEventListener('click', () => {
      const leden = reserveringen.map(r => r.leden).filter(Boolean);
      toonLedenPopup('Aangemeld voor deze speelavond', leden);
    });
  }

  async function laadNieuws() {
    const el = document.getElementById('nieuws-inhoud');
    const vandaag = new Date().toISOString().substring(0, 10);
    const [nieuws, landelijk] = await Promise.all([
      haalOp('nieuws', {
        select: 'titel,inhoud,gepubliceerd_op',
        or: '(vervaldatum.is.null,vervaldatum.gte.' + vandaag + ')',
        order: 'gepubliceerd_op.desc', limit: '2',
      }),
      haalOp('landelijke_toernooien', { select: 'naam,datum_start,plaats', datum_start: 'gte.' + vandaag, order: 'volgorde.asc', limit: '1' }),
    ]);

    let html = '';
    if (!nieuws.length && !landelijk.length) { el.textContent = 'Nog geen nieuwsberichten.'; return; }
    html += nieuws.map(n => '<div class="nieuws-item"><h3>' + escapeHtml(n.titel) + '</h3><p>' + escapeHtml(n.inhoud) + '</p></div>').join('');
    if (landelijk.length) {
      const t = landelijk[0];
      html += '<div class="landelijk-item"><div class="naam"><svg class="i-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v4a5 5 0 0 1-10 0V4Z"/><path d="M17 5h2.5a1.5 1.5 0 0 1 1.5 1.5c0 2-1.5 3.5-3.5 3.5M7 5H4.5A1.5 1.5 0 0 0 3 6.5C3 8.5 4.5 10 6.5 10"/></svg>' + escapeHtml(t.naam) + '</div>' +
        '<div class="sub">' + new Date(t.datum_start).toLocaleDateString('nl-NL', { day: 'numeric', month: 'long' }) + ' · ' + escapeHtml(t.plaats) + ' · landelijk toernooi</div></div>';
    }
    html += '<p style="margin-top:10px"><a href="/leden/nieuws.html" style="color:var(--navy);font-size:13px;font-weight:700;text-decoration:none">Al het nieuws →</a>' +
      ' <a href="/leden/toernooien.html" style="color:var(--navy);font-size:13px;font-weight:700;text-decoration:none;margin-left:10px">Landelijke toernooien →</a></p>';
    el.innerHTML = html;
  }

  Promise.all([
    laadProfiel(), laadBetaalherinnering(), laadSamenSpelen(), laadAbonnement(),
    laadVolgendeSpeelavond(), laadStatistieken(), laadNieuws(), laadClubStats(),
  ]).catch(e => console.error(e));

  /// "Nodig een vriend uit" — zelfde Web Share API + klembord-fallback als
  /// de tegel op leden.html, matcht home_screen.dart's _nodigVriendUit().
  document.getElementById('uitnodig-vriend-knop').addEventListener('click', async () => {
    let tekst = 'Kom pickleballen bij Almere Pickleball!';
    try {
      const rows = await haalOp('club_instellingen', { select: 'uitnodig_tekst', id: 'eq.true' });
      if (rows[0] && rows[0].uitnodig_tekst) tekst = rows[0].uitnodig_tekst;
    } catch (e) { /* val terug op de standaardtekst hierboven */ }
    if (navigator.share) {
      try { await navigator.share({ title: 'Almere Pickleball', text: tekst }); }
      catch (e) { /* gebruiker annuleerde het deelvenster — geen actie nodig */ }
      return;
    }
    try { await navigator.clipboard.writeText(tekst); alert('Tekst gekopieerd naar klembord.'); }
    catch (e) { alert('Kon de tekst niet kopiëren.'); }
  });
</script>
</body>
</html>
