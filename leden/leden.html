<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8" />
<script>(function(){try{var t=localStorage.getItem('pb_thema');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Leden — Almere Pickleball</title>
<meta name="robots" content="noindex" />
<link rel="icon" type="image/png" href="/assets/img/logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/assets/leden.css" />
<style>
  .zoekbalk {
    width: 100%; padding: 10px 14px; border-radius: 10px; border: 1.5px solid var(--line);
    background: var(--paper); color: var(--ink); font-size: 14px; font-family: inherit; margin-bottom: 10px;
  }
  .niveau-filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
  .niveau-filters button {
    padding: 6px 12px; border-radius: 999px; border: 1.5px solid var(--line); background: transparent;
    color: var(--ink-muted); font-size: 12.5px; font-weight: 600; cursor: pointer;
  }
  .niveau-filters button.actief { background: var(--navy); border-color: var(--navy); color: #fff; }
  .lid-regel { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
  .lid-regel:first-of-type { border-top: none; padding-top: 0; }
  .avatar {
    width: 42px; height: 42px; border-radius: 50%; flex-shrink: 0; object-fit: cover;
    background: linear-gradient(135deg, var(--navy), var(--navy-deep)); color: #fff;
    display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px;
  }
  .lid-naam { font-weight: 700; font-size: 14.5px; }
  .lid-sub { color: var(--ink-muted); font-size: 12.5px; margin-top: 1px; }
  .lid-rating { font-weight: 700; font-size: 15px; color: var(--navy); min-width: 40px; text-align: right; }
  @media (prefers-color-scheme: dark) { .lid-rating { color: #8ab6ec; } }
  .rang-nummer { width: 22px; text-align: center; font-weight: 700; color: var(--ink-muted); font-size: 13px; }

  .lid-kaart { text-align: center; padding: 10px; }
  .avatar-groot {
    width: 96px; height: 96px; max-width: 96px; max-height: 96px; border-radius: 50%; object-fit: cover; margin: 0 auto 12px;
    background: linear-gradient(135deg, var(--navy), var(--navy-deep)); color: #fff;
    display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 32px;
    flex-shrink: 0;
  }
  .lid-kaart .naam { font-size: 18px; font-weight: 700; }
  .lid-kaart .niveau-badge {
    display: inline-block; margin-top: 6px; padding: 3px 12px; border-radius: 999px; font-size: 12px; font-weight: 700;
    background: rgba(0,91,191,0.1); color: var(--navy);
  }
  @media (prefers-color-scheme: dark) { .lid-kaart .niveau-badge { color: #8ab6ec; } }
  .lid-kaart .stat-rij { display: flex; gap: 10px; margin-top: 16px; }
  .lid-kaart .stat-tegel { flex: 1; background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 10px; }
  .lid-kaart .stat-tegel .waarde { font-size: 18px; font-weight: 700; color: var(--navy); }
  @media (prefers-color-scheme: dark) { .lid-kaart .stat-tegel .waarde { color: #8ab6ec; } }
  .lid-kaart .stat-tegel .label { font-size: 10.5px; color: var(--ink-muted); }
  .lid-kaart .details-knop {
    margin-top: 14px; padding: 9px 18px; border-radius: 999px; border: none; background: var(--navy); color: #fff;
    font-size: 13px; font-weight: 700; cursor: pointer; font-family: inherit;
  }
  .popup-overlay {
    position: fixed; inset: 0; background: rgba(4,27,51,0.45); z-index: 100;
    display: flex; align-items: center; justify-content: center; padding: 16px;
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  }
  .popup-kaart {
    background: var(--glas-oppervlak); -webkit-backdrop-filter: blur(24px) saturate(160%);
    backdrop-filter: blur(24px) saturate(160%); border: 1px solid var(--glas-rand);
    border-radius: 22px; width: 100%; max-width: 380px; padding: 22px; text-align: center;
    box-shadow: 0 20px 50px rgba(4,27,51,0.35), inset 0 1px 0 var(--glas-hooglicht-boven), inset 0 -1px 0 var(--glas-hooglicht-onder);
  }
  .popup-sluit-rij { text-align: right; }
  .popup-sluit { background: rgba(91,107,125,0.12); border: none; border-radius: 50%; width: 28px; height: 28px; font-size: 14px; cursor: pointer; color: var(--ink-muted); }
  .mini-toast {
    position: fixed; left: 50%; bottom: calc(90px + env(safe-area-inset-bottom, 0px)); z-index: 150;
    transform: translate(-50%, 12px); opacity: 0; transition: transform 0.25s ease, opacity 0.25s ease;
    background: var(--glas-oppervlak); -webkit-backdrop-filter: blur(20px) saturate(160%); backdrop-filter: blur(20px) saturate(160%);
    border: 1px solid var(--glas-rand); border-radius: 999px; padding: 10px 18px; font-size: 13px; font-weight: 600;
    color: var(--ink); box-shadow: 0 8px 24px rgba(4,27,51,0.2); max-width: 88vw; text-align: center;
  }
  .mini-toast.zichtbaar { transform: translate(-50%, 0); opacity: 1; }
</style>
</head>
<body>
<header>
  <img src="/assets/img/logo.png" alt="" width="40" height="39" style="border-radius: 8px;" />
  <div style="flex: 1; min-width: 0;">
    <div class="merk">Almere Pickleball</div>
    <h1 id="kop-titel">Leden</h1>
  </div>
  <div id="account-plek"></div>
</header>
<main>
  <div class="kaart">
    <div class="pil-toggle">
      <button id="pil-leden" class="actief">Leden</button>
      <button id="pil-ranglijst">Ranglijst</button>
    </div>
    <div id="leden-zoek-blok">
      <input id="zoekveld" class="zoekbalk" type="search" placeholder="Zoek op naam…" />
      <div class="niveau-filters">
        <button data-niveau="" class="actief">Alle niveaus</button>
        <button data-niveau="beginner">Beginner</button>
        <button data-niveau="gevorderd">Gevorderd</button>
        <button data-niveau="competitie">Competitie</button>
      </div>
    </div>
    <div id="leden-swipe-banner" class="swipe-banner">
      <span class="helft"><span class="pijl">←</span> <span>Niet <strong>samen spelen</strong></span></span>
      <span class="scheiding"></span>
      <span class="helft rechts"><span><strong>Samen spelen</strong></span> <span class="pijl">→</span></span>
    </div>
    <div id="leden-inhoud" class="laden">Laden…</div>
  </div>
</main>
<div id="nav-plek"></div>
<script src="/assets/supabase.js"></script>
<script src="/assets/theme.js"></script>
<script src="/assets/i18n.js"></script>
<script src="/assets/nav.js"></script>
<script src="/assets/swipe-deck.js"></script>
<script>
  const sessie = vereisSessie();
  initNav('leden');

  const niveauLabels = { beginner: 'Beginner', gevorderd: 'Gevorderd', competitie: 'Competitie' };

  let alleLeden = [];
  let statsMap = {};
  let zoek = '';
  let niveauFilter = '';
  let toonRanglijst = false;
  let ledenDeck = null;
  // Module-scope i.p.v. lokaal aan render(): initSwipeDeck bindt onRender/
  // onSwipeRechts/onSwipeLinks maar één keer (bij de eerste render), dus
  // latere render()-aanroepen (zoeken, filteren, swipen) moeten dezelfde
  // variabele bijwerken i.p.v. een nieuwe lokale te schaduwen — anders
  // lezen die eerder gebonden callbacks straks een verouderde lijst/index.
  let swipeLijst = [];

  function initialen(naam) {
    return naam.split(' ').filter(Boolean).slice(0, 2).map(n => n[0].toUpperCase()).join('');
  }

  function subtitel(lid) {
    const niveau = niveauLabels[lid.niveau] || lid.niveau || '';
    const s = statsMap[lid.id];
    if (!s || !s.gespeeld) return niveau;
    const pct = Math.round((s.gewonnen / s.gespeeld) * 100);
    return niveau + ' · ' + s.gespeeld + ' gespeeld, ' + s.gewonnen + ' gewonnen (' + pct + '%)';
  }

  // "Niet samen spelen" (swipe links op de Leden-tab) is een pure lokale
  // voorkeur van dit toestel — verbergt dat lid alleen uit je eigen
  // Leden-swipe-weergave, niet uit de Ranglijst (die blijft de volledige,
  // objectieve clubranglijst tonen).
  function geefLedenGenegeerd() { return JSON.parse(localStorage.getItem('pb_leden_genegeerd') || '[]'); }

  function toonToast(tekst) {
    const bestaand = document.getElementById('mini-toast');
    if (bestaand) bestaand.remove();
    const toast = document.createElement('div');
    toast.id = 'mini-toast';
    toast.className = 'mini-toast';
    toast.textContent = tekst;
    document.body.appendChild(toast);
    requestAnimationFrame(() => toast.classList.add('zichtbaar'));
    setTimeout(() => { toast.classList.remove('zichtbaar'); setTimeout(() => toast.remove(), 250); }, 2200);
  }

  function gefilterdeLeden() {
    return alleLeden.filter(l => {
      const naamMatch = l.naam.toLowerCase().includes(zoek);
      const niveauMatch = !niveauFilter || l.niveau === niveauFilter;
      return naamMatch && niveauMatch;
    });
  }

  function toonWedstrijdDetails(lid) {
    const s = statsMap[lid.id] || { gespeeld: 0, gewonnen: 0 };
    const winrate = s.gespeeld > 0 ? Math.round((s.gewonnen / s.gespeeld) * 100) : null;
    const bestaand = document.getElementById('lid-popup');
    if (bestaand) bestaand.remove();
    const overlay = document.createElement('div');
    overlay.className = 'popup-overlay';
    overlay.id = 'lid-popup';
    overlay.innerHTML = '<div class="popup-kaart">' +
      '<div class="popup-sluit-rij"><button type="button" class="popup-sluit" aria-label="Sluiten">✕</button></div>' +
      (lid.avatar_url ? '<img class="avatar-groot" src="' + lid.avatar_url + '" alt="" />' : '<div class="avatar-groot">' + initialen(lid.naam) + '</div>') +
      '<div class="naam">' + lid.naam + '</div>' +
      '<span class="niveau-badge">' + (niveauLabels[lid.niveau] || lid.niveau || '') + '</span>' +
      '<div class="stat-rij">' +
      '<div class="stat-tegel"><div class="waarde">' + (lid.rating != null ? Number(lid.rating).toFixed(2) : '–') + '</div><div class="label">Rating</div></div>' +
      '<div class="stat-tegel"><div class="waarde">' + s.gespeeld + '</div><div class="label">Speelavonden</div></div>' +
      '<div class="stat-tegel"><div class="waarde">' + (winrate === null ? '–' : winrate + '%') + '</div><div class="label">Win-%</div></div>' +
      '</div></div>';
    overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });
    overlay.querySelector('.popup-sluit').addEventListener('click', () => overlay.remove());
    document.body.appendChild(overlay);
  }

  function render() {
    const el = document.getElementById('leden-inhoud');
    const lijst = gefilterdeLeden();
    el.className = '';
    document.getElementById('leden-swipe-banner').style.display = toonRanglijst ? 'none' : '';
    if (!lijst.length) { el.innerHTML = '<p class="details">Geen leden gevonden.</p>'; ledenDeck = null; return; }

    if (toonRanglijst) {
      const gesorteerd = [...lijst].sort((a, b) => (Number(b.rating) || 0) - (Number(a.rating) || 0));
      el.innerHTML = gesorteerd.map((l, i) => {
        const rating = l.rating != null ? Number(l.rating).toFixed(2) : '–';
        return '<div class="lid-regel">' +
          '<span class="rang-nummer">' + (i + 1) + '</span>' +
          (l.avatar_url ? '<img class="avatar" src="' + l.avatar_url + '" alt="" />' : '<span class="avatar">' + initialen(l.naam) + '</span>') +
          '<span style="flex:1"><span class="lid-naam">' + l.naam + '</span>' +
          '<div class="lid-sub">' + subtitel(l) + '</div></span>' +
          '<span class="lid-rating">' + rating + '</span></div>';
      }).join('');
      ledenDeck = null;
      return;
    }

    // Leden-weergave: tinder-stijl swipe-kaarten met foto, klik voor wedstrijddetails.
    const genegeerd = geefLedenGenegeerd();
    swipeLijst = lijst.filter(l => !genegeerd.includes(l.id));
    const kaarten = swipeLijst.map((l, i) => '<div class="lid-kaart">' +
      (l.avatar_url ? '<img class="avatar-groot" src="' + l.avatar_url + '" alt="" />' : '<div class="avatar-groot">' + initialen(l.naam) + '</div>') +
      '<div class="naam">' + l.naam + '</div>' +
      '<span class="niveau-badge">' + (niveauLabels[l.niveau] || l.niveau || '') + '</span>' +
      '<button type="button" class="details-knop" data-details-index="' + i + '">Bekijk wedstrijddetails</button>' +
      '</div>');

    if (ledenDeck) {
      ledenDeck.herlaad(kaarten);
    } else {
      el.innerHTML = '';
      ledenDeck = initSwipeDeck(el, kaarten, {
        leegTekst: 'Geen leden gevonden.',
        // Deze callbacks worden maar één keer gebonden (bij deze eerste
        // render) — ze lezen daarom bewust de module-scope swipeLijst
        // i.p.v. de bovenstaande const, zodat latere render()-aanroepen
        // (zoeken/filteren/swipen) ze altijd van verse data voorzien.
        onRender: (kaartEl) => {
          const btn = kaartEl.querySelector('[data-details-index]');
          if (btn) btn.addEventListener('click', () => toonWedstrijdDetails(swipeLijst[Number(btn.dataset.detailsIndex)]));
        },
        badgeRechts: 'Samen spelen', badgeLinks: 'Niet samen spelen',
        onSwipeRechts: (index) => {
          toonToast('Leuk! Misschien speel je snel met ' + swipeLijst[index].naam.split(' ')[0]);
          render();
        },
        onSwipeLinks: (index) => {
          const lijstGenegeerd = geefLedenGenegeerd();
          if (!lijstGenegeerd.includes(swipeLijst[index].id)) lijstGenegeerd.push(swipeLijst[index].id);
          localStorage.setItem('pb_leden_genegeerd', JSON.stringify(lijstGenegeerd));
          render();
        },
      });
    }
  }

  document.getElementById('zoekveld').addEventListener('input', e => {
    zoek = e.target.value.trim().toLowerCase();
    render();
  });

  document.querySelectorAll('.niveau-filters button').forEach(btn => {
    btn.addEventListener('click', () => {
      niveauFilter = btn.dataset.niveau;
      document.querySelectorAll('.niveau-filters button').forEach(b => b.classList.toggle('actief', b === btn));
      render();
    });
  });

  document.getElementById('pil-leden').addEventListener('click', () => wisselWeergave(false));
  document.getElementById('pil-ranglijst').addEventListener('click', () => wisselWeergave(true));

  function wisselWeergave(ranglijst) {
    toonRanglijst = ranglijst;
    document.getElementById('pil-leden').classList.toggle('actief', !ranglijst);
    document.getElementById('pil-ranglijst').classList.toggle('actief', ranglijst);
    document.getElementById('kop-titel').textContent = ranglijst ? 'Ranglijst' : 'Leden';
    ledenDeck = null;
    render();
  }

  async function laadLeden() {
    const [leden, stats] = await Promise.all([
      haalOp('leden', { select: 'id,naam,niveau,rating,avatar_url', order: 'naam.asc' }),
      haalOp('lid_avond_statistieken', { select: 'lid_id,gespeeld,gewonnen' }),
    ]);
    alleLeden = leden;
    statsMap = {};
    stats.forEach(s => { statsMap[s.lid_id] = s; });
    render();
  }

  laadLeden().catch(e => {
    document.getElementById('leden-inhoud').textContent = e.message;
  });
</script>
</body>
</html>
