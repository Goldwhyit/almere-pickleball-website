<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8" />
<script>(function(){try{var t=localStorage.getItem('pb_thema');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Leden — Almere Pickleball</title>
<meta name="robots" content="noindex" />
<link rel="icon" type="image/png" href="/assets/img/logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/assets/leden.css" />
<style>
  .zoekbalk {
    width: 100%; padding: 10px 14px; border-radius: 10px; border: 1.5px solid var(--line);
    background: var(--paper); color: var(--ink); font-size: 14px; font-family: inherit; margin-bottom: 10px;
  }
  .niveau-filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
  .niveau-filters button {
    padding: 6px 12px; border-radius: 999px; border: 1.5px solid var(--line); background: transparent;
    color: var(--ink-muted); font-size: 12.5px; font-weight: 600; cursor: pointer;
  }
  .niveau-filters button.actief { background: var(--navy); border-color: var(--navy); color: #fff; }
  .lid-regel { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
  .lid-regel:first-of-type { border-top: none; padding-top: 0; }
  .avatar {
    width: 42px; height: 42px; border-radius: 50%; flex-shrink: 0; object-fit: cover;
    background: linear-gradient(135deg, var(--navy), var(--navy-deep)); color: #fff;
    display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px;
  }
  .lid-naam { font-weight: 700; font-size: 14.5px; }
  .lid-sub { color: var(--ink-muted); font-size: 12.5px; margin-top: 1px; }
  .lid-rating { font-weight: 700; font-size: 15px; color: var(--navy); min-width: 40px; text-align: right; }
  @media (prefers-color-scheme: dark) { .lid-rating { color: #8ab6ec; } }
  .rang-nummer { width: 22px; text-align: center; font-weight: 700; color: var(--ink-muted); font-size: 13px; }

  .avatar-groot {
    width: 96px; height: 96px; max-width: 96px; max-height: 96px; border-radius: 50%; object-fit: cover; margin: 0 auto 12px;
    background: linear-gradient(135deg, var(--navy), var(--navy-deep)); color: #fff;
    display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 32px;
    flex-shrink: 0;
  }

  /* Vlakke, volledige-foto ledenkaart — geen holografische shine/glare/
     kanteling meer (was aangepast van ReactBits' "Profile Card"), enkel de
     gender-tint (zie kleurenVoorLid()) en een statische schaduw. .swipe-kaart
     blijft een generieke, ongestylede wrapper (gedeeld met reserveren/
     toernooien/nieuws) — die verliest hier enkel zijn eigen padding/
     achtergrond zodat de ledenkaart 'm volledig vult. */
  .swipe-kaart:has(.lid-kaart) { background: transparent; border: none; box-shadow: none; padding: 0; }
  .lid-kaart {
    position: relative; width: 100%; max-width: 300px; aspect-ratio: 3 / 4; margin: 0 auto;
  }
  /* Kleurthematisering (mannen/vrouwen, zie kleurenVoorLid()) komt binnen
     via deze twee custom properties, per kaart in de inline style gezet;
     de defaults hieronder gelden enkel als fallback als JS ze niet zet. */
  .lid-kaart { --kaart-surface: #141D38; --kaart-highlight: #FCDB32; }
  .lid-kaart-foto {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
  }
  .lid-kaart-foto-leeg {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(150deg, var(--kaart-surface), color-mix(in srgb, var(--kaart-surface) 60%, black));
    font-size: 64px; font-weight: 700; color: var(--kaart-highlight);
  }
  .lid-kaart-surface {
    position: relative; width: 100%; height: 100%; border-radius: 24px; overflow: hidden; text-align: center;
    background: #0a0c12;
    box-shadow: 0 8px 20px -6px rgba(0,0,0,0.5);
  }
  /* Alleen bovenin een donker-naar-transparant overloop (voor naam/niveau-
     leesbaarheid) i.p.v. een waas/glas-tint over de hele kaart — de
     onderbalk heeft al zijn eigen ondoorzichtige achtergrond. */
  .lid-kaart-inside {
    position: absolute; inset: 0;
    background: linear-gradient(to bottom, rgba(0,0,0,0.55) 0%, transparent 34%);
  }
  .lid-kaart-head { position: absolute; left: 0; right: 0; top: 18px; padding: 0 16px; pointer-events: none; }
  .lid-kaart .naam {
    margin: 0; font-size: 19px; font-weight: 700; letter-spacing: -0.01em; color: #f2f6fc;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .lid-kaart-niveau {
    margin: 3px 0 0; font-size: 11px; color: var(--kaart-highlight); text-transform: uppercase;
    letter-spacing: 0.05em; font-weight: 700; opacity: 0.85;
  }
  .lid-kaart-bar {
    position: absolute; left: 10px; right: 10px; bottom: 10px; display: flex; align-items: center; gap: 8px;
    padding: 8px 9px; border-radius: 16px; background: rgba(14,17,24,0.72); border: 1px solid rgba(226,236,248,0.12);
    text-align: left;
  }
  .lid-kaart-chip {
    width: 30px; height: 30px; flex: 0 0 auto; display: flex; align-items: center; justify-content: center;
    border-radius: 9px; background: var(--kaart-highlight); font-size: 11px; font-weight: 700;
    color: var(--kaart-surface);
  }
  .lid-kaart-meta { display: flex; flex-direction: column; gap: 1px; flex: 1; min-width: 0; }
  .lid-kaart-meta b { font-size: 11.5px; font-weight: 700; color: #e8eef7; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lid-kaart-meta i {
    font-style: normal; font-size: 10px; color: rgba(226,236,248,0.55); display: block;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .lid-kaart { cursor: pointer; }

  .popup-kaart .naam { font-size: 18px; font-weight: 700; }
  .popup-kaart .niveau-badge {
    display: inline-block; margin-top: 6px; padding: 3px 12px; border-radius: 999px; font-size: 12px; font-weight: 700;
    background: rgba(36,87,255,0.1); color: var(--navy);
  }
  @media (prefers-color-scheme: dark) { .popup-kaart .niveau-badge { color: #8ab6ec; } }
  .popup-kaart .stat-rij { display: flex; gap: 10px; margin-top: 16px; }
  .popup-kaart .stat-tegel { flex: 1; background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 10px; }
  .popup-kaart .stat-tegel .waarde { font-size: 18px; font-weight: 700; color: var(--navy); }
  @media (prefers-color-scheme: dark) { .popup-kaart .stat-tegel .waarde { color: #8ab6ec; } }
  .popup-kaart .stat-tegel .label { font-size: 10.5px; color: var(--ink-muted); }

  /* Lid-profielpopup: foto neemt de helft (2/4) van de kaart in, details de
     andere helft — i.p.v. de gestapelde, gecentreerde lay-out hierboven.
     De detailhelft deelt nu dezelfde mens/womens-kleuridentiteit als de
     foto (i.p.v. een losstaande witte/navy kaart) zodat de hele pop-up als
     één geheel oogt — matcht _ProfielPager in leden_screen.dart (app). */
  .popup-kaart--lid { max-width: 440px; padding: 0; text-align: left; overflow: hidden; }
  .popup-kaart--lid .popup-sluit-rij { position: absolute; top: 10px; right: 10px; z-index: 2; }
  .popup-kaart--lid .popup-sluit { background: rgba(4,10,20,0.45); color: #fff; }
  .popup-lid-layout { display: flex; align-items: stretch; min-height: 260px; }
  .popup-lid-foto {
    position: relative; flex: 0 0 50%; overflow: hidden;
    background: linear-gradient(150deg, var(--kaart-surface, #141D38), color-mix(in srgb, var(--kaart-surface, #141D38) 55%, black));
  }
  .popup-lid-foto img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .popup-lid-foto .popup-lid-initialen {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 44px; font-weight: 700; color: var(--kaart-highlight, #FCDB32);
  }
  .popup-lid-details {
    flex: 1 1 50%; min-width: 0; padding: 20px 18px; display: flex; flex-direction: column;
    background: var(--kaart-surface, #141D38); color: #f2f6fc;
  }
  .popup-lid-details .naam { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #f2f6fc; }
  .popup-lid-details .niveau-badge {
    background: rgba(255,255,255,0.14); color: var(--kaart-highlight, #FCDB32);
  }
  .popup-lid-stats { margin-top: auto; display: flex; flex-direction: column; gap: 10px; padding-top: 14px; }
  .popup-lid-stat-regel { display: flex; align-items: center; gap: 10px; }
  .popup-lid-stat-regel .icoon {
    width: 26px; height: 26px; flex-shrink: 0; border-radius: 8px;
    background: color-mix(in srgb, var(--kaart-highlight, #FCDB32) 22%, transparent);
    color: var(--kaart-highlight, #FCDB32); display: flex; align-items: center; justify-content: center;
  }
  .popup-lid-stat-regel .icoon svg { width: 14px; height: 14px; }
  .popup-lid-stat-regel .label { font-size: 10.5px; color: rgba(242,246,252,0.6); display: block; }
  .popup-lid-stat-regel .waarde { font-size: 14.5px; font-weight: 700; color: #f2f6fc; display: block; }
  @media (max-width: 380px) {
    .popup-lid-layout { min-height: 220px; }
    .popup-lid-details { padding: 16px 14px; }
  }
  .popup-overlay {
    position: fixed; inset: 0; background: rgba(4,27,51,0.45); z-index: 100;
    display: flex; align-items: center; justify-content: center; padding: 16px;
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  }
  .popup-kaart {
    background: var(--glas-oppervlak); -webkit-backdrop-filter: blur(24px) saturate(160%);
    backdrop-filter: blur(24px) saturate(160%); border: 1px solid var(--glas-rand);
    border-radius: 22px; width: 100%; max-width: 380px; padding: 22px; text-align: center;
    box-shadow: 0 20px 50px rgba(4,27,51,0.35), inset 0 1px 0 var(--glas-hooglicht-boven), inset 0 -1px 0 var(--glas-hooglicht-onder);
  }
  .popup-sluit-rij { text-align: right; }
  .popup-sluit { background: rgba(91,107,125,0.12); border: none; border-radius: 50%; width: 28px; height: 28px; font-size: 14px; cursor: pointer; color: var(--ink-muted); }
  .mini-toast {
    position: fixed; left: 50%; bottom: calc(90px + env(safe-area-inset-bottom, 0px)); z-index: 150;
    transform: translate(-50%, 12px); opacity: 0; transition: transform 0.25s ease, opacity 0.25s ease;
    background: var(--glas-oppervlak); -webkit-backdrop-filter: blur(20px) saturate(160%); backdrop-filter: blur(20px) saturate(160%);
    border: 1px solid var(--glas-rand); border-radius: 999px; padding: 10px 18px; font-size: 13px; font-weight: 600;
    color: var(--ink); box-shadow: 0 8px 24px rgba(4,27,51,0.2); max-width: 88vw; text-align: center;
  }
  .mini-toast.zichtbaar { transform: translate(-50%, 0); opacity: 1; }
  /* "Nieuw lid uitnodigen" — 1-op-1 _uitnodigenKaart in leden_screen.dart. */
  .uitnodig-kaart {
    display: flex; align-items: center; gap: 14px; width: 100%; text-align: left;
    border: none; cursor: pointer; font-family: inherit;
  }
  .uitnodig-icoon {
    width: 44px; height: 44px; flex-shrink: 0; border-radius: 50%; background: rgba(36,87,255,0.1);
    color: var(--navy); display: flex; align-items: center; justify-content: center;
  }
  .uitnodig-icoon svg { width: 22px; height: 22px; }
  .uitnodig-tekst { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .uitnodig-titel { font-weight: 600; font-size: 14.5px; color: var(--ink); }
  .uitnodig-sub { font-size: 12.5px; color: var(--ink-muted); }
</style>
</head>
<body>
<header>
  <img src="/assets/img/logo.png" alt="" width="40" height="39" style="border-radius: 8px;" />
  <div style="flex: 1; min-width: 0;">
    <div class="merk"></div>
    <h1 id="kop-titel">Leden</h1>
  </div>
  <div id="account-plek"></div>
</header>
<main>
  <div class="kaart">
    <div class="pil-toggle">
      <button id="pil-leden" class="actief">Leden</button>
      <button id="pil-ranglijst">Ranglijst</button>
    </div>
    <div id="leden-zoek-blok">
      <input id="zoekveld" class="zoekbalk" type="search" placeholder="Zoek op naam…" />
      <div class="niveau-filters">
        <button data-niveau="" class="actief">Alle niveaus</button>
        <button data-niveau="beginner">Beginner</button>
        <button data-niveau="gevorderd">Gevorderd</button>
        <button data-niveau="competitie">Competitie</button>
      </div>
    </div>
    <div id="leden-swipe-banner" class="swipe-banner">
      <span class="helft"><span class="pijl">←</span> <span>Niet <strong>samen spelen</strong></span></span>
      <span class="scheiding"></span>
      <span class="helft rechts"><span><strong>Samen spelen</strong></span> <span class="pijl">→</span></span>
    </div>
    <div id="leden-inhoud" class="laden">Laden…</div>
  </div>
  <button type="button" class="kaart uitnodig-kaart" id="uitnodig-knop">
    <span class="uitnodig-icoon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 3-6.2 6.5-6.2s6.5 2.6 6.5 6.2"/><line x1="18.5" y1="8" x2="18.5" y2="13"/><line x1="16" y1="10.5" x2="21" y2="10.5"/></svg></span>
    <span class="uitnodig-tekst">
      <span class="uitnodig-titel">Nieuw lid uitnodigen</span>
      <span class="uitnodig-sub">Groei de community en nodig je vrienden uit om mee te spelen.</span>
    </span>
  </button>
</main>
<div id="nav-plek"></div>
<script src="/assets/supabase.js"></script>
<script src="/assets/theme.js"></script>
<script src="/assets/i18n.js"></script>
<script src="/assets/nav.js"></script>
<script src="/assets/swipe-deck.js"></script>
<script>
  const sessie = vereisSessie();
  initNav('leden');

  const niveauLabels = { beginner: 'Beginner', gevorderd: 'Gevorderd', competitie: 'Competitie' };

  let alleLeden = [];
  let statsMap = {};
  let zoek = '';
  let niveauFilter = '';
  let toonRanglijst = false;
  let ledenDeck = null;
  // Module-scope i.p.v. lokaal aan render(): initSwipeDeck bindt onRender/
  // onSwipeRechts/onSwipeLinks maar één keer (bij de eerste render), dus
  // latere render()-aanroepen (zoeken, filteren, swipen) moeten dezelfde
  // variabele bijwerken i.p.v. een nieuwe lokale te schaduwen — anders
  // lezen die eerder gebonden callbacks straks een verouderde lijst/index.
  let swipeLijst = [];

  // Kleurthematisering per lid (mannen/vrouwen-tinten uit het design system,
  // zie AppTokens in de app) op basis van het geslacht-veld — 'x' of
  // onbekend wisselt gewoon om-en-om, puur als visuele variatie.
  const MANNEN_KLEUREN = { surface: '#141D38', highlight: '#FCDB32' };
  const VROUWEN_KLEUREN = { surface: '#3447AA', highlight: '#FBEAEB' };
  function kleurenVoorLid(lid, index) {
    if (lid.geslacht === 'm') return MANNEN_KLEUREN;
    if (lid.geslacht === 'v') return VROUWEN_KLEUREN;
    return index % 2 === 0 ? MANNEN_KLEUREN : VROUWEN_KLEUREN;
  }

  function initialen(naam) {
    return naam.split(' ').filter(Boolean).slice(0, 2).map(n => n[0].toUpperCase()).join('');
  }

  function subtitel(lid) {
    const niveau = niveauLabels[lid.niveau] || lid.niveau || '';
    const s = statsMap[lid.id];
    if (!s || !s.gespeeld) return niveau;
    const pct = Math.round((s.gewonnen / s.gespeeld) * 100);
    return niveau + ' · ' + s.gespeeld + ' gespeeld, ' + s.gewonnen + ' gewonnen (' + pct + '%)';
  }

  // "Niet samen spelen" (swipe links op de Leden-tab) is een pure lokale
  // voorkeur van dit toestel — verbergt dat lid alleen uit je eigen
  // Leden-swipe-weergave, niet uit de Ranglijst (die blijft de volledige,
  // objectieve clubranglijst tonen).
  function geefLedenGenegeerd() { return JSON.parse(localStorage.getItem('pb_leden_genegeerd') || '[]'); }

  function toonToast(tekst) {
    const bestaand = document.getElementById('mini-toast');
    if (bestaand) bestaand.remove();
    const toast = document.createElement('div');
    toast.id = 'mini-toast';
    toast.className = 'mini-toast';
    toast.textContent = tekst;
    document.body.appendChild(toast);
    requestAnimationFrame(() => toast.classList.add('zichtbaar'));
    setTimeout(() => { toast.classList.remove('zichtbaar'); setTimeout(() => toast.remove(), 250); }, 2200);
  }

  function gefilterdeLeden() {
    return alleLeden.filter(l => {
      const naamMatch = l.naam.toLowerCase().includes(zoek);
      const niveauMatch = !niveauFilter || l.niveau === niveauFilter;
      return naamMatch && niveauMatch;
    });
  }

  function lidStatRegel(icoonSvg, label, waarde) {
    return '<div class="popup-lid-stat-regel"><span class="icoon">' + icoonSvg + '</span>' +
      '<div><span class="label">' + label + '</span><span class="waarde">' + escapeHtml(waarde) + '</span></div></div>';
  }

  function toonWedstrijdDetails(lid, index) {
    const s = statsMap[lid.id] || { gespeeld: 0, gewonnen: 0 };
    const winrate = s.gespeeld > 0 ? Math.round((s.gewonnen / s.gespeeld) * 100) : null;
    const k = kleurenVoorLid(lid, index || 0);
    const kaartStijl = '--kaart-surface:' + k.surface + '; --kaart-highlight:' + k.highlight + ';';
    const bestaand = document.getElementById('lid-popup');
    if (bestaand) bestaand.remove();
    const overlay = document.createElement('div');
    overlay.className = 'popup-overlay';
    overlay.id = 'lid-popup';
    overlay.innerHTML = '<div class="popup-kaart popup-kaart--lid">' +
      '<div class="popup-sluit-rij"><button type="button" class="popup-sluit" aria-label="Sluiten">✕</button></div>' +
      '<div class="popup-lid-layout">' +
      '<div class="popup-lid-foto" style="' + kaartStijl + '">' +
      (lid.avatar_url
        ? '<img src="' + escapeHtml(lid.avatar_url) + '" alt="" />'
        : '<div class="popup-lid-initialen">' + escapeHtml(initialen(lid.naam)) + '</div>') +
      '</div>' +
      '<div class="popup-lid-details">' +
      '<div class="naam">' + escapeHtml(lid.naam) + '</div>' +
      '<span class="niveau-badge">' + escapeHtml(niveauLabels[lid.niveau] || lid.niveau || '') + '</span>' +
      '<div class="popup-lid-stats">' +
      lidStatRegel('<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="5"/><path d="M8.5 12.5L7 22l5-3 5 3-1.5-9.5"/></svg>',
        'Rating', lid.rating != null ? Number(lid.rating).toFixed(2) : '–') +
      lidStatRegel('<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>',
        'Speelavonden', String(s.gespeeld)) +
      lidStatRegel('<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="5" x2="5" y2="19"/><circle cx="6.5" cy="6.5" r="2.5"/><circle cx="17.5" cy="17.5" r="2.5"/></svg>',
        'Win-%', winrate === null ? '–' : winrate + '%') +
      '</div>' +
      '</div>' +
      '</div></div>';
    overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });
    overlay.querySelector('.popup-sluit').addEventListener('click', () => overlay.remove());
    document.body.appendChild(overlay);
  }

  function render() {
    const el = document.getElementById('leden-inhoud');
    const lijst = gefilterdeLeden();
    el.className = '';
    document.getElementById('leden-swipe-banner').style.display = toonRanglijst ? 'none' : '';
    if (!lijst.length) { el.innerHTML = '<p class="details">Geen leden gevonden.</p>'; ledenDeck = null; return; }

    if (toonRanglijst) {
      const gesorteerd = [...lijst].sort((a, b) => (Number(b.rating) || 0) - (Number(a.rating) || 0));
      el.innerHTML = gesorteerd.map((l, i) => {
        const rating = l.rating != null ? Number(l.rating).toFixed(2) : '–';
        return '<div class="lid-regel">' +
          '<span class="rang-nummer">' + (i + 1) + '</span>' +
          (l.avatar_url ? '<img class="avatar" src="' + escapeHtml(l.avatar_url) + '" alt="" />' : '<span class="avatar">' + escapeHtml(initialen(l.naam)) + '</span>') +
          '<span style="flex:1"><span class="lid-naam">' + escapeHtml(l.naam) + '</span>' +
          '<div class="lid-sub">' + escapeHtml(subtitel(l)) + '</div></span>' +
          '<span class="lid-rating">' + rating + '</span></div>';
      }).join('');
      ledenDeck = null;
      return;
    }

    // Leden-weergave: tinder-stijl swipe-kaarten met foto, overal op de
    // kaart klikken/tikken toont de details-popup (matcht de app, waar de
    // hele ledenkaart al tikbaar is) — geen apart "Details"-knopje meer
    // nodig.
    const genegeerd = geefLedenGenegeerd();
    swipeLijst = lijst.filter(l => !genegeerd.includes(l.id));
    const kaarten = swipeLijst.map((l, i) => {
      const ratingTxt = l.rating != null ? Number(l.rating).toFixed(2) : '–';
      const k = kleurenVoorLid(l, i);
      const kaartStijl = '--kaart-surface:' + k.surface + '; --kaart-highlight:' + k.highlight + ';';
      return '<div class="lid-kaart" tabindex="0" role="button" aria-label="Bekijk profiel van ' + escapeHtml(l.naam) + '" data-lid-index="' + i + '" style="' + kaartStijl + '">' +
        '<div class="lid-kaart-surface">' +
        (l.avatar_url
          ? '<img class="lid-kaart-foto" src="' + escapeHtml(l.avatar_url) + '" alt="" />'
          : '<div class="lid-kaart-foto-leeg" aria-hidden="true">' + escapeHtml(initialen(l.naam)) + '</div>') +
        '<span class="lid-kaart-inside" aria-hidden="true"></span>' +
        '<div class="lid-kaart-head">' +
        '<div class="naam">' + escapeHtml(l.naam) + '</div>' +
        '<p class="lid-kaart-niveau">' + escapeHtml(niveauLabels[l.niveau] || l.niveau || '') + '</p>' +
        '</div>' +
        '<div class="lid-kaart-bar">' +
        '<span class="lid-kaart-chip">' + escapeHtml(initialen(l.naam)) + '</span>' +
        '<span class="lid-kaart-meta"><b>Rating ' + ratingTxt + '</b><i>' + escapeHtml(subtitel(l)) + '</i></span>' +
        '</div>' +
        '</div></div>';
    });

    if (ledenDeck) {
      ledenDeck.herlaad(kaarten);
    } else {
      el.innerHTML = '';
      ledenDeck = initSwipeDeck(el, kaarten, {
        leegTekst: 'Geen leden gevonden.',
        // Deze callback wordt maar één keer gebonden (bij deze eerste
        // render) — leest daarom bewust de module-scope swipeLijst i.p.v.
        // de bovenstaande const, zodat latere render()-aanroepen (zoeken/
        // filteren/swipen) 'm altijd van verse data voorzien. Een échte
        // sleep (swipe) verplaatst de kaart altijd merkbaar voordat
        // muisup/touchend loskomt — de browser onderdrukt een 'click'-event
        // daarna vanzelf, dus geen aparte tap-versus-sleep-detectie nodig.
        onRender: (kaartEl) => {
          kaartEl.querySelector('.lid-kaart').addEventListener('click', () => {
            const idx = Number(kaartEl.querySelector('.lid-kaart').dataset.lidIndex);
            toonWedstrijdDetails(swipeLijst[idx], idx);
          });
        },
        badgeRechts: 'Samen spelen', badgeLinks: 'Niet samen spelen',
        onSwipeRechts: (index) => {
          toonToast('Leuk! Misschien speel je snel met ' + swipeLijst[index].naam.split(' ')[0]);
          render();
        },
        onSwipeLinks: (index) => {
          const lijstGenegeerd = geefLedenGenegeerd();
          if (!lijstGenegeerd.includes(swipeLijst[index].id)) lijstGenegeerd.push(swipeLijst[index].id);
          localStorage.setItem('pb_leden_genegeerd', JSON.stringify(lijstGenegeerd));
          render();
        },
      });
    }
  }

  document.getElementById('zoekveld').addEventListener('input', e => {
    zoek = e.target.value.trim().toLowerCase();
    render();
  });

  document.querySelectorAll('.niveau-filters button').forEach(btn => {
    btn.addEventListener('click', () => {
      niveauFilter = btn.dataset.niveau;
      document.querySelectorAll('.niveau-filters button').forEach(b => b.classList.toggle('actief', b === btn));
      render();
    });
  });

  document.getElementById('pil-leden').addEventListener('click', () => wisselWeergave(false));
  document.getElementById('pil-ranglijst').addEventListener('click', () => wisselWeergave(true));

  function wisselWeergave(ranglijst) {
    toonRanglijst = ranglijst;
    document.getElementById('pil-leden').classList.toggle('actief', !ranglijst);
    document.getElementById('pil-ranglijst').classList.toggle('actief', ranglijst);
    document.getElementById('kop-titel').textContent = ranglijst ? 'Ranglijst' : 'Leden';
    ledenDeck = null;
    render();
  }

  async function laadLeden() {
    const [leden, stats] = await Promise.all([
      haalOp('leden', { select: 'id,naam,niveau,rating,avatar_url,geslacht', actief: 'eq.true', order: 'naam.asc' }),
      haalOp('lid_avond_statistieken', { select: 'lid_id,gespeeld,gewonnen' }),
    ]);
    alleLeden = leden;
    statsMap = {};
    stats.forEach(s => { statsMap[s.lid_id] = s; });
    render();
  }

  laadLeden().catch(e => {
    document.getElementById('leden-inhoud').textContent = e.message;
  });

  /// "Nieuw lid uitnodigen" — Web Share API met klembord-fallback voor
  /// browsers zonder ondersteuning (voornamelijk desktop). Tekst komt uit
  /// club_instellingen (door de beheerder instelbaar), matcht de app se
  /// _nodigVriendUit()/_uitnodigenKaart in leden_screen.dart.
  document.getElementById('uitnodig-knop').addEventListener('click', async () => {
    let tekst = 'Kom pickleballen bij Almere Pickleball!';
    try {
      const rows = await haalOp('club_instellingen', { select: 'uitnodig_tekst', id: 'eq.true' });
      if (rows[0] && rows[0].uitnodig_tekst) tekst = rows[0].uitnodig_tekst;
    } catch (e) { /* val terug op de standaardtekst hierboven */ }
    if (navigator.share) {
      try { await navigator.share({ title: 'Almere Pickleball', text: tekst }); }
      catch (e) { /* gebruiker annuleerde het deelvenster — geen actie nodig */ }
      return;
    }
    try {
      await navigator.clipboard.writeText(tekst);
      toonToast('Tekst gekopieerd naar klembord');
    } catch (e) {
      toonToast('Kon de tekst niet kopiëren.');
    }
  });
</script>
</body>
</html>
