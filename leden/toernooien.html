<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8" />
<script>(function(){try{var t=localStorage.getItem('pb_thema');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Toernooien — Almere Pickleball</title>
<meta name="robots" content="noindex" />
<link rel="icon" type="image/png" href="/assets/img/logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/assets/leden.css" />
<style>
  .landelijk-badge {
    display: inline-block; padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: 700;
    background: rgba(184,134,10,0.12); color: var(--gold-deep); flex-shrink: 0;
  }
  .naam-rij { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
  .mail-knop { background: var(--navy); color: #fff; }
  .link-knop { background: transparent; color: var(--navy); border: 1.5px solid var(--navy); }
  .stat-rij { display: flex; gap: 10px; margin-top: 14px; }
  .stat-tegel {
    flex: 1; background: var(--paper); border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 12px; text-align: center; cursor: default; font-family: inherit; color: inherit;
  }
  .stat-tegel.klikbaar { cursor: pointer; }
  .stat-tegel .waarde { font-size: 20px; font-weight: 700; color: var(--navy); }
  @media (prefers-color-scheme: dark) { .stat-tegel .waarde { color: #8ab6ec; } }
  .stat-tegel .label { font-size: 11.5px; color: var(--ink-muted); margin-top: 2px; }
  .rank-regel { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
  .rank-regel:first-of-type { border-top: none; padding-top: 0; }
  /* Binnen een popup (bijv. deelnemerslijst) wel als losse kaartjes i.p.v.
     een vlakke lijst — de hoofdpagina-ranglijst blijft ongewijzigd. */
  .popup-kaart .rank-regel {
    border-top: none; background: var(--paper); border: 1px solid var(--line);
    border-radius: 12px; padding: 10px 12px; margin-bottom: 6px;
  }
  .popup-kaart .rank-regel:last-child { margin-bottom: 0; }
  .rank-regel .positie { width: 20px; text-align: center; font-weight: 700; color: var(--ink-muted); font-size: 13px; }
  .rank-regel .avatar {
    width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0;
    background: linear-gradient(135deg, var(--navy), var(--navy-deep)); color: #fff;
    display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px;
  }
  .rank-regel .naam { flex: 1; font-weight: 600; font-size: 14px; }
  .rank-regel .rating { font-weight: 700; font-size: 14px; color: var(--gold-deep); }
  @media (prefers-color-scheme: dark) { .rank-regel .rating { color: var(--gold); } }
  .training-kop { display: flex; align-items: center; gap: 8px; }
  .training-kop .dag { font-weight: 700; font-size: 15px; }
  .training-locatie { font-size: 12.5px; color: var(--ink-muted); margin-top: 2px; }
  .omschrijving { font-size: 13px; color: var(--ink-muted); line-height: 1.5; margin: 6px 0 0; }
  .deelnemers-knop {
    display: flex; align-items: center; gap: 6px; margin-top: 10px; padding: 0;
    background: none; border: none; color: var(--navy); font-family: inherit; font-size: 13px;
    font-weight: 700; cursor: pointer;
  }
  @media (prefers-color-scheme: dark) { .deelnemers-knop { color: #8ab6ec; } }

  /* Landelijk: foto 50/50 over de kaart als er een flyer is.
     .naam/.details hadden hier geen basisstijl (die bestond alleen scoped
     onder .toernooi-regel voor Almere) — de titel en icoon-regels renderden
     daardoor ongestyled, vandaar dat dit niet aansloot bij de kaart-look
     van de app (zie lib/widgets/national_tournament_card_swap/ — bold
     titel, kleine grijze icoon-regels, een kosten-"chip" i.p.v. platte
     tekst). Hieronder dezelfde typografie/kleuren als daar. */
  .landelijk-kaart {
    display: flex; border-top: 1px solid var(--line); padding: 12px 0; gap: 14px; align-items: stretch;
  }
  .landelijk-kaart:first-of-type { border-top: none; padding-top: 0; }
  .landelijk-kaart.met-foto { padding: 12px 0; }
  .landelijk-kaart .foto-helft {
    flex: 0 0 50%; max-width: 50%; border-radius: 10px; overflow: hidden; background: var(--paper); min-height: 120px;
  }
  .landelijk-kaart .foto-helft img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .landelijk-kaart .tekst-helft { flex: 1; min-width: 0; }
  .landelijk-kaart.zonder-foto .tekst-helft { flex: 1 1 100%; }
  .landelijk-kaart .naam { font-weight: 700; font-size: 15px; line-height: 1.3; }
  .landelijk-kaart .details {
    display: flex; align-items: center; color: var(--ink-muted); font-size: 12.5px; margin-top: 4px;
  }
  .landelijk-kaart .actie { margin-top: 10px; }
  .kosten-chip {
    display: inline-block; margin-top: 8px; padding: 3px 10px; border-radius: 999px;
    font-size: 12px; font-weight: 700; background: rgba(36,87,255,0.1); color: var(--navy);
  }
  @media (prefers-color-scheme: dark) { .kosten-chip { color: #8ab6ec; } }

  .popup-overlay {
    position: fixed; inset: 0; background: rgba(4,27,51,0.45); z-index: 100;
    display: flex; align-items: flex-end; justify-content: center;
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  }
  .popup-kaart {
    background: var(--glas-oppervlak); -webkit-backdrop-filter: blur(24px) saturate(160%);
    backdrop-filter: blur(24px) saturate(160%); border: 1px solid var(--glas-rand); border-bottom: none;
    border-radius: 22px 22px 0 0; width: 100%; max-width: 480px;
    max-height: 75vh; overflow-y: auto; padding: 20px;
    box-shadow: 0 -12px 40px rgba(4,27,51,0.3), inset 0 1px 0 var(--glas-hooglicht-boven);
  }
  @media (min-width: 560px) {
    .popup-overlay { align-items: center; }
    .popup-kaart {
      border-radius: 22px; border-bottom: 1px solid var(--glas-rand);
      box-shadow: 0 20px 50px rgba(4,27,51,0.35), inset 0 1px 0 var(--glas-hooglicht-boven), inset 0 -1px 0 var(--glas-hooglicht-onder);
    }
  }
  .popup-kop { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .popup-kop h3 { margin: 0; font-size: 16px; }
  .popup-sluit { background: none; border: none; font-size: 20px; cursor: pointer; color: var(--ink-muted); }
  .popup-leeg { text-align: center; color: var(--ink-muted); padding: 30px 0; }
  .i-inline { width: 14px; height: 14px; vertical-align: -2px; margin-right: 3px; flex-shrink: 0; }

  /* Inschrijf-ticket na aanmelding voor een clubtoernooi — zelfde lay-out
     (titel+badges, perforatielijn, 2-koloms gegevensraster, QR-sectie) als
     het baanverhuur-ticket in baan-huren/bedankt.html, met Lucide-iconen
     (zelfde glyphs als de lucide_icons_flutter-versie in de app). Geen
     Download-PDF/Wallet-knoppen hier — die bestaan ook niet in de app se
     ticket, om beide platforms exact gelijk te houden. */
  .ticket-overlay-wrap { width: 100%; max-width: 380px; }
  .ticket-kaart {
    position: relative; border-radius: 28px; background: var(--card);
    border: 2px solid var(--paper); box-shadow: 0 20px 50px rgba(4,27,51,0.3);
  }
  .ticket-kop { padding: 22px 22px 14px; text-align: center; }
  .ticket-kop svg.trofee { width: 26px; height: 26px; color: var(--navy); margin-bottom: 6px; }
  .ticket-kop .titel {
    font-family: 'Unbounded', sans-serif; font-size: 19px; font-weight: 800; color: var(--ink); margin: 0 0 10px; line-height: 1.25;
  }
  .ticket-badges { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
  .ticket-badge {
    font-size: 9.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;
    padding: 5px 11px; border-radius: 999px;
  }
  .ticket-badge.type { background: var(--gold); color: #4a3300; }
  .ticket-badge.klasse { background: rgba(36,87,255,0.1); color: var(--navy); }
  @media (prefers-color-scheme: dark) { .ticket-badge.klasse { color: #8ab6ec; } }
  .ticket-badge.status-bevestigd { background: rgba(36,87,255,0.1); color: var(--navy); }
  @media (prefers-color-scheme: dark) { .ticket-badge.status-bevestigd { color: #8ab6ec; } }
  .ticket-body { padding: 4px 22px 2px; }
  .ticket-grid { display: grid; grid-template-columns: 1fr 1fr; row-gap: 14px; column-gap: 14px; }
  .ticket-veld { min-width: 0; display: flex; align-items: flex-start; gap: 6px; }
  .ticket-veld svg { width: 15px; height: 15px; color: var(--ink-muted); flex-shrink: 0; margin-top: 1px; }
  .ticket-veld .label {
    font-size: 10px; color: var(--ink-muted); display: block; text-transform: uppercase; letter-spacing: 0.04em;
  }
  .ticket-veld .waarde {
    font-size: 12.5px; font-weight: 600; color: var(--ink); display: block; margin-top: 3px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .ticket-partner { padding: 10px 22px 0; font-size: 12.5px; color: var(--ink-muted); }
  .ticket-perforatie { position: relative; height: 20px; margin-top: 14px; }
  .ticket-perforatie .notch {
    position: absolute; top: 50%; transform: translateY(-50%); width: 26px; height: 26px;
    border-radius: 50%; background: var(--paper); z-index: 2;
  }
  .ticket-perforatie .notch.links { left: -13px; }
  .ticket-perforatie .notch.rechts { right: -13px; }
  .ticket-perforatie .lijn {
    position: absolute; left: 20px; right: 20px; top: 50%; border-top: 1.5px dashed var(--line);
  }
  .ticket-qr-sectie { text-align: center; padding: 4px 22px 22px; }
  .ticket-referentie { font-size: 11.5px; color: var(--ink-muted); margin: 10px 0; }
  .ticket-referentie code {
    font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-weight: 700; color: var(--navy);
  }
  @media (prefers-color-scheme: dark) { .ticket-referentie code { color: #8ab6ec; } }
  .ticket-qr-sectie img { margin: 0 auto; display: block; border-radius: 10px; }
  .ticket-knop {
    display: flex; align-items: center; justify-content: center; gap: 6px; width: 100%;
    padding: 11px; border-radius: 999px; font-size: 13px; font-weight: 700; cursor: pointer;
    border: none; font-family: inherit; margin-top: 16px; transition: filter 0.15s ease;
  }
  .ticket-knop:hover { filter: brightness(0.96); }
  .ticket-knop.deel { background: var(--navy); color: #fff; }
  .ticket-knop svg { width: 16px; height: 16px; flex-shrink: 0; }
  .ticket-sluit-knop {
    display: block; width: 100%; text-align: center; margin-top: 10px; padding: 6px;
    background: none; border: none; font-family: inherit; font-size: 13px; color: var(--ink-muted); cursor: pointer;
  }
  .ticket-deel-knoppen { display: flex; gap: 8px; margin-top: 10px; }
  .ticket-deel-knop {
    flex: 1; display: flex; align-items: center; justify-content: center;
    padding: 10px; border-radius: 999px; text-decoration: none; font-size: 13px; font-weight: 700;
    border: 1.5px solid var(--line); color: var(--ink);
  }
</style>
</head>
<body>
<header>
  <img src="/assets/img/logo.png" alt="" width="40" height="39" style="border-radius: 8px;" />
  <div style="flex: 1; min-width: 0;">
    <div class="merk"></div>
    <h1 data-i18n="navToernooien">Toernooien</h1>
  </div>
  <div id="account-plek"></div>
</header>
<main>
  <div class="kaart">
    <div class="pil-toggle">
      <button id="pil-almere" class="actief">Almere</button>
      <button id="pil-landelijk">Landelijk</button>
      <button id="pil-training">Training</button>
    </div>
    <div id="almere-inhoud" class="laden">Laden…</div>
    <div id="landelijk-banner" class="swipe-banner" style="display:none">
      <span class="helft"><span class="pijl">←</span> <span>Niet <strong>geïnteresseerd</strong></span></span>
      <span class="scheiding"></span>
      <span class="helft rechts"><span><strong>Inschrijven</strong>/bekijken</span> <span class="pijl">→</span></span>
    </div>
    <div id="landelijk-inhoud" class="laden" style="display:none">Laden…</div>
    <div id="training-inhoud" class="laden" style="display:none">Laden…</div>
  </div>
</main>
<div id="nav-plek"></div>
<script src="/assets/supabase.js"></script>
<script src="/assets/theme.js"></script>
<script src="/assets/i18n.js"></script>
<script src="/assets/nav.js"></script>
<script src="/assets/swipe-deck.js"></script>
<script>
  const sessie = vereisSessie();
  initNav('toernooien');

  document.getElementById('pil-almere').addEventListener('click', () => wisselWeergave('almere'));
  document.getElementById('pil-landelijk').addEventListener('click', () => wisselWeergave('landelijk'));
  document.getElementById('pil-training').addEventListener('click', () => wisselWeergave('training'));

  function wisselWeergave(w) {
    document.getElementById('pil-almere').classList.toggle('actief', w === 'almere');
    document.getElementById('pil-landelijk').classList.toggle('actief', w === 'landelijk');
    document.getElementById('pil-training').classList.toggle('actief', w === 'training');
    document.getElementById('almere-inhoud').style.display = w === 'almere' ? '' : 'none';
    document.getElementById('landelijk-banner').style.display = w === 'landelijk' ? '' : 'none';
    document.getElementById('landelijk-inhoud').style.display = w === 'landelijk' ? '' : 'none';
    document.getElementById('training-inhoud').style.display = w === 'training' ? '' : 'none';
    if (w === 'landelijk' && !window.__landelijkGeladen) { window.__landelijkGeladen = true; laadLandelijk(); }
    if (w === 'training' && !window.__trainingGeladen) { window.__trainingGeladen = true; laadTraining(); }
  }

  // --- Almere-toernooien: eigen inschrijving + betaling ---

  const klasseLabels = { open: 'Open', mix: 'Mix', vrouwen: 'Vrouwen', mannen: 'Mannen' };
  const niveauLabels = { open: 'Alle niveaus', beginner: 'Beginner', gevorderd: 'Gevorderd', competitie: 'Competitie' };
  let alleLeden = null;

  function initialen(naam) {
    return naam.split(' ').filter(Boolean).slice(0, 2).map(n => n[0].toUpperCase()).join('');
  }

  function toonLedenPopup(titel, leden, max) {
    const bestaand = document.getElementById('leden-popup-overlay');
    if (bestaand) bestaand.remove();
    const overlay = document.createElement('div');
    overlay.className = 'popup-overlay';
    overlay.id = 'leden-popup-overlay';
    overlay.innerHTML =
      '<div class="popup-kaart">' +
      '<div class="popup-kop"><h3>' + escapeHtml(titel) + ' — ' + leden.length + (max != null ? '/' + max : '') + '</h3>' +
      '<button type="button" class="popup-sluit" aria-label="Sluiten">✕</button></div>' +
      (leden.length
        ? leden.map(l => '<div class="rank-regel"><span class="avatar">' + escapeHtml(initialen(l.naam)) + '</span><span class="naam">' + escapeHtml(l.naam) + '</span></div>').join('')
        : '<div class="popup-leeg">Nog niemand aangemeld.</div>') +
      '</div>';
    overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });
    overlay.querySelector('.popup-sluit').addEventListener('click', () => overlay.remove());
    document.body.appendChild(overlay);
  }

  function ticketVeld(icoonSvg, label, waarde) {
    return '<div class="ticket-veld">' + icoonSvg +
      '<div><span class="label">' + label + '</span><span class="waarde">' + escapeHtml(waarde) + '</span></div></div>';
  }

  const iTrofee = '<svg class="trofee" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14.66V17a1 1 0 0 1-1 1 2 2 0 0 0-2 2v2"/><path d="M14 14.66V17a1 1 0 0 0 1 1 2 2 0 0 1 2 2v2"/><path d="M17.916 10H19.5A2.5 2.5 0 0 0 22 7.5V5a1 1 0 0 0-1-1h-3"/><path d="M4 22h16"/><path d="M6 9a6 6 0 0 0 12 0V3a1 1 0 0 0-1-1H7a1 1 0 0 0-1 1z"/><path d="M6.084 10H4.5A2.5 2.5 0 0 1 2 7.5V5a1 1 0 0 1 1-1h3"/></svg>';
  const iKalender = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v3"/><path d="M16 2v3"/><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/></svg>';
  const iLocatie = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/></svg>';
  const iGebruikers = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><path d="M16 3.128a4 4 0 0 1 0 7.744"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><circle cx="9" cy="7" r="4"/></svg>';
  const iEuro = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10h12"/><path d="M4 14h9"/><path d="M19 6a7.7 7.7 0 0 0-5.2-2A7.9 7.9 0 0 0 6 12c0 4.4 3.5 8 7.8 8 2 0 3.8-.8 5.2-2"/></svg>';
  const iDeel = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" x2="15.42" y1="13.51" y2="17.49"/><line x1="15.41" x2="8.59" y1="6.51" y2="10.49"/></svg>';

  function toonToernooiTicket(toernooi, partnerNaam) {
    const bestaand = document.getElementById('ticket-overlay');
    if (bestaand) bestaand.remove();
    const datum = new Date(toernooi.datum);
    const datumTekst = datum.toLocaleDateString('nl-NL', { day: 'numeric', month: 'long', year: 'numeric' });
    const referentie = 'TN-' + datum.getFullYear() + '-' + toernooi.id.replace(/-/g, '').slice(0, 6).toUpperCase();
    const qrData = encodeURIComponent('Almere Pickleball · ' + toernooi.naam + ' · ' + toernooi.datum + ' · ' + referentie);
    const qrUrl = 'https://api.qrserver.com/v1/create-qr-code/?size=200x200&margin=8&data=' + qrData;
    const deelTekst = 'Ik doe mee aan ' + toernooi.naam + ' (' + datumTekst + ')' +
      (partnerNaam ? ' samen met ' + partnerNaam : '') + '! 🏓';
    const niveauLabel = niveauLabels[toernooi.niveau] || toernooi.niveau;
    const inschrijfgeldTekst = toernooi.inschrijfgeld > 0 ? '€' + Number(toernooi.inschrijfgeld).toFixed(2) : 'Gratis';

    const overlay = document.createElement('div');
    overlay.className = 'popup-overlay';
    overlay.id = 'ticket-overlay';
    overlay.innerHTML =
      '<div class="ticket-overlay-wrap"><div class="ticket-kaart">' +
      '<div class="ticket-kop">' + iTrofee +
      '<div class="titel">' + escapeHtml(toernooi.naam) + '</div>' +
      '<div class="ticket-badges">' +
      '<span class="ticket-badge type">Toernooi</span>' +
      '<span class="ticket-badge klasse">' + escapeHtml(klasseLabels[toernooi.klasse] || toernooi.klasse) + '</span>' +
      '<span class="ticket-badge status-bevestigd">Bevestigd</span>' +
      '</div></div>' +
      '<div class="ticket-body"><div class="ticket-grid">' +
      ticketVeld(iKalender, 'Datum', datumTekst) +
      ticketVeld(iLocatie, 'Locatie', toernooi.locatie || '—') +
      ticketVeld(iGebruikers, 'Niveau', niveauLabel) +
      ticketVeld(iEuro, 'Inschrijfgeld', inschrijfgeldTekst) +
      '</div></div>' +
      (partnerNaam ? '<div class="ticket-partner">Partner: ' + escapeHtml(partnerNaam) + '</div>' : '') +
      '<div class="ticket-perforatie"><span class="notch links"></span><span class="notch rechts"></span><span class="lijn"></span></div>' +
      '<div class="ticket-qr-sectie">' +
      '<img src="' + qrUrl + '" width="150" height="150" alt="QR-code van je inschrijving" />' +
      '<div class="ticket-referentie">Referentie <code>' + referentie + '</code></div>' +
      '<button type="button" class="ticket-knop deel" id="ticket-deel-knop">' + iDeel + 'Deel inschrijving</button>' +
      '<div id="ticket-deel-fallback" class="ticket-deel-knoppen" style="display:none">' +
      '<a class="ticket-deel-knop" href="sms:?body=' + encodeURIComponent(deelTekst) + '">Via sms</a>' +
      '<a class="ticket-deel-knop" href="https://wa.me/?text=' + encodeURIComponent(deelTekst) + '" target="_blank" rel="noopener">Via WhatsApp</a>' +
      '</div>' +
      '<button type="button" class="ticket-sluit-knop" id="ticket-sluit-knop">Sluiten</button>' +
      '</div></div></div>';
    overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });
    document.body.appendChild(overlay);

    document.getElementById('ticket-sluit-knop').addEventListener('click', () => overlay.remove());
    document.getElementById('ticket-deel-knop').addEventListener('click', async () => {
      if (navigator.share) {
        try { await navigator.share({ title: toernooi.naam, text: deelTekst }); }
        catch (e) { /* gebruiker annuleerde het deelvenster — negeren */ }
      } else {
        document.getElementById('ticket-deel-fallback').style.display = '';
      }
    });
  }

  async function toonToernooiDeelnemers(toernooi) {
    const teams = window.__alleTeams.filter(team => team.toernooi_id === toernooi.id);
    const ids = new Set();
    teams.forEach(tm => { if (tm.speler1_id) ids.add(tm.speler1_id); if (tm.speler2_id) ids.add(tm.speler2_id); });
    let leden = [];
    if (ids.size) {
      leden = await haalOp('leden', { select: 'naam', id: 'in.(' + [...ids].join(',') + ')' });
    }
    toonLedenPopup(toernooi.naam, leden, toernooi.max_deelnemers);
  }

  async function laadToernooien() {
    const el = document.getElementById('almere-inhoud');
    const vandaag = new Date().toISOString().substring(0, 10);
    const toernooien = await haalOp('toernooien', {
      select: 'id,naam,datum,omschrijving,klasse,niveau,inschrijfwijze,inschrijfgeld,inschrijving_open,max_deelnemers,locatie',
      datum: 'gte.' + vandaag, order: 'datum.asc',
    });
    if (!toernooien.length) { el.textContent = 'Geen aankomende toernooien.'; return; }

    const ids = toernooien.map(t => t.id).join(',');
    const alleTeams = await haalOp('toernooi_teams', {
      select: 'id,toernooi_id,speler1_id,speler2_id',
      toernooi_id: 'in.(' + ids + ')',
    });
    window.__alleTeams = alleTeams;

    el.innerHTML = toernooien.map((t, i) => {
      const teams = alleTeams.filter(team => team.toernooi_id === t.id);
      const mijnTeam = teams.find(team => team.speler1_id === sessie.user_id || team.speler2_id === sessie.user_id);
      const spelers = teams.reduce((som, tm) => som + (tm.speler2_id ? 2 : 1), 0);
      const details = klasseLabels[t.klasse] + ' · ' + niveauLabels[t.niveau] +
        (t.inschrijfgeld > 0 ? ' · €' + Number(t.inschrijfgeld).toFixed(2) + ' inschrijfgeld' : '');
      let actie;
      if (mijnTeam) {
        actie = '<button class="knop afmelden" data-actie="uitschrijven" data-team="' + mijnTeam.id + '" data-index="' + i + '">Uitschrijven</button>';
      } else if (!t.inschrijving_open) {
        actie = '<button class="knop vol" disabled>Inschrijving gesloten</button>';
      } else if (t.inschrijfwijze === 'paar') {
        actie = '<select data-partner-voor="' + i + '"><option value="">Kies je partner…</option></select>' +
          '<button class="knop aanmelden" data-actie="inschrijven-paar" data-index="' + i + '">Inschrijven</button>';
      } else {
        actie = '<button class="knop aanmelden" data-actie="inschrijven" data-index="' + i + '">Inschrijven</button>';
      }
      const omschrijvingHtml = t.omschrijving ? '<p class="omschrijving">' + escapeHtml(t.omschrijving) + '</p>' : '';
      const locatieHtml = t.locatie ? '<div class="locatie-regel"><svg class="i-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-6.5 7-11a7 7 0 1 0-14 0c0 4.5 7 11 7 11z"/><circle cx="12" cy="10" r="2.4"/></svg>' + escapeHtml(t.locatie) + '</div>' : '';
      return '<div class="toernooi-regel"><div class="naam">' + escapeHtml(t.naam) + '</div>' + locatieHtml +
        '<div class="details">' + new Date(t.datum).toLocaleDateString('nl-NL', { day: 'numeric', month: 'long', year: 'numeric' }) +
        ' · ' + details + '</div>' + omschrijvingHtml +
        '<button type="button" class="deelnemers-knop" data-deelnemers-index="' + i + '"><svg class="i-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.4"/><path d="M3 20c0-3 3-5 6-5s6 2 6 5"/><path d="M15 15.5c2.2.3 4 2 4 4.5"/></svg>' + spelers + '/' + t.max_deelnemers + ' deelnemers →</button>' +
        '<div class="actie">' + actie + '</div></div>';
    }).join('') + '<div id="almere-melding"></div>';

    window.__toernooien = toernooien;

    const partnerSelects = el.querySelectorAll('[data-partner-voor]');
    if (partnerSelects.length) {
      if (!alleLeden) {
        alleLeden = await haalOp('leden', { select: 'id,naam', actief: 'eq.true', order: 'naam.asc' });
      }
      partnerSelects.forEach(sel => {
        alleLeden.filter(l => l.id !== sessie.user_id).forEach(l => {
          const opt = document.createElement('option');
          opt.value = l.id; opt.textContent = l.naam;
          sel.appendChild(opt);
        });
      });
    }

    el.querySelectorAll('[data-deelnemers-index]').forEach(btn => btn.addEventListener('click', () => {
      toonToernooiDeelnemers(window.__toernooien[Number(btn.dataset.deelnemersIndex)]);
    }));

    el.querySelectorAll('[data-actie]').forEach(btn => btn.addEventListener('click', () => {
      const t = window.__toernooien[Number(btn.dataset.index)];
      if (btn.dataset.actie === 'uitschrijven') uitschrijvenToernooi(btn.dataset.team, btn);
      else if (btn.dataset.actie === 'inschrijven-paar') {
        const sel = el.querySelector('[data-partner-voor="' + btn.dataset.index + '"]');
        if (!sel.value) { toonToernooiMelding('Kies eerst een partner.', true); return; }
        inschrijvenToernooi(t, sel.value, btn);
      } else {
        inschrijvenToernooi(t, null, btn);
      }
    }));
  }

  function toonToernooiMelding(tekst, isFout) {
    const el = document.getElementById('almere-melding');
    if (el) el.innerHTML = '<div class="melding ' + (isFout ? 'fout' : 'ok') + '">' + tekst + '</div>';
  }

  async function inschrijvenToernooi(toernooi, partnerId, btn) {
    btn.disabled = true;
    btn.textContent = 'Bezig…';
    try {
      const team = await voegToe('toernooi_teams', {
        toernooi_id: toernooi.id,
        speler1_id: sessie.user_id,
        ...(partnerId ? { speler2_id: partnerId } : {}),
      });
      const partnerNaam = partnerId && alleLeden ? (alleLeden.find(l => l.id === partnerId) || {}).naam : null;
      await laadToernooien();
      toonToernooiTicket(toernooi, partnerNaam);
      if (toernooi.inschrijfgeld > 0) {
        try {
          const res = await functieAanroepen('create-mollie-payment', { type: 'toernooi', toernooi_team_id: team.id });
          if (res.checkoutUrl) {
            toonToernooiMelding('Ingeschreven! Je wordt doorgestuurd naar de betaalpagina…', false);
            window.location.href = res.checkoutUrl;
            return;
          }
        } catch (betaalFout) {
          toonToernooiMelding('Ingeschreven, maar de betaling kon niet gestart worden: ' + betaalFout.message, true);
          return;
        }
      }
      toonToernooiMelding('Je bent ingeschreven.', false);
    } catch (e) {
      toonToernooiMelding(e.message, true);
      btn.disabled = false;
      btn.textContent = 'Inschrijven';
    }
  }

  async function uitschrijvenToernooi(teamId, btn) {
    btn.disabled = true;
    btn.textContent = 'Bezig…';
    try {
      await verwijder('toernooi_teams', { id: 'eq.' + teamId });
      await laadToernooien();
      toonToernooiMelding('Je bent uitgeschreven.', false);
    } catch (e) {
      toonToernooiMelding(e.message, true);
      btn.disabled = false;
      btn.textContent = 'Uitschrijven';
    }
  }

  // --- Landelijke toernooien: puur informatief, inschrijven via mail/externe link ---

  const urlRegex = /https?:\/\/[^\s)]+/;
  const domeinRegex = /\b[a-zA-Z0-9-]+\.(?:nl|com|org|net)(?:\/[^\s)]*)?/;

  function externeLink(tekst) {
    if (!tekst) return null;
    const urlMatch = tekst.match(urlRegex);
    if (urlMatch) return urlMatch[0];
    const domeinMatch = tekst.match(domeinRegex);
    if (domeinMatch) return 'https://' + domeinMatch[0];
    return null;
  }

  async function inschrijvenPerMail(naam, email) {
    const lid = await haalOp('leden', { select: 'naam,email,telefoon,niveau', id: 'eq.' + sessie.user_id });
    const l = lid[0] || {};
    const regels = ['Naam: ' + (l.naam || ''), 'E-mail: ' + (l.email || '')];
    if (l.niveau) regels.push('Niveau: ' + (niveauLabels[l.niveau] || l.niveau));
    if (l.telefoon) regels.push('Mobiel: ' + l.telefoon);
    const params = new URLSearchParams({ subject: 'Inschrijving ' + naam, body: regels.join('\n') });
    window.location.href = 'mailto:' + email + '?' + params.toString();
  }

  // "Niet geïnteresseerd" (swipe naar links) is puur een lokale voorkeur —
  // er is geen serverkant-concept van interesse voor landelijke toernooien,
  // dus onthouden we genegeerde toernooien per toestel in localStorage.
  function landelijkSleutel(t) { return t.naam + '|' + t.datum_start; }

  async function laadLandelijk() {
    const el = document.getElementById('landelijk-inhoud');
    const vandaag = new Date().toISOString().substring(0, 10);
    let toernooien = await haalOp('landelijke_toernooien', {
      select: '*', datum_start: 'gte.' + vandaag, order: 'volgorde.asc',
    });
    const genegeerd = JSON.parse(localStorage.getItem('pb_landelijk_genegeerd') || '[]');
    toernooien = toernooien.filter(t => !genegeerd.includes(landelijkSleutel(t)));
    if (!toernooien.length) { el.textContent = 'Geen aankomende landelijke toernooien.'; return; }

    window.__landelijk = toernooien;
    const kaarten = toernooien.map((t, i) => {
      const start = new Date(t.datum_start);
      const datumTekst = t.datum_eind
        ? start.getDate() + '–' + new Date(t.datum_eind).toLocaleDateString('nl-NL', { day: 'numeric', month: 'long', year: 'numeric' })
        : start.toLocaleDateString('nl-NL', { day: 'numeric', month: 'long', year: 'numeric' });
      const email = t.email && t.email.trim() ? t.email.trim() : null;
      const link = externeLink(t.aanmelden_via);
      const detailRegels = [
        '<div class="details"><svg class="i-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="16" y1="2" x2="16" y2="6"/></svg>' + datumTekst + (t.tijden ? ' · ' + escapeHtml(t.tijden) : '') + '</div>',
        '<div class="details"><svg class="i-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-7.58 7-12A7 7 0 0 0 5 9c0 4.42 7 12 7 12Z"/><circle cx="12" cy="9" r="2.5"/></svg>' + escapeHtml(t.plaats) + (t.adres ? ' · ' + escapeHtml(t.adres) : '') + '</div>',
      ];
      if (t.toernooi_type) detailRegels.push('<div class="details">' + escapeHtml(t.toernooi_type) + '</div>');
      if (t.sluiting_inschrijving) detailRegels.push('<div class="details">Sluiting inschrijving: ' + escapeHtml(t.sluiting_inschrijving) + '</div>');
      const kostenChip = t.kosten ? '<span class="kosten-chip">' + escapeHtml(t.kosten) + '</span>' : '';
      let actie = '';
      if (email || link) {
        actie = '<div class="actie">' +
          (email ? '<button class="knop mail-knop" data-mail-index="' + i + '">Inschrijven</button>' : '') +
          (link ? '<a class="knop link-knop" href="' + escapeHtml(link) + '" target="_blank" rel="noopener" style="text-decoration:none;text-align:center">Bekijk</a>' : '') +
          '</div>';
      }
      const tekstHelft = '<div class="tekst-helft">' +
        '<div class="naam-rij"><span class="naam">' + escapeHtml(t.naam) + '</span>' +
        '<span class="landelijk-badge">Landelijk</span></div>' +
        detailRegels.join('') + kostenChip + actie + '</div>';
      if (t.flyer_url) {
        return '<div class="landelijk-kaart met-foto" style="border-top:none">' +
          '<div class="foto-helft"><img src="' + escapeHtml(t.flyer_url) + '" alt="" /></div>' +
          tekstHelft + '</div>';
      }
      return '<div class="landelijk-kaart zonder-foto" style="border-top:none">' + tekstHelft + '</div>';
    });

    initSwipeDeck(el, kaarten, {
      leegTekst: 'Geen aankomende landelijke toernooien.',
      onRender: (kaartEl) => {
        kaartEl.querySelectorAll('[data-mail-index]').forEach(btn => btn.addEventListener('click', () => {
          const t = window.__landelijk[Number(btn.dataset.mailIndex)];
          inschrijvenPerMail(t.naam, t.email.trim());
        }));
      },
      badgeRechts: 'Inschrijven/bekijken', badgeLinks: 'Niet geïnteresseerd',
      onSwipeRechts: () => {
        const kaartEl = el.querySelector('.swipe-kaart');
        const btn = kaartEl && (kaartEl.querySelector('[data-mail-index]') || kaartEl.querySelector('.link-knop'));
        if (btn) btn.click();
      },
      onSwipeLinks: (index) => {
        const t = window.__landelijk[index];
        const lijst = JSON.parse(localStorage.getItem('pb_landelijk_genegeerd') || '[]');
        const sleutel = landelijkSleutel(t);
        if (!lijst.includes(sleutel)) lijst.push(sleutel);
        localStorage.setItem('pb_landelijk_genegeerd', JSON.stringify(lijst));
        laadLandelijk();
      },
    });
  }

  // --- Training: eerstvolgende trainingsavond + ranglijst-top-10 ---

  const dagnamen = ['maandag', 'dinsdag', 'woensdag', 'donderdag', 'vrijdag', 'zaterdag', 'zondag'];

  async function volgendeTrainingssessie() {
    const speeldagen = await haalOp('speeldagen', {
      select: 'id,weekdag,start_tijd,eind_tijd,locatie,aantal_banen', actief: 'eq.true',
    });
    if (!speeldagen.length) return null;
    const nu = new Date();
    for (let dag = new Date(nu.getFullYear(), nu.getMonth(), nu.getDate());
         dag < new Date(nu.getTime() + 60 * 24 * 3600 * 1000);
         dag.setDate(dag.getDate() + 1)) {
      if (dag.getMonth() === 6) continue;
      const isodow = dag.getDay() === 0 ? 7 : dag.getDay();
      for (const sd of speeldagen) {
        if (sd.weekdag !== isodow) continue;
        const [uur, min] = sd.start_tijd.split(':').map(Number);
        const start = new Date(dag.getFullYear(), dag.getMonth(), dag.getDate(), uur, min);
        if (start < nu) continue;
        const reserveringen = await haalOp('reserveringen', {
          select: 'id', speeldag_id: 'eq.' + sd.id, start_tijd: 'eq.' + start.toISOString(),
        });
        const nAanmeldingen = reserveringen.length;
        const banenNodig = Math.min(Math.max(Math.ceil(nAanmeldingen / 4), 1), 8);
        return {
          speeldagId: sd.id, start, locatie: sd.locatie,
          aanmeldingen: nAanmeldingen,
          banen: Math.min(banenNodig, sd.aantal_banen),
        };
      }
    }
    return null;
  }

  async function laadTraining() {
    const el = document.getElementById('training-inhoud');
    const [sessieInfo, ranking] = await Promise.all([
      volgendeTrainingssessie(),
      haalOp('leden', { select: 'naam,rating', actief: 'eq.true', order: 'rating.desc', limit: '10' }),
    ]);

    let sessieHtml = '<p class="details">Geen speelavonden gevonden binnen de komende weken.</p>';
    if (sessieInfo) {
      sessieHtml =
        '<div class="training-kop"><span class="dag">' +
        dagnamen[sessieInfo.start.getDay() === 0 ? 6 : sessieInfo.start.getDay() - 1] + ' ' +
        sessieInfo.start.toLocaleDateString('nl-NL', { day: 'numeric', month: 'long' }) + '</span></div>' +
        '<div class="training-locatie">' + sessieInfo.start.toTimeString().slice(0, 5) + ' · ' + escapeHtml(sessieInfo.locatie) + '</div>' +
        '<div class="stat-rij">' +
        '<button type="button" class="stat-tegel klikbaar" id="training-aanmeldingen-tegel"><div class="waarde">' + sessieInfo.aanmeldingen + '</div><div class="label">Aanmeldingen →</div></button>' +
        '<div class="stat-tegel"><div class="waarde">' + sessieInfo.banen + '</div><div class="label">Banen ingezet</div></div>' +
        '</div>' +
        '<a class="knop aanmelden" href="/leden/reserveren.html" style="display:block;text-align:center;margin-top:14px;text-decoration:none">Bekijk speelavond →</a>';
    }

    const rankingHtml = ranking.length ? ranking.map((l, i) =>
      '<div class="rank-regel"><span class="positie">' + (i + 1) + '</span>' +
      '<span class="avatar">' + escapeHtml(initialen(l.naam)) + '</span>' +
      '<span class="naam">' + escapeHtml(l.naam) + '</span>' +
      '<span class="rating">' + (l.rating != null ? Number(l.rating).toFixed(2) : '–') + '</span></div>'
    ).join('') : '';

    el.innerHTML =
      '<div class="toernooi-regel">' + sessieHtml + '</div>' +
      '<div style="margin-top:20px">' +
      '<h2 style="margin-bottom:2px">Ranglijst</h2>' +
      '<p class="details" style="margin-bottom:10px">Top 10 op basis van rating. Volledige ranglijst op de Leden-pagina.</p>' +
      (rankingHtml || '<p class="details">Nog geen ranglijst beschikbaar.</p>') +
      '</div>';

    const aanmeldingenTegel = document.getElementById('training-aanmeldingen-tegel');
    if (aanmeldingenTegel && sessieInfo) {
      aanmeldingenTegel.addEventListener('click', () => toonTrainingAanmeldingen(sessieInfo));
    }
  }

  async function toonTrainingAanmeldingen(sessieInfo) {
    const reserveringen = await haalOp('reserveringen', {
      select: 'leden(naam)', speeldag_id: 'eq.' + sessieInfo.speeldagId, start_tijd: 'eq.' + sessieInfo.start.toISOString(),
    });
    const leden = reserveringen.map(r => r.leden).filter(Boolean);
    toonLedenPopup('Aanmeldingen', leden, sessieInfo.aanmeldingen);
  }

  laadToernooien().catch(e => console.error(e));
</script>
</body>
</html>
