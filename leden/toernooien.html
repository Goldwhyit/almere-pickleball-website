<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Toernooien — Almere Pickleball</title>
<meta name="robots" content="noindex" />
<link rel="icon" type="image/png" href="/assets/img/logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/assets/leden.css" />
<style>
  .landelijk-badge {
    display: inline-block; padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: 700;
    background: rgba(184,134,10,0.12); color: var(--gold-deep); flex-shrink: 0;
  }
  .naam-rij { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
  .mail-knop { background: var(--navy); color: #fff; }
  .link-knop { background: transparent; color: var(--navy); border: 1.5px solid var(--navy); }
  .stat-rij { display: flex; gap: 10px; margin-top: 14px; }
  .stat-tegel {
    flex: 1; background: var(--paper); border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 12px; text-align: center; cursor: default; font-family: inherit; color: inherit;
  }
  .stat-tegel.klikbaar { cursor: pointer; }
  .stat-tegel .waarde { font-size: 20px; font-weight: 700; color: var(--navy); }
  @media (prefers-color-scheme: dark) { .stat-tegel .waarde { color: #8ab6ec; } }
  .stat-tegel .label { font-size: 11.5px; color: var(--ink-muted); margin-top: 2px; }
  .rank-regel { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
  .rank-regel:first-of-type { border-top: none; padding-top: 0; }
  .rank-regel .positie { width: 20px; text-align: center; font-weight: 700; color: var(--ink-muted); font-size: 13px; }
  .rank-regel .avatar {
    width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0;
    background: linear-gradient(135deg, var(--navy), var(--navy-deep)); color: #fff;
    display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px;
  }
  .rank-regel .naam { flex: 1; font-weight: 600; font-size: 14px; }
  .rank-regel .rating { font-weight: 700; font-size: 14px; color: var(--gold-deep); }
  @media (prefers-color-scheme: dark) { .rank-regel .rating { color: var(--gold); } }
  .training-kop { display: flex; align-items: center; gap: 8px; }
  .training-kop .dag { font-weight: 700; font-size: 15px; }
  .training-locatie { font-size: 12.5px; color: var(--ink-muted); margin-top: 2px; }
  .omschrijving { font-size: 13px; color: var(--ink-muted); line-height: 1.5; margin: 6px 0 0; }
  .deelnemers-knop {
    display: flex; align-items: center; gap: 6px; margin-top: 10px; padding: 0;
    background: none; border: none; color: var(--navy); font-family: inherit; font-size: 13px;
    font-weight: 700; cursor: pointer;
  }
  @media (prefers-color-scheme: dark) { .deelnemers-knop { color: #8ab6ec; } }

  /* Landelijk: foto 50/50 over de kaart als er een flyer is */
  .landelijk-kaart {
    display: flex; border-top: 1px solid var(--line); padding: 12px 0; gap: 14px; align-items: stretch;
  }
  .landelijk-kaart:first-of-type { border-top: none; padding-top: 0; }
  .landelijk-kaart.met-foto { padding: 12px 0; }
  .landelijk-kaart .foto-helft {
    flex: 0 0 50%; max-width: 50%; border-radius: 10px; overflow: hidden; background: var(--paper); min-height: 120px;
  }
  .landelijk-kaart .foto-helft img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .landelijk-kaart .tekst-helft { flex: 1; min-width: 0; }
  .landelijk-kaart.zonder-foto .tekst-helft { flex: 1 1 100%; }

  .popup-overlay {
    position: fixed; inset: 0; background: rgba(4,27,51,0.45); z-index: 100;
    display: flex; align-items: flex-end; justify-content: center;
  }
  .popup-kaart {
    background: var(--card); border-radius: 18px 18px 0 0; width: 100%; max-width: 480px;
    max-height: 75vh; overflow-y: auto; padding: 20px;
  }
  @media (min-width: 560px) {
    .popup-overlay { align-items: center; }
    .popup-kaart { border-radius: 18px; }
  }
  .popup-kop { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .popup-kop h3 { margin: 0; font-size: 16px; }
  .popup-sluit { background: none; border: none; font-size: 20px; cursor: pointer; color: var(--ink-muted); }
  .popup-leeg { text-align: center; color: var(--ink-muted); padding: 30px 0; }
</style>
</head>
<body>
<header>
  <img src="/assets/img/logo.png" alt="" width="40" height="39" style="border-radius: 8px;" />
  <div style="flex: 1;">
    <div class="merk">Almere Pickleball</div>
    <h1>Toernooien</h1>
  </div>
  <div id="account-plek"></div>
</header>
<main>
  <div class="kaart">
    <div class="pil-toggle">
      <button id="pil-almere" class="actief">Almere</button>
      <button id="pil-landelijk">Landelijk</button>
      <button id="pil-training">Training</button>
    </div>
    <div id="almere-inhoud" class="laden">Laden…</div>
    <div id="landelijk-inhoud" class="laden" style="display:none">Laden…</div>
    <div id="training-inhoud" class="laden" style="display:none">Laden…</div>
  </div>
</main>
<div id="nav-plek"></div>
<script src="/assets/supabase.js"></script>
<script src="/assets/nav.js"></script>
<script src="/assets/swipe-deck.js"></script>
<script>
  const sessie = vereisSessie();
  initNav('toernooien');

  document.getElementById('pil-almere').addEventListener('click', () => wisselWeergave('almere'));
  document.getElementById('pil-landelijk').addEventListener('click', () => wisselWeergave('landelijk'));
  document.getElementById('pil-training').addEventListener('click', () => wisselWeergave('training'));

  function wisselWeergave(w) {
    document.getElementById('pil-almere').classList.toggle('actief', w === 'almere');
    document.getElementById('pil-landelijk').classList.toggle('actief', w === 'landelijk');
    document.getElementById('pil-training').classList.toggle('actief', w === 'training');
    document.getElementById('almere-inhoud').style.display = w === 'almere' ? '' : 'none';
    document.getElementById('landelijk-inhoud').style.display = w === 'landelijk' ? '' : 'none';
    document.getElementById('training-inhoud').style.display = w === 'training' ? '' : 'none';
    if (w === 'landelijk' && !window.__landelijkGeladen) { window.__landelijkGeladen = true; laadLandelijk(); }
    if (w === 'training' && !window.__trainingGeladen) { window.__trainingGeladen = true; laadTraining(); }
  }

  // --- Almere-toernooien: eigen inschrijving + betaling ---

  const klasseLabels = { open: 'Open', mix: 'Mix', vrouwen: 'Vrouwen', mannen: 'Mannen' };
  const niveauLabels = { open: 'Alle niveaus', beginner: 'Beginner', gevorderd: 'Gevorderd', competitie: 'Competitie' };
  let alleLeden = null;

  function initialen(naam) {
    return naam.split(' ').filter(Boolean).slice(0, 2).map(n => n[0].toUpperCase()).join('');
  }

  function toonLedenPopup(titel, leden, max) {
    const bestaand = document.getElementById('leden-popup-overlay');
    if (bestaand) bestaand.remove();
    const overlay = document.createElement('div');
    overlay.className = 'popup-overlay';
    overlay.id = 'leden-popup-overlay';
    overlay.innerHTML =
      '<div class="popup-kaart">' +
      '<div class="popup-kop"><h3>' + titel + ' — ' + leden.length + (max != null ? '/' + max : '') + '</h3>' +
      '<button type="button" class="popup-sluit" aria-label="Sluiten">✕</button></div>' +
      (leden.length
        ? leden.map(l => '<div class="rank-regel"><span class="avatar">' + initialen(l.naam) + '</span><span class="naam">' + l.naam + '</span></div>').join('')
        : '<div class="popup-leeg">Nog niemand aangemeld.</div>') +
      '</div>';
    overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });
    overlay.querySelector('.popup-sluit').addEventListener('click', () => overlay.remove());
    document.body.appendChild(overlay);
  }

  async function toonToernooiDeelnemers(toernooi) {
    const teams = window.__alleTeams.filter(team => team.toernooi_id === toernooi.id);
    const ids = new Set();
    teams.forEach(tm => { if (tm.speler1_id) ids.add(tm.speler1_id); if (tm.speler2_id) ids.add(tm.speler2_id); });
    let leden = [];
    if (ids.size) {
      leden = await haalOp('leden', { select: 'naam', id: 'in.(' + [...ids].join(',') + ')' });
    }
    toonLedenPopup(toernooi.naam, leden, toernooi.max_deelnemers);
  }

  async function laadToernooien() {
    const el = document.getElementById('almere-inhoud');
    const vandaag = new Date().toISOString().substring(0, 10);
    const toernooien = await haalOp('toernooien', {
      select: 'id,naam,datum,omschrijving,klasse,niveau,inschrijfwijze,inschrijfgeld,inschrijving_open,max_deelnemers',
      datum: 'gte.' + vandaag, order: 'datum.asc',
    });
    if (!toernooien.length) { el.textContent = 'Geen aankomende toernooien.'; return; }

    const ids = toernooien.map(t => t.id).join(',');
    const alleTeams = await haalOp('toernooi_teams', {
      select: 'id,toernooi_id,speler1_id,speler2_id',
      toernooi_id: 'in.(' + ids + ')',
    });
    window.__alleTeams = alleTeams;

    el.innerHTML = toernooien.map((t, i) => {
      const teams = alleTeams.filter(team => team.toernooi_id === t.id);
      const mijnTeam = teams.find(team => team.speler1_id === sessie.user_id || team.speler2_id === sessie.user_id);
      const spelers = teams.reduce((som, tm) => som + (tm.speler2_id ? 2 : 1), 0);
      const details = klasseLabels[t.klasse] + ' · ' + niveauLabels[t.niveau] +
        (t.inschrijfgeld > 0 ? ' · €' + Number(t.inschrijfgeld).toFixed(2) + ' inschrijfgeld' : '');
      let actie;
      if (mijnTeam) {
        actie = '<button class="knop afmelden" data-actie="uitschrijven" data-team="' + mijnTeam.id + '" data-index="' + i + '">Uitschrijven</button>';
      } else if (!t.inschrijving_open) {
        actie = '<button class="knop vol" disabled>Inschrijving gesloten</button>';
      } else if (t.inschrijfwijze === 'paar') {
        actie = '<select data-partner-voor="' + i + '"><option value="">Kies je partner…</option></select>' +
          '<button class="knop aanmelden" data-actie="inschrijven-paar" data-index="' + i + '">Inschrijven</button>';
      } else {
        actie = '<button class="knop aanmelden" data-actie="inschrijven" data-index="' + i + '">Inschrijven</button>';
      }
      const omschrijvingHtml = t.omschrijving ? '<p class="omschrijving">' + t.omschrijving + '</p>' : '';
      return '<div class="toernooi-regel"><div class="naam">' + t.naam + '</div>' +
        '<div class="details">' + new Date(t.datum).toLocaleDateString('nl-NL', { day: 'numeric', month: 'long', year: 'numeric' }) +
        ' · ' + details + '</div>' + omschrijvingHtml +
        '<button type="button" class="deelnemers-knop" data-deelnemers-index="' + i + '">👥 ' + spelers + '/' + t.max_deelnemers + ' deelnemers →</button>' +
        '<div class="actie">' + actie + '</div></div>';
    }).join('') + '<div id="almere-melding"></div>';

    window.__toernooien = toernooien;

    const partnerSelects = el.querySelectorAll('[data-partner-voor]');
    if (partnerSelects.length) {
      if (!alleLeden) {
        alleLeden = await haalOp('leden', { select: 'id,naam', order: 'naam.asc' });
      }
      partnerSelects.forEach(sel => {
        alleLeden.filter(l => l.id !== sessie.user_id).forEach(l => {
          const opt = document.createElement('option');
          opt.value = l.id; opt.textContent = l.naam;
          sel.appendChild(opt);
        });
      });
    }

    el.querySelectorAll('[data-deelnemers-index]').forEach(btn => btn.addEventListener('click', () => {
      toonToernooiDeelnemers(window.__toernooien[Number(btn.dataset.deelnemersIndex)]);
    }));

    el.querySelectorAll('[data-actie]').forEach(btn => btn.addEventListener('click', () => {
      const t = window.__toernooien[Number(btn.dataset.index)];
      if (btn.dataset.actie === 'uitschrijven') uitschrijvenToernooi(btn.dataset.team, btn);
      else if (btn.dataset.actie === 'inschrijven-paar') {
        const sel = el.querySelector('[data-partner-voor="' + btn.dataset.index + '"]');
        if (!sel.value) { toonToernooiMelding('Kies eerst een partner.', true); return; }
        inschrijvenToernooi(t, sel.value, btn);
      } else {
        inschrijvenToernooi(t, null, btn);
      }
    }));
  }

  function toonToernooiMelding(tekst, isFout) {
    const el = document.getElementById('almere-melding');
    if (el) el.innerHTML = '<div class="melding ' + (isFout ? 'fout' : 'ok') + '">' + tekst + '</div>';
  }

  async function inschrijvenToernooi(toernooi, partnerId, btn) {
    btn.disabled = true;
    btn.textContent = 'Bezig…';
    try {
      const team = await voegToe('toernooi_teams', {
        toernooi_id: toernooi.id,
        speler1_id: sessie.user_id,
        ...(partnerId ? { speler2_id: partnerId } : {}),
      });
      await laadToernooien();
      if (toernooi.inschrijfgeld > 0) {
        try {
          const res = await functieAanroepen('create-mollie-payment', { type: 'toernooi', toernooi_team_id: team.id });
          if (res.checkoutUrl) {
            toonToernooiMelding('Ingeschreven! Je wordt doorgestuurd naar de betaalpagina…', false);
            window.location.href = res.checkoutUrl;
            return;
          }
        } catch (betaalFout) {
          toonToernooiMelding('Ingeschreven, maar de betaling kon niet gestart worden: ' + betaalFout.message, true);
          return;
        }
      }
      toonToernooiMelding('Je bent ingeschreven.', false);
    } catch (e) {
      toonToernooiMelding(e.message, true);
      btn.disabled = false;
      btn.textContent = 'Inschrijven';
    }
  }

  async function uitschrijvenToernooi(teamId, btn) {
    btn.disabled = true;
    btn.textContent = 'Bezig…';
    try {
      await verwijder('toernooi_teams', { id: 'eq.' + teamId });
      await laadToernooien();
      toonToernooiMelding('Je bent uitgeschreven.', false);
    } catch (e) {
      toonToernooiMelding(e.message, true);
      btn.disabled = false;
      btn.textContent = 'Uitschrijven';
    }
  }

  // --- Landelijke toernooien: puur informatief, inschrijven via mail/externe link ---

  const urlRegex = /https?:\/\/[^\s)]+/;
  const domeinRegex = /\b[a-zA-Z0-9-]+\.(?:nl|com|org|net)(?:\/[^\s)]*)?/;

  function externeLink(tekst) {
    if (!tekst) return null;
    const urlMatch = tekst.match(urlRegex);
    if (urlMatch) return urlMatch[0];
    const domeinMatch = tekst.match(domeinRegex);
    if (domeinMatch) return 'https://' + domeinMatch[0];
    return null;
  }

  async function inschrijvenPerMail(naam, email) {
    const lid = await haalOp('leden', { select: 'naam,email,telefoon,niveau', id: 'eq.' + sessie.user_id });
    const l = lid[0] || {};
    const regels = ['Naam: ' + (l.naam || ''), 'E-mail: ' + (l.email || '')];
    if (l.niveau) regels.push('Niveau: ' + (niveauLabels[l.niveau] || l.niveau));
    if (l.telefoon) regels.push('Mobiel: ' + l.telefoon);
    const params = new URLSearchParams({ subject: 'Inschrijving ' + naam, body: regels.join('\n') });
    window.location.href = 'mailto:' + email + '?' + params.toString();
  }

  async function laadLandelijk() {
    const el = document.getElementById('landelijk-inhoud');
    const vandaag = new Date().toISOString().substring(0, 10);
    const toernooien = await haalOp('landelijke_toernooien', {
      select: '*', datum_start: 'gte.' + vandaag, order: 'volgorde.asc',
    });
    if (!toernooien.length) { el.textContent = 'Geen aankomende landelijke toernooien.'; return; }

    window.__landelijk = toernooien;
    const kaarten = toernooien.map((t, i) => {
      const start = new Date(t.datum_start);
      const datumTekst = t.datum_eind
        ? start.getDate() + '–' + new Date(t.datum_eind).toLocaleDateString('nl-NL', { day: 'numeric', month: 'long', year: 'numeric' })
        : start.toLocaleDateString('nl-NL', { day: 'numeric', month: 'long', year: 'numeric' });
      const email = t.email && t.email.trim() ? t.email.trim() : null;
      const link = externeLink(t.aanmelden_via);
      const detailRegels = [
        '<div class="details">📅 ' + datumTekst + (t.tijden ? ' · ' + t.tijden : '') + '</div>',
        '<div class="details">📍 ' + t.plaats + (t.adres ? ' · ' + t.adres : '') + '</div>',
      ];
      if (t.toernooi_type) detailRegels.push('<div class="details">' + t.toernooi_type + '</div>');
      if (t.kosten) detailRegels.push('<div class="details">Kosten: ' + t.kosten + '</div>');
      if (t.sluiting_inschrijving) detailRegels.push('<div class="details">Sluiting inschrijving: ' + t.sluiting_inschrijving + '</div>');
      let actie = '';
      if (email || link) {
        actie = '<div class="actie">' +
          (email ? '<button class="knop mail-knop" data-mail-index="' + i + '">Inschrijven</button>' : '') +
          (link ? '<a class="knop link-knop" href="' + link + '" target="_blank" rel="noopener" style="text-decoration:none;text-align:center">Bekijk</a>' : '') +
          '</div>';
      }
      const tekstHelft = '<div class="tekst-helft">' +
        '<div class="naam-rij"><span class="naam">' + t.naam + '</span>' +
        '<span class="landelijk-badge">Landelijk</span></div>' +
        detailRegels.join('') + actie + '</div>';
      if (t.flyer_url) {
        return '<div class="landelijk-kaart met-foto" style="border-top:none">' +
          '<div class="foto-helft"><img src="' + t.flyer_url + '" alt="" /></div>' +
          tekstHelft + '</div>';
      }
      return '<div class="landelijk-kaart zonder-foto" style="border-top:none">' + tekstHelft + '</div>';
    });

    initSwipeDeck(el, kaarten, {
      leegTekst: 'Geen aankomende landelijke toernooien.',
      onRender: (kaartEl) => {
        kaartEl.querySelectorAll('[data-mail-index]').forEach(btn => btn.addEventListener('click', () => {
          const t = window.__landelijk[Number(btn.dataset.mailIndex)];
          inschrijvenPerMail(t.naam, t.email.trim());
        }));
      },
    });
  }

  // --- Training: eerstvolgende trainingsavond + ranglijst-top-10 ---

  const dagnamen = ['maandag', 'dinsdag', 'woensdag', 'donderdag', 'vrijdag', 'zaterdag', 'zondag'];

  async function volgendeTrainingssessie() {
    const speeldagen = await haalOp('speeldagen', {
      select: 'id,weekdag,start_tijd,eind_tijd,locatie,aantal_banen', actief: 'eq.true',
    });
    if (!speeldagen.length) return null;
    const nu = new Date();
    for (let dag = new Date(nu.getFullYear(), nu.getMonth(), nu.getDate());
         dag < new Date(nu.getTime() + 60 * 24 * 3600 * 1000);
         dag.setDate(dag.getDate() + 1)) {
      if (dag.getMonth() === 6) continue;
      const isodow = dag.getDay() === 0 ? 7 : dag.getDay();
      for (const sd of speeldagen) {
        if (sd.weekdag !== isodow) continue;
        const [uur, min] = sd.start_tijd.split(':').map(Number);
        const start = new Date(dag.getFullYear(), dag.getMonth(), dag.getDate(), uur, min);
        if (start < nu) continue;
        const reserveringen = await haalOp('reserveringen', {
          select: 'id', speeldag_id: 'eq.' + sd.id, start_tijd: 'eq.' + start.toISOString(),
        });
        const nAanmeldingen = reserveringen.length;
        const banenNodig = Math.min(Math.max(Math.ceil(nAanmeldingen / 4), 1), 8);
        return {
          speeldagId: sd.id, start, locatie: sd.locatie,
          aanmeldingen: nAanmeldingen,
          banen: Math.min(banenNodig, sd.aantal_banen),
        };
      }
    }
    return null;
  }

  async function laadTraining() {
    const el = document.getElementById('training-inhoud');
    const [sessieInfo, ranking] = await Promise.all([
      volgendeTrainingssessie(),
      haalOp('leden', { select: 'naam,rating', order: 'rating.desc', limit: '10' }),
    ]);

    let sessieHtml = '<p class="details">Geen speelavonden gevonden binnen de komende weken.</p>';
    if (sessieInfo) {
      sessieHtml =
        '<div class="training-kop"><span class="dag">' +
        dagnamen[sessieInfo.start.getDay() === 0 ? 6 : sessieInfo.start.getDay() - 1] + ' ' +
        sessieInfo.start.toLocaleDateString('nl-NL', { day: 'numeric', month: 'long' }) + '</span></div>' +
        '<div class="training-locatie">' + sessieInfo.start.toTimeString().slice(0, 5) + ' · ' + sessieInfo.locatie + '</div>' +
        '<div class="stat-rij">' +
        '<button type="button" class="stat-tegel klikbaar" id="training-aanmeldingen-tegel"><div class="waarde">' + sessieInfo.aanmeldingen + '</div><div class="label">Aanmeldingen →</div></button>' +
        '<div class="stat-tegel"><div class="waarde">' + sessieInfo.banen + '</div><div class="label">Banen ingezet</div></div>' +
        '</div>' +
        '<a class="knop aanmelden" href="/leden/reserveren.html" style="display:block;text-align:center;margin-top:14px;text-decoration:none">Bekijk speelavond →</a>';
    }

    const rankingHtml = ranking.length ? ranking.map((l, i) =>
      '<div class="rank-regel"><span class="positie">' + (i + 1) + '</span>' +
      '<span class="avatar">' + initialen(l.naam) + '</span>' +
      '<span class="naam">' + l.naam + '</span>' +
      '<span class="rating">' + (l.rating != null ? Number(l.rating).toFixed(2) : '–') + '</span></div>'
    ).join('') : '';

    el.innerHTML =
      '<div class="toernooi-regel">' + sessieHtml + '</div>' +
      '<div style="margin-top:20px">' +
      '<h2 style="margin-bottom:2px">Ranglijst</h2>' +
      '<p class="details" style="margin-bottom:10px">Top 10 op basis van rating. Volledige ranglijst op de Leden-pagina.</p>' +
      (rankingHtml || '<p class="details">Nog geen ranglijst beschikbaar.</p>') +
      '</div>';

    const aanmeldingenTegel = document.getElementById('training-aanmeldingen-tegel');
    if (aanmeldingenTegel && sessieInfo) {
      aanmeldingenTegel.addEventListener('click', () => toonTrainingAanmeldingen(sessieInfo));
    }
  }

  async function toonTrainingAanmeldingen(sessieInfo) {
    const reserveringen = await haalOp('reserveringen', {
      select: 'leden(naam)', speeldag_id: 'eq.' + sessieInfo.speeldagId, start_tijd: 'eq.' + sessieInfo.start.toISOString(),
    });
    const leden = reserveringen.map(r => r.leden).filter(Boolean);
    toonLedenPopup('Aanmeldingen', leden, sessieInfo.aanmeldingen);
  }

  laadToernooien().catch(e => console.error(e));
</script>
</body>
</html>
