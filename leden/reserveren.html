<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8" />
<script>(function(){try{var t=localStorage.getItem('pb_thema');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Reserveren — Almere Pickleball</title>
<meta name="robots" content="noindex" />
<link rel="icon" type="image/png" href="/assets/img/logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/assets/leden.css" />
<style>
  .locatie-pil {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    width: 100%; text-align: left; padding: 10px 14px; border-radius: 10px;
    border: 1.5px solid var(--line); background: transparent; color: var(--ink);
    font-family: inherit; font-size: 13.5px; cursor: pointer; margin-bottom: 8px;
  }
  .locatie-pil:last-child { margin-bottom: 0; }
  .locatie-pil .naam { font-weight: 700; }
  .locatie-pil .tijd { color: var(--ink-muted); font-variant-numeric: tabular-nums; }
  .locatie-detail {
    font-size: 12.5px; color: var(--ink-muted); padding: 0 14px 10px; margin-top: -6px; display: none;
  }
  .locatie-detail.open { display: block; }
  .locatie-detail div { padding: 2px 0; }
  .banner {
    padding: 12px 14px; border-radius: 10px; font-size: 13px; margin-bottom: 14px;
    background: rgba(228,29,35,0.08); color: var(--accent); border: 1px solid rgba(228,29,35,0.2);
  }
  .speeldag-regel.geblokkeerd { opacity: 0.65; }
  .speeldag-regel .off-dag-actie { display: flex; flex-direction: column; gap: 4px; align-items: flex-end; }
  .speeldag-regel .off-dag-actie a { font-size: 11px; color: var(--navy); text-decoration: none; font-weight: 700; }
  @media (prefers-color-scheme: dark) { .speeldag-regel .off-dag-actie a { color: #8ab6ec; } }
  .popup-overlay {
    position: fixed; inset: 0; background: rgba(4,27,51,0.45); z-index: 100;
    display: flex; align-items: center; justify-content: center; padding: 20px;
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  }
  .popup-kaart {
    background: var(--glas-oppervlak); -webkit-backdrop-filter: blur(24px) saturate(160%);
    backdrop-filter: blur(24px) saturate(160%); border: 1px solid var(--glas-rand);
    border-radius: 22px; width: 100%; max-width: 420px;
    max-height: 85vh; overflow-y: auto; padding: 22px;
    box-shadow: 0 20px 50px rgba(4,27,51,0.35), inset 0 1px 0 var(--glas-hooglicht-boven), inset 0 -1px 0 var(--glas-hooglicht-onder);
  }
  .popup-kaart h3 { margin: 0 0 10px; font-size: 16px; }
  .stat-tegel {
    background: var(--paper); border: 1px solid var(--line); border-radius: 10px;
    padding: 12px 10px; text-align: center;
  }
  .stat-tegel .waarde { font-size: 22px; font-weight: 700; color: var(--navy); }
  @media (prefers-color-scheme: dark) { .stat-tegel .waarde { color: #8ab6ec; } }
  .stat-tegel .label { font-size: 11px; color: var(--ink-muted); margin-top: 2px; }
  .dag-keuze { display: flex; gap: 10px; margin-top: 14px; }
  .dag-keuze button {
    flex: 1; padding: 14px; border-radius: 10px; border: 1.5px solid var(--line); background: transparent;
    color: var(--ink); font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer; text-transform: capitalize;
  }
  .dag-keuze button:hover { border-color: var(--navy); }
  .i-inline { width: 14px; height: 14px; vertical-align: -2px; margin-right: 3px; flex-shrink: 0; }
</style>
</head>
<body>
<header>
  <img src="/assets/img/logo.png" alt="" width="40" height="39" style="border-radius: 8px;" />
  <div style="flex: 1; min-width: 0;">
    <div class="merk"></div>
    <h1 data-i18n="navReserveren">Reserveren</h1>
  </div>
  <div id="account-plek"></div>
</header>
<main>
  <div class="kaart">
    <h2>Locaties</h2>
    <div id="locaties-inhoud" class="laden">Laden…</div>
  </div>
  <div class="kaart">
    <h2>Speelavonden</h2>
    <div class="swipe-banner">
      <span class="helft"><span class="pijl">←</span> <span>Swipen naar links is <strong>afmelden</strong></span></span>
      <span class="scheiding"></span>
      <span class="helft rechts"><span>Naar rechts is <strong>aanmelden</strong></span> <span class="pijl">→</span></span>
    </div>
    <div id="speeldagen-deck" class="laden">Laden…</div>
    <div id="speeldagen-melding"></div>
  </div>
</main>
<div id="nav-plek"></div>
<script src="/assets/supabase.js"></script>
<script src="/assets/theme.js"></script>
<script src="/assets/i18n.js"></script>
<script src="/assets/nav.js"></script>
<script src="/assets/swipe-deck.js"></script>
<script>
  const sessie = vereisSessie();
  initNav('reserveren');
  let mijnAbonnement = null;

  const dagnamen = ['maandag', 'dinsdag', 'woensdag', 'donderdag', 'vrijdag', 'zaterdag', 'zondag'];

  /// Genereert de komende speelavonden (net als reserveren_screen.dart in de
  /// app): per actieve speeldag, elke week tot en met [weken] weken vooruit,
  /// juli overgeslagen (buiten het seizoen, zie valideer_speeldag()).
  function volgendeSessies(speeldagen, weken) {
    const nu = new Date();
    const eind = new Date(nu); eind.setDate(eind.getDate() + weken * 7);
    const sessies = [];
    for (let dag = new Date(nu.getFullYear(), nu.getMonth(), nu.getDate()); dag < eind; dag.setDate(dag.getDate() + 1)) {
      if (dag.getMonth() === 6) continue; // juli = index 6
      const isodow = dag.getDay() === 0 ? 7 : dag.getDay();
      for (const sd of speeldagen) {
        if (sd.weekdag !== isodow) continue;
        const [suur, smin] = sd.start_tijd.split(':').map(Number);
        const start = new Date(dag.getFullYear(), dag.getMonth(), dag.getDate(), suur, smin);
        if (start < nu) continue;
        const [euur, emin] = sd.eind_tijd.split(':').map(Number);
        const eindTijd = new Date(dag.getFullYear(), dag.getMonth(), dag.getDate(), euur, emin);
        sessies.push({ speeldagId: sd.id, start, eind: eindTijd, locatie: sd.locatie, maxSpelers: sd.max_spelers });
      }
    }
    sessies.sort((a, b) => a.start - b.start);
    return sessies;
  }

  async function laadAbonnement() {
    const rows = await haalOp('lid_abonnementen', {
      select: 'id,vaste_dag,abonnementen(vorm,sessies_per_week)', lid_id: 'eq.' + sessie.user_id, status: 'eq.actief', limit: '1',
    });
    mijnAbonnement = rows.length ? rows[0] : null;
  }

  function isEenxPerWeek(abo) {
    return !!(abo && abo.abonnementen && ['jaar', 'maand'].includes(abo.abonnementen.vorm) && abo.abonnementen.sessies_per_week === 1);
  }

  function toonPopup(html) {
    const bestaand = document.getElementById('reserveren-popup');
    if (bestaand) bestaand.remove();
    const overlay = document.createElement('div');
    overlay.className = 'popup-overlay';
    overlay.id = 'reserveren-popup';
    overlay.innerHTML = '<div class="popup-kaart">' + html + '</div>';
    document.body.appendChild(overlay);
    return overlay;
  }

  /// Bestaande en nieuwe 1x-per-week-leden moeten een vaste dag kiezen
  /// vóórdat ze de speelavonden kunnen zien (verplicht, geen "later"-optie).
  async function dwingVasteDagAf(speeldagen) {
    if (!isEenxPerWeek(mijnAbonnement) || mijnAbonnement.vaste_dag) return;
    const weekdagen = [...new Set(speeldagen.map(sd => sd.weekdag))].sort();
    const overlay = toonPopup(
      '<h3>Kies je vaste speeldag</h3>' +
      '<p class="details">Je abonnement is voor 1x per week. Kies of je op dinsdag of donderdag speelt — ' +
      'spelen op de andere dag kan altijd nog, tegen het losse sessietarief, of door over te stappen naar 2x per week.</p>' +
      '<div class="dag-keuze">' +
      weekdagen.map(w => '<button type="button" data-dag="' + w + '">' + dagnamen[w - 1] + '</button>').join('') +
      '</div><div id="vaste-dag-melding"></div>'
    );
    overlay.querySelectorAll('[data-dag]').forEach(btn => btn.addEventListener('click', async () => {
      try {
        await rpc('kies_vaste_dag', { p_dag: Number(btn.dataset.dag) });
        mijnAbonnement.vaste_dag = Number(btn.dataset.dag);
        overlay.remove();
        await laadSpeeldagen();
      } catch (e) {
        document.getElementById('vaste-dag-melding').innerHTML = '<div class="melding fout">' + e.message + '</div>';
      }
    }));
  }

  async function toonUpgradePopup() {
    const overlay = toonPopup('<h3>Overstappen naar 2x per week</h3><p class="details">Even het bedrag berekenen…</p>');
    try {
      const rows = await rpc('bereken_upgrade_bedrag', { p_lid_abonnement_id: mijnAbonnement.id });
      const info = Array.isArray(rows) ? rows[0] : rows;
      overlay.querySelector('.popup-kaart').innerHTML =
        '<h3>Overstappen naar 2x per week</h3>' +
        '<p class="details">Je stapt over naar <strong>' + info.nieuw_abonnement_naam + '</strong>. ' +
        'Voor de rest van de huidige periode betaal je het geprorateerde verschil:</p>' +
        '<div class="stat-tegel" style="margin:10px 0"><div class="waarde">€' + Number(info.bedrag).toFixed(2) + '</div><div class="label">Te betalen</div></div>' +
        '<button class="knop aanmelden" id="upgrade-betaal-knop" style="display:block;width:100%">Betalen en overstappen</button>' +
        '<button class="knop" id="upgrade-annuleer-knop" style="display:block;width:100%;margin-top:8px;background:transparent">Annuleren</button>' +
        '<div id="upgrade-melding"></div>';
      document.getElementById('upgrade-annuleer-knop').addEventListener('click', () => overlay.remove());
      document.getElementById('upgrade-betaal-knop').addEventListener('click', async (e) => {
        e.target.disabled = true; e.target.textContent = 'Bezig…';
        try {
          const res = await functieAanroepen('create-mollie-payment', { type: 'abonnement_upgrade', lid_abonnement_id: mijnAbonnement.id });
          if (res.checkoutUrl) { window.location.href = res.checkoutUrl; return; }
          throw new Error(res.error || 'Kon betaling niet starten.');
        } catch (fout) {
          document.getElementById('upgrade-melding').innerHTML = '<div class="melding fout">' + fout.message + '</div>';
          e.target.disabled = false; e.target.textContent = 'Betalen en overstappen';
        }
      });
    } catch (e) {
      overlay.querySelector('.popup-kaart').innerHTML = '<h3>Overstappen naar 2x per week</h3><div class="melding fout">' + e.message + '</div>';
    }
  }

  function toonLocaties(speeldagen) {
    const el = document.getElementById('locaties-inhoud');
    if (!speeldagen.length) { el.textContent = 'Geen locaties gevonden.'; return; }
    el.innerHTML = speeldagen.map((sd, i) =>
      '<button type="button" class="locatie-pil" data-locatie-index="' + i + '">' +
      '<span class="naam">' + escapeHtml(sd.locatie) + '</span>' +
      '<span class="tijd">' + dagnamen[sd.weekdag - 1] + ' ' + sd.start_tijd.slice(0, 5) + '–' + sd.eind_tijd.slice(0, 5) + '</span>' +
      '</button>' +
      '<div class="locatie-detail" id="locatie-detail-' + i + '">' +
      '<div><svg class="i-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="1"/><path d="M9 21v-4h6v4M9 7h.01M15 7h.01M9 11h.01M15 11h.01"/></svg>' + sd.aantal_banen + ' banen beschikbaar</div>' +
      (sd.adres ? '<div><svg class="i-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-7.58 7-12A7 7 0 0 0 5 9c0 4.42 7 12 7 12Z"/><circle cx="12" cy="9" r="2.5"/></svg>' + escapeHtml(sd.adres) + '</div>' : '') +
      '</div>'
    ).join('');
    el.querySelectorAll('[data-locatie-index]').forEach(btn => btn.addEventListener('click', () => {
      document.getElementById('locatie-detail-' + btn.dataset.locatieIndex).classList.toggle('open');
    }));
  }

  let speeldagenDeck = null;

  async function laadSpeeldagen() {
    const el = document.getElementById('speeldagen-deck');
    const speeldagen = await haalOp('speeldagen', { select: 'id,weekdag,start_tijd,eind_tijd,locatie,adres,aantal_banen,max_spelers', actief: 'eq.true', order: 'weekdag.asc' });
    if (!speeldagen.length) { el.textContent = 'Geen speelavonden gevonden.'; return; }
    toonLocaties(speeldagen);
    await dwingVasteDagAf(speeldagen);
    const sessies = volgendeSessies(speeldagen, 5).slice(0, 8);
    window.__sessies = sessies;
    if (!sessies.length) { el.textContent = 'Geen aankomende speelavonden binnen het seizoen.'; return; }

    const vanaf = sessies[0].start.toISOString();
    const tot = sessies[sessies.length - 1].eind.toISOString();
    const vandaag = new Date().toISOString().substring(0, 10);
    const [reserveringen, blokkades] = await Promise.all([
      haalOp('reserveringen', { select: 'id,lid_id,start_tijd', and: '(start_tijd.gte.' + vanaf + ',start_tijd.lte.' + tot + ')' }),
      haalOp('speeldag_uitzonderingen', { select: 'speeldag_id,datum,reden', datum: 'gte.' + vandaag }),
    ]);

    const isOffDag = isEenxPerWeek(mijnAbonnement);

    const kaarten = sessies.map((s, i) => {
      // Vergelijk als Date, niet als string: PostgREST geeft "+00:00" terug,
      // Date.toISOString() geeft altijd "Z" — twee verschillende strings
      // voor hetzelfde moment, dus een tekstvergelijking mist een bestaande
      // aanmelding en veroorzaakt een duplicate-key-fout bij nogmaals aanmelden.
      const opDezeAvond = reserveringen.filter(r => new Date(r.start_tijd).getTime() === s.start.getTime());
      const mijnReservering = opDezeAvond.find(r => r.lid_id === sessie.user_id);
      const vol = opDezeAvond.length >= s.maxSpelers;
      const iso = s.start.toISOString().substring(0, 10);
      const blokkade = blokkades.find(b => b.speeldag_id === s.speeldagId && b.datum === iso);
      const weekdag = s.start.getDay() === 0 ? 7 : s.start.getDay();
      const isOpNietVasteDag = isOffDag && mijnAbonnement.vaste_dag && weekdag !== mijnAbonnement.vaste_dag;

      let knop;
      if (blokkade) {
        knop = '<button class="knop vol" disabled>Geblokkeerd</button>';
      } else if (mijnReservering) {
        knop = '<button class="knop afmelden" data-actie="afmelden" data-index="' + i + '" data-id="' + mijnReservering.id + '">Afmelden</button>';
      } else if (vol) {
        knop = '<button class="knop vol" disabled>Vol</button>';
      } else if (isOpNietVasteDag) {
        knop = '<div class="off-dag-actie">' +
          '<button class="knop aanmelden" data-actie="aanmelden-bijbetalen" data-index="' + i + '">Aanmelden (+ eenmalig €8,50)</button>' +
          '<a href="#" data-upgrade="1">of overstappen naar 2x/week</a></div>';
      } else {
        knop = '<button class="knop aanmelden" data-actie="aanmelden" data-index="' + i + '">Aanmelden</button>';
      }
      const locatieKlasse = s.locatie.includes('Haven') ? 'locatie-haven' : s.locatie.includes('Noordenplassen') ? 'locatie-noordenplassen' : '';
      return '<div class="speeldag-regel' + (blokkade ? ' geblokkeerd' : '') + (locatieKlasse ? ' ' + locatieKlasse : '') + '" style="border-top:none;padding-top:0">' +
        '<span><span class="dag" style="font-size:17px">' + dagnamen[weekdag - 1] + ' ' +
        s.start.toLocaleDateString('nl-NL', { day: 'numeric', month: 'long' }) + '</span><br>' +
        '<span class="locatie"><span class="locatie-dot ' + locatieKlasse + '"></span>' + escapeHtml(s.locatie) + ' · ' + opDezeAvond.length + '/' + s.maxSpelers + '</span>' +
        (blokkade ? '<div class="banner" style="margin:6px 0 0"><svg class="i-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><line x1="5.8" y1="5.8" x2="18.2" y2="18.2"/></svg>Geannuleerd: ' + escapeHtml(blokkade.reden) + '</div>' : '') +
        '</span>' + knop + '</div>';
    });

    function koppelKaartEvents(kaartEl) {
      // Zelfde kaartkleur-per-locatie als de app (Reserveren-scherm): de
      // locatieklasse van de binnenste rij wordt gespiegeld naar de hele
      // swipe-kaart, zodat het volledige kaartoppervlak de kleur krijgt
      // i.p.v. alleen de accentrand.
      const regel = kaartEl.querySelector('.speeldag-regel');
      kaartEl.classList.toggle('locatie-haven', !!regel?.classList.contains('locatie-haven'));
      kaartEl.classList.toggle('locatie-noordenplassen', !!regel?.classList.contains('locatie-noordenplassen'));
      kaartEl.querySelectorAll('[data-actie]').forEach(btn => btn.addEventListener('click', () => {
        if (btn.dataset.actie === 'afmelden') afmelden(btn.dataset.id, btn);
        else aanmelden(window.__sessies[Number(btn.dataset.index)], btn, btn.dataset.actie === 'aanmelden-bijbetalen');
      }));
      kaartEl.querySelectorAll('[data-upgrade]').forEach(a => a.addEventListener('click', (e) => {
        e.preventDefault();
        toonUpgradePopup();
      }));
    }

    // initSwipeDeck's onRender-callback (hieronder ingesteld) koppelt de
    // knop-events al opnieuw bij elke render, dus herlaad() alleen is genoeg
    // — geen aparte handmatige koppeling nodig (zou dubbele listeners geven).
    if (speeldagenDeck) {
      speeldagenDeck.herlaad(kaarten);
    } else {
      speeldagenDeck = initSwipeDeck(el, kaarten, {
        leegTekst: 'Geen aankomende speelavonden.',
        onRender: koppelKaartEvents,
        badgeRechts: 'Aanmelden', badgeLinks: 'Afmelden',
        // Hergebruikt de knop die al op de kaart staat (die kent zelf de
        // juiste actie — normaal/bijbetalen — en toont de juiste melding).
        // Geen knop beschikbaar (vol/geblokkeerd/geen aanmelding): niets te
        // doen, gewoon de actuele stand opnieuw ophalen.
        onSwipeRechts: () => {
          const btn = el.querySelector('.swipe-kaart [data-actie^="aanmelden"]');
          if (btn) btn.click(); else laadSpeeldagen();
        },
        onSwipeLinks: () => {
          const btn = el.querySelector('.swipe-kaart [data-actie="afmelden"]');
          if (btn) btn.click(); else laadSpeeldagen();
        },
      });
    }
  }

  function toonSpeeldagMelding(tekst, isFout) {
    const el = document.getElementById('speeldagen-melding');
    if (el) el.innerHTML = '<div class="melding ' + (isFout ? 'fout' : 'ok') + '">' + tekst + '</div>';
  }

  async function aanmelden(sessieInfo, btn, bijbetalen) {
    btn.disabled = true;
    btn.textContent = 'Bezig…';
    try {
      const nieuw = await voegToe('reserveringen', {
        speeldag_id: sessieInfo.speeldagId,
        lid_id: sessie.user_id,
        start_tijd: sessieInfo.start.toISOString(),
        eind_tijd: sessieInfo.eind.toISOString(),
      });
      await laadSpeeldagen();
      if (bijbetalen || (mijnAbonnement && mijnAbonnement.abonnementen && mijnAbonnement.abonnementen.vorm === 'sessie')) {
        try {
          const res = await functieAanroepen('create-mollie-payment', { type: 'sessie', reservering_id: nieuw.id });
          if (res.checkoutUrl) {
            toonSpeeldagMelding('Aangemeld! Je wordt doorgestuurd naar de betaalpagina…', false);
            window.location.href = res.checkoutUrl;
            return;
          }
        } catch (betaalFout) {
          toonSpeeldagMelding('Aangemeld, maar de betaling kon niet gestart worden: ' + betaalFout.message, true);
          return;
        }
      }
      toonSpeeldagMelding('Je bent aangemeld.', false);
    } catch (e) {
      toonSpeeldagMelding(e.message, true);
      btn.disabled = false;
      btn.textContent = 'Aanmelden';
    }
  }

  async function afmelden(reserveringId, btn) {
    btn.disabled = true;
    btn.textContent = 'Bezig…';
    try {
      await verwijder('reserveringen', { id: 'eq.' + reserveringId });
      await laadSpeeldagen();
      toonSpeeldagMelding('Je bent afgemeld.', false);
    } catch (e) {
      toonSpeeldagMelding(e.message, true);
      btn.disabled = false;
      btn.textContent = 'Afmelden';
    }
  }

  (async () => {
    await laadAbonnement();
    await laadSpeeldagen();
  })().catch(e => console.error(e));
</script>
</body>
</html>
