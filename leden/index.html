<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8" />
<script>(function(){try{var t=localStorage.getItem('pb_thema');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Inloggen — Almere Pickleball</title>
<meta name="description" content="Log in bij het ledenportaal van Almere Pickleball om je speelavonden te beheren, in te schrijven voor toernooien en je abonnement te bekijken." />
<meta name="robots" content="noindex" />
<link rel="canonical" href="https://www.almerepickleball.nl/leden/" />
<meta property="og:type" content="website" />
<meta property="og:title" content="Ledenportaal — Almere Pickleball" />
<meta property="og:description" content="Log in bij het ledenportaal van Almere Pickleball om je speelavonden te beheren, in te schrijven voor toernooien en je abonnement te bekijken." />
<meta property="og:url" content="https://www.almerepickleball.nl/leden/" />
<meta property="og:image" content="https://www.almerepickleball.nl/assets/img/logo.png" />
<link rel="icon" type="image/png" href="/assets/img/logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --navy: #2457ff; --navy-deep: #003d82; --gold: #ffd23f; --gold-deep: #b8860a;
    --paper: #f5f8fc; --card: #ffffff; --ink: #0b1420; --ink-muted: #5b6b7d; --line: rgba(4,27,51,0.1);
    --danger: var(--accent);
  }
  @media (prefers-color-scheme: dark) {
    :root { --paper: #071224; --card: #101d30; --ink: #eef3f9; --ink-muted: #9fb2c4; --line: rgba(255,255,255,0.12); }
  }
  :root[data-theme="dark"] { --paper: #071224; --card: #101d30; --ink: #eef3f9; --ink-muted: #9fb2c4; --line: rgba(255,255,255,0.12); }
  :root[data-theme="light"] { --paper: #f5f8fc; --card: #ffffff; --ink: #0b1420; --ink-muted: #5b6b7d; --line: rgba(4,27,51,0.1); }
  #thema-plek {
    position: fixed; top: 16px; right: 16px; z-index: 50; display: flex; gap: 8px; align-items: center;
  }
  .thema-knop, .taal-knop {
    background: var(--card); border: 1.5px solid var(--line); border-radius: 999px; height: 38px;
    cursor: pointer; color: var(--ink); box-shadow: 0 2px 8px rgba(0,0,0,0.08); font-family: inherit;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .thema-knop { width: 38px; }
  .thema-knop svg { width: 17px; height: 17px; }
  .taal-knop { min-width: 38px; padding: 0 12px; font-size: 12.5px; font-weight: 700; letter-spacing: 0.02em; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: 'Manrope', -apple-system, sans-serif; background: var(--paper); color: var(--ink);
    padding: 24px;
  }
  .kaart {
    width: 100%; max-width: 380px; background: var(--card); border: 1px solid var(--line);
    border-radius: 20px; padding: 32px 28px; box-shadow: 0 4px 24px rgba(0,0,0,0.06);
  }
  .merk { font-family: 'Unbounded', sans-serif; font-weight: 500; font-size: 12px; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--navy); text-align: center; }
  @media (prefers-color-scheme: dark) { .merk { color: #8ab6ec; } }
  h1 { font-family: 'Unbounded', sans-serif; font-size: 22px; margin: 8px 0 4px; text-align: center; }
  p.uitleg { text-align: center; color: var(--ink-muted); font-size: 14px; margin: 0 0 24px; }
  label { display: block; font-size: 13px; font-weight: 600; color: var(--ink-muted); margin-top: 14px; }
  label:first-of-type { margin-top: 0; }
  input {
    width: 100%; margin-top: 6px; padding: 12px 14px; border-radius: 10px; border: 1.5px solid var(--line);
    background: var(--paper); color: var(--ink); font-size: 15px;
  }
  button.primair {
    width: 100%; margin-top: 22px; padding: 13px; border: none; border-radius: 10px;
    background: var(--gold); color: #241a02; font-size: 15px; font-weight: 700; cursor: pointer;
  }
  button.primair:disabled { opacity: 0.5; cursor: default; }
  .fout { color: var(--danger); font-size: 13.5px; margin-top: 12px; text-align: center; }
  .terug { display: block; text-align: center; margin-top: 20px; font-size: 13px; color: var(--ink-muted); text-decoration: none; }
  .intro-video-overlay {
    position: fixed; inset: 0; z-index: 200; background: #000;
  }
  .intro-video-overlay:not([hidden]) { display: flex; align-items: center; justify-content: center; }
  .intro-video-overlay video { width: 100%; height: 100%; object-fit: contain; }
  .intro-skip {
    position: absolute; bottom: max(20px, env(safe-area-inset-bottom, 0px)); right: 20px;
    background: rgba(255,255,255,0.15); color: #fff; border: 1px solid rgba(255,255,255,0.3);
    border-radius: 999px; padding: 9px 16px; font-size: 13px; font-weight: 600; cursor: pointer;
    font-family: inherit; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
</style>
</head>
<body>
<div id="thema-plek"></div>
<div class="kaart">
  <img src="/assets/img/logo.png" alt="Almere Pickleball" width="72" height="70" style="display: block; margin: 0 auto 10px;" />
  <div class="merk">Almere Pickleball</div>
  <h1 data-i18n="titelInloggen">Ledenportaal</h1>
  <p class="uitleg">Log in met je bestaande clubaccount (dezelfde gegevens als de app).</p>
  <form id="login-form">
    <label for="email" data-i18n="emailLabel">E-mailadres</label>
    <input type="email" id="email" autocomplete="email" required />
    <label for="wachtwoord" data-i18n="wachtwoordLabel">Wachtwoord</label>
    <input type="password" id="wachtwoord" autocomplete="current-password" required />
    <button type="submit" class="primair" id="login-knop" data-i18n="inloggen">Inloggen</button>
    <div class="fout" id="fout-melding"></div>
    <div id="herstel-melding"></div>
  </form>
  <a href="#" id="wachtwoord-vergeten-link" class="terug" data-i18n="wachtwoordVergeten" style="margin-top:14px">Wachtwoord vergeten?</a>
  <a class="terug" href="/" data-i18n="terugNaarSite">← Terug naar de website</a>
  <p style="text-align:center;margin-top:14px;font-size:12px">
    <a href="/veelgestelde-vragen/" style="color:var(--ink-muted)" data-i18n="veelgesteldeVragen">Veelgestelde vragen</a>
    <span style="color:var(--ink-muted)"> · </span>
    <a href="/privacy/" style="color:var(--ink-muted)" data-i18n="titelPrivacy">Privacybeleid</a>
  </p>
</div>
<div id="intro-video-overlay" class="intro-video-overlay" hidden>
  <video id="intro-video" src="/assets/video/intro.mp4" autoplay muted playsinline></video>
  <button type="button" id="intro-skip" class="intro-skip">Overslaan →</button>
</div>
<script src="/assets/supabase.js"></script>
<script>
  if (isIngelogd()) window.location.href = '/leden/home.html';

  // Speelt de intro-video af na een geslaagde login, en gaat pas daarna
  // naar het homescherm — met een skip-knop en een veiligheidstimer voor
  // het geval de video niet kan afspelen (bijv. geblokkeerd door de
  // browser of een laad-fout), zodat inloggen nooit vast kan lopen.
  function toonIntroVideo() {
    const overlay = document.getElementById('intro-video-overlay');
    const video = document.getElementById('intro-video');
    let gestart = false;
    const ga = () => {
      if (gestart) return;
      gestart = true;
      window.location.href = '/leden/home.html';
    };
    overlay.hidden = false;
    document.getElementById('intro-skip').addEventListener('click', ga);
    video.addEventListener('ended', ga);
    video.addEventListener('error', ga);
    video.play().catch(ga);
    setTimeout(ga, 12000);
  }

  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const knop = document.getElementById('login-knop');
    const foutEl = document.getElementById('fout-melding');
    foutEl.textContent = '';
    knop.disabled = true;
    knop.textContent = 'Bezig…';
    try {
      await inloggen(document.getElementById('email').value.trim(), document.getElementById('wachtwoord').value);
      toonIntroVideo();
    } catch (err) {
      foutEl.textContent = err.message;
      knop.disabled = false;
      knop.textContent = 'Inloggen';
    }
  });

  document.getElementById('wachtwoord-vergeten-link').addEventListener('click', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    const herstelEl = document.getElementById('herstel-melding');
    const foutEl = document.getElementById('fout-melding');
    foutEl.textContent = '';
    if (!email) {
      foutEl.textContent = vertaal('vulEerstEmailIn');
      document.getElementById('email').focus();
      return;
    }
    try {
      await stuurWachtwoordHerstel(email);
      herstelEl.innerHTML = '<div class="fout" style="color:#148c5a">' + vertaal('wachtwoordMailVerstuurd') + '</div>';
    } catch (err) {
      foutEl.textContent = err.message;
    }
  });
</script>
<script src="/assets/i18n.js"></script>
<script src="/assets/theme.js"></script>
<script>initThemeKnop('thema-plek');</script>
<script>initTaalKnop('thema-plek');</script>
</body>
</html>
